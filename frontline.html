<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Teatime Shift, Frontline Care Simulation</title>
<meta name="description" content="A first-person frontline simulation on preventing choking at a mealtime in adult social care. Fictional proof of concept.">
<style>
/* ============================================================
   PracticE Ready, Frontline simulation, "The Teatime Shift".
   Shares The Risk Chain v7 "NHS clinical" design tokens so the
   two seats read as one product. Light is primary; a clinical
   dark variant sits on the theme toggle.
   ============================================================ */
/* ------------------------------------------------------------------
   Palette: "Dusk". A calm blue-grey backdrop drawn from the windows
   at teatime, so the warm care-home photography (amber lamplight, oak,
   the worker's navy jumper) glows against it. Four zone identities,
   each its own surface + accent so no two panels read alike:
     chrome  = navy  (top bar + records header: the "system" layer)
     monitor = navy HUD instrument panel (metric strip: things to watch)
     read    = cool card, navy header, slate chips (evidence: things to read)
     do      = amber (the scene + options: things to do; via --teal)
   Cards lift off the ground on real elevation, in light and dark.
   ------------------------------------------------------------------ */
:root{
  --ground:#e4e9f0; --ground-2:#f4f7fb; --surface:#ffffff; --surface-2:#eef2f6; --surface-3:#dde4ec;
  --ink:#1e2e3b; --ink-2:#46586a; --ink-3:#5c6d7d; --ink-4:#7d8ea0;
  --line:#d6dfe8; --line-2:#e8edf2;
  --navy:#22374f; --navy-2:#15263b; --navy-ink:#ffffff;
  --teal:#a9741f; --teal-strong:#8a5f18; --teal-tint:#faecd2; --teal-deep:#6f4c12;
  --go:#2e7a35; --go-sh:#1b5223; --kicker-bg:#faecd2; --kicker-line:#e6d3ad;
  --z-monitor:#3f6486; --z-monitor-2:#33526e; --z-monitor-tint:#ffffff;
  --z-read:#1a6a72; --z-read-2:#155158; --z-read-tint:#e5f1f1; --chip-bg:#1a6a72; --chip-ink:#ffffff; --read-head:#1c6d75; --read-head-2:#14535a;
  --z-do:#b87c20; --z-do-2:#96631a; --z-do-tint:#faecd2;
  --hud-1:#3c4a58; --hud-2:#2b3742; --hud-label:rgba(208,220,232,.72); --gauge-track:rgba(122,200,230,.30);
  --good:#3f7d38; --good-tint:#e6efe0; --good-line:#bcd8b1;
  --warn:#c06a10; --warn-tint:#f7ead2; --warn-line:#eece9b;
  --bad:#c0392b; --bad-tint:#f7e4df; --bad-line:#eec5bd;
  --info:#1a6a72; --info-tint:#e5f1f1;
  --g-red:#e2604e; --g-amber:#f0ad2e; --g-green:#5fbf53;
  --shadow:0 1px 2px rgba(24,42,66,.06),0 3px 10px rgba(24,42,66,.08);
  --shadow-lg:0 2px 6px rgba(24,42,66,.08),0 24px 50px rgba(24,42,66,.18);
  --r:9px; --r-sm:6px; --r-lg:15px;
  /* One humanist sans across every surface — the Frutiger / Clearview
     signage lineage, chosen for legibility at small sizes. Segoe UI is the
     closest default on Windows; Helvetica / Arial are the universal
     fallbacks. --serif and --scene are aliases so nothing reads as a second
     typeface; the whole product is one face. */
  --sans:"Frutiger","Frutiger LT","Frutiger Neue LT Pro","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:var(--sans);
  --scene:var(--sans);
  --mono:"Cascadia Code",ui-monospace,"SFMono-Regular",Consolas,monospace;
  /* Type scale: nine deliberate steps. Every font-size below snaps to one
     of these, so the interface reads as one system, not ad-hoc values. */
  --t-hero:38px; --t-h1:28px; --t-h2:21px; --t-h3:17px;
  --t-body:15.5px; --t-sm:14px; --t-cap:13px; --t-eyebrow:11.5px; --t-nano:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#171f2a; --ground-2:#243140; --surface:#2b3948; --surface-2:#35434f; --surface-3:#41505e;
    --ink:#eef4f9; --ink-2:#c4d0db; --ink-3:#9fb0bd; --ink-4:#82929f;
    --line:#3c4a58; --line-2:#313e4b;
    --navy:#233a54; --navy-2:#152840; --navy-ink:#eef4f9;
    --teal:#e0a24a; --teal-strong:#ecb469; --teal-tint:#332d22; --teal-deep:#c2872f;
  --go:#2b7d3b; --go-sh:#123f1c; --kicker-bg:rgba(224,162,74,.13); --kicker-line:rgba(224,162,74,.32);
    --z-monitor:#7ea6c8; --z-monitor-2:#98b7d2; --z-monitor-tint:#2c3f52;
    --z-read:#5ac0c7; --z-read-2:#7bd3d9; --z-read-tint:#153230; --chip-bg:#3ba7af; --chip-ink:#0b2321; --read-head:#17656d; --read-head-2:#0f4a51;
    --z-do:#e0a24a; --z-do-2:#eab868; --z-do-tint:#342a13;
    --hud-1:#3a4650; --hud-2:#28323b; --hud-label:rgba(208,220,232,.7); --gauge-track:rgba(122,200,230,.26);
    --good:#5fbf53; --good-tint:#213a20; --good-line:#356a3a;
    --warn:#e0a02a; --warn-tint:#3a2f14; --warn-line:#5f4a1c;
    --bad:#e2604e; --bad-tint:#3a221c; --bad-line:#61332b;
    --info:#5ac0c7; --info-tint:#153230;
    --g-red:#e2604e; --g-amber:#f0ad2e; --g-green:#5fbf53;
    --shadow:0 2px 6px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.4);
    --shadow-lg:0 10px 24px rgba(0,0,0,.4),0 28px 56px rgba(0,0,0,.5);
  }
}

  --ground:#e4e9f0; --ground-2:#f4f7fb; --surface:#ffffff; --surface-2:#eef2f6; --surface-3:#dde4ec;

:root[data-theme="dark"]{
  --ground:#171f2a; --ground-2:#243140; --surface:#2b3948; --surface-2:#35434f; --surface-3:#41505e;

  --navy:#233a54; --navy-2:#152840; --navy-ink:#eef4f9;
  --teal:#e0a24a; --teal-strong:#ecb469; --teal-tint:#332d22; --teal-deep:#c2872f;
  --go:#2b7d3b; --go-sh:#123f1c; --kicker-bg:rgba(224,162,74,.13); --kicker-line:rgba(224,162,74,.32);
  --z-monitor:#7ea6c8; --z-monitor-2:#98b7d2; --z-monitor-tint:#2c3f52;
  --z-read:#5ac0c7; --z-read-2:#7bd3d9; --z-read-tint:#153230; --chip-bg:#3ba7af; --chip-ink:#0b2321; --read-head:#17656d; --read-head-2:#0f4a51;

*{box-sizing:border-box}
svg:not([width]){width:1.1em;height:1.1em;flex:none}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(1300px 680px at 50% -220px,var(--ground-2),var(--ground));background-attachment:fixed;color:var(--ink);
  font-family:var(--sans);font-size:var(--t-body);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,h5{margin:0;font-weight:700;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:4px}
::selection{background:var(--teal);color:#fff}
.serif{font-family:var(--serif)}
/* Rule 3: hide scrollbars everywhere; wheel/trackpad still scroll */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}

#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- Top bar (navy chrome) ---------- */
.topbar{flex:none;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);border-bottom:1px solid rgba(255,255,255,.05);box-shadow:0 6px 22px rgba(10,20,34,.18);position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:0 20px;height:54px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.01em;font-size:var(--t-body)}
.brand .emblem{width:30px;height:30px;border-radius:7px;background:linear-gradient(160deg,#e0a659,#a9741f);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.brand .emblem svg{width:18px;height:18px}
.brand small{display:block;font-weight:600;font-size:var(--t-eyebrow);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.tb-spacer{margin-left:auto}
.tb-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#eaf1fb;border-radius:100px;padding:7px 13px;font-size:var(--t-cap);font-weight:650}
.tb-btn:hover{background:rgba(255,255,255,.15)}
.tb-btn svg{width:15px;height:15px}
.tb-tag{font-size:var(--t-eyebrow);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.55)}

/* ---------- Generic ---------- */
.eyebrow{font-size:var(--t-eyebrow);font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-strong)}
.btn-go{display:inline-flex;align-items:center;gap:10px;background:var(--go);color:#fff;border:0;border-radius:var(--r);padding:13px 22px;font-weight:750;font-size:var(--t-body);box-shadow:0 3px 0 var(--go-sh)}
.btn-go:hover{filter:brightness(1.05)}
.btn-go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--go-sh)}
.btn-go svg{width:18px;height:18px}
.btn-go[disabled]{background:var(--surface-3);color:var(--ink-4);box-shadow:none;cursor:not-allowed}
.btn-ghost{display:inline-flex;align-items:center;gap:9px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;font-weight:700;font-size:var(--t-body)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost svg{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* ---------- Landing ---------- */
.landing{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:36px 22px;background:
  radial-gradient(1100px 460px at 82% -8%,rgba(176,122,36,.14),transparent 60%),var(--ground)}
.land-card{max-width:760px;width:100%;text-align:left}
.land-kicker{display:inline-flex;align-items:center;gap:8px;background:var(--kicker-bg);color:var(--teal-strong);border:1px solid var(--kicker-line);border-radius:100px;padding:6px 14px;font-size:var(--t-cap);font-weight:750;letter-spacing:.04em}
.land-kicker svg{width:15px;height:15px}
.land-card h1{font-size:var(--t-hero);letter-spacing:-.025em;margin:20px 0 0;line-height:1.02}
.land-card .lead{font-family:var(--serif);font-size:var(--t-h3);line-height:1.55;color:var(--ink-2);margin-top:16px;max-width:60ch}
.land-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.land-facts .lf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.land-facts .lf .lf-ic{width:48px;height:48px;border-radius:11px;background:var(--teal-tint);color:var(--teal-strong);display:grid;place-items:center;margin-bottom:12px}
.land-facts .lf .lf-ic svg{width:27px;height:27px}
.land-facts .lf h4{font-size:var(--t-h3)}
.land-facts .lf p{font-size:var(--t-sm);color:var(--ink-3);margin-top:5px;line-height:1.45}
.land-actions{margin-top:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.land-note{font-size:var(--t-cap);color:var(--ink-4);max-width:44ch}

/* ---------- Scene shell ---------- */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 20px 18px;max-width:1240px;width:100%;margin:0 auto}

/* instrument cluster */
.superstrip{flex:none;display:flex;align-items:stretch;gap:10px;margin-bottom:13px}
.sv-clock{flex:none;background:linear-gradient(180deg,var(--hud-1),var(--hud-2));color:#fff;border:1px solid rgba(255,255,255,.07);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 12px rgba(10,20,34,.20);padding:9px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:118px}
.sv-clock .cl{font-family:var(--mono);font-size:var(--t-h2);font-weight:600;letter-spacing:1px}
.sv-clock .cw{font-size:var(--t-nano);letter-spacing:.09em;text-transform:uppercase;color:rgba(232,238,242,.6);font-weight:700}
.sv-gauge{flex:1;min-width:0;background:linear-gradient(180deg,var(--hud-1),var(--hud-2));border:1px solid rgba(255,255,255,.07);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 12px rgba(10,20,34,.20);padding:9px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sv-gauge svg{width:118px;height:auto;display:block}
.sv-gauge .gv{transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1),stroke .3s}
.sv-gauge .g-num{font-family:var(--sans);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.sv-gauge .g-cap{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.sv-gauge .g-cap b{font-size:var(--t-cap);font-weight:800}
.sv-gauge .g-cap span{font-size:var(--t-nano);font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--hud-label);margin-top:1px}
.sv-stat{flex:1;display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,var(--hud-1),var(--hud-2));border:1px solid rgba(255,255,255,.07);border-radius:var(--r);padding:9px 15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 12px rgba(10,20,34,.20)}
.sv-stat .si{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;flex:none}
.sv-stat .si svg{width:24px;height:24px}
.sv-stat .sl{font-size:var(--t-eyebrow);font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--hud-label)}
.sv-stat .sv{font-size:var(--t-sm);font-weight:750;margin-top:1px}
.sv-ok .si{background:var(--good-tint);color:var(--good)} .sv-ok .sv{color:var(--good)}
.sv-warn .si{background:var(--warn-tint);color:var(--warn)} .sv-warn .sv{color:var(--warn)}
.sv-bad .si{background:var(--bad-tint);color:var(--bad)} .sv-bad .sv{color:var(--bad)}

/* scene grid: moment + evidence */
.scene{flex:1;min-height:0;display:grid;grid-template-columns:1fr 322px;gap:16px}
.moment{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.m-pad{flex:1;min-height:0;overflow:auto;padding:20px 30px 24px;display:flex;flex-direction:column}
.m-scene-ic{width:52px;height:52px;border-radius:12px;background:var(--teal-tint);color:var(--teal-strong);display:grid;place-items:center;margin-bottom:16px}
.m-scene-ic svg{width:29px;height:29px}
.moment .eyebrow{margin-bottom:2px}
/* bespoke scene illustration (photos can drop into the same slot later) */
.scene-illo{position:relative;flex:none;height:176px;background:radial-gradient(135% 160% at 22% -12%,var(--teal-tint),var(--surface-2));border-bottom:1px solid var(--line);display:grid;place-items:center;margin:0;overflow:hidden}
.scene-illo.warn{background:radial-gradient(135% 160% at 22% -12%,var(--warn-tint),var(--surface-2))}
.scene-illo svg{height:120px;width:auto;display:block}
.scene-illo.has-img{flex:none;height:330px;min-height:330px;background:none;display:block;margin:0}
.scene-illo.has-img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(to top,rgba(10,16,24,.34),rgba(10,16,24,0));pointer-events:none}
.scene-illo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;transform-origin:55% 42%;animation:kenburns 24s ease-in-out infinite alternate;will-change:transform}
@keyframes kenburns{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.18) translate(-2.2%,-1.6%)}}
.scene-illo img.no-kb{animation:none}
@media (prefers-reduced-motion:reduce){.scene-illo img{animation:none}}
/* buzzer light: red glow over the intercom button, flashed in sync with the sound */
.buzz-glow{position:absolute;width:78px;height:78px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:2;filter:blur(1px);mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,66,48,.95),rgba(255,48,36,.5) 38%,rgba(255,40,30,0) 70%)}
.il{fill:none;stroke:var(--teal-strong);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.il-soft{fill:none;stroke:var(--teal-strong);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:.32}
.il-fill{fill:var(--surface)}
.il-tint{fill:var(--teal-tint)}
.il-skin{fill:#f0d0b4}
.il-dot{fill:var(--teal-strong);stroke:none}
.il-warn{stroke:var(--warn)}
.il-warn-f{fill:var(--warn);stroke:var(--warn)}
.scene-text{font-family:var(--scene);font-size:var(--t-h3);line-height:1.6;color:var(--ink);margin-top:12px;max-width:54ch;letter-spacing:-.005em}
.m-q{font-size:var(--t-body);font-weight:750;color:var(--ink-2);margin-top:22px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{position:relative;text-align:left;display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:0 1px 2px rgba(24,42,66,.05),0 2px 8px rgba(24,42,66,.06);transition:transform .13s ease,box-shadow .13s ease,border-color .13s ease;cursor:pointer}
.opt:hover{transform:translateY(-1px);border-color:var(--teal);box-shadow:0 7px 20px rgba(24,42,66,.15)}
.opt:active{transform:translateY(0);box-shadow:0 1px 3px rgba(24,42,66,.10)}
.opt .ob{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--teal-strong);flex:none;display:grid;place-items:center;transition:background .13s,color .13s,border-color .13s}
.opt:hover .ob{background:var(--teal);border-color:var(--teal);color:#fff}
.opt .ob svg{width:17px;height:17px;opacity:1}
.opt .ot{font-size:var(--t-body);line-height:1.42;color:var(--ink);font-weight:550;flex:1}

function setupDisclaimer(){
  var v=document.querySelector('.disc-video'); if(!v) return;
  function showCaps(){ try{ if(v.textTracks && v.textTracks.length){ v.textTracks[0].mode='showing'; } }catch(e){} }
  showCaps(); v.addEventListener('loadeddata', showCaps);
  var gate=document.querySelector('.disc-gate');
  var wait=document.querySelector('.disc-wait');
  var overlay=document.querySelector('.disc-playoverlay');
  var bar=document.querySelector('.disc-progress > i');
  var revealed=false;
  function reveal(){ if(revealed) return; revealed=true; if(gate) gate.classList.add('show'); if(wait) wait.style.display='none'; }
  function showOverlay(){ if(overlay) overlay.removeAttribute('hidden'); }
  function hideOverlay(){ if(overlay) overlay.setAttribute('hidden',''); }
  v.addEventListener('timeupdate', function(){
    if(v.duration && !isNaN(v.duration)){
      var f=v.currentTime/v.duration;
      if(bar) bar.style.width=Math.min(100,f*100)+'%';
      if(f>=0.9) reveal();
    }
  });
  v.addEventListener('ended', reveal);
  v.addEventListener('error', reveal);
  v.addEventListener('play', hideOverlay);
  if(overlay){ overlay.addEventListener('click', function(){ hideOverlay(); v.play(); }); }
  var p=v.play();
  if(p && p.catch){ p.catch(showOverlay); }
  setTimeout(function(){ if(v.paused){ showOverlay(); } }, 1200);          // autoplay blocked → offer Play
  setTimeout(function(){ if(!revealed && (!v.duration || isNaN(v.duration))){ reveal(); } }, 40000); // safety net
}

    +     '<p class="m-q">Open anything on the right. When you are ready, go to the table.</p>'
    +     '<div class="opts"><div style="margin-top:8px"><button class="btn-go" data-act="to-table">'+svg(I.arrowR)+'Go to the table</button></div></div>'
    +     '</div>'
    +   '</div>'
    +   eviRail()
    + '</div>'
    + '</div>';
}

/* ---------- Scene (nodes N1..N5): one evolving, image-anchored panel ----------
   Each node is a single screen. It moves through: decide -> (confidence,
   inline, on confidence nodes) -> consequence, without ever leaving the
   panel or the scene photo. */
function viewScene(){
  const node=currentNode();
  return '<div class="stage">'
    + superstrip()
    + '<div class="scene">'+momentCard(node)+eviRail()+'</div>'
    + '</div>';
}
function momentCard(node){
  const key=flow()[S.nodeIdx];
  const warnScene = node.inject || node.emergency || (node.recog && S.primed);
  let body;
  if(S.sub==='consequence') body=consequenceBody(node);
  else if(node.confidence && S.pendingChoice) body=confidenceBody(node);
  else body=decideBody(node);
  return '<div class="moment">'+sceneIllo(key,warnScene)+'<div class="m-pad">'+body+'</div></div>';
}
function decideBody(node){
  const sceneText = node.recog ? recogSceneText() : node.scene;
  const eyebrow = (node.inject?'Interruption &middot; ':'')+node.time+' &middot; '+node.label;
  const opts = node.options.map(function(o){
    return '<button class="opt" data-act="choose" data-opt="'+o.id+'">'
      +'<span class="ob">'+svg(I.arrowR)+'</span>'
      +'<span class="ot">'+o.text+'</span></button>';
  }).join('');
  return '<span class="eyebrow">'+eyebrow+'</span>'
    +'<p class="scene-text">'+sceneText+'</p>'
    +'<p class="m-q">'+node.q+'</p>'
    +'<div class="opts">'+opts+'</div>';
}
function confidenceBody(node){
  const o=node.options.find(function(x){return x.id===S.pendingChoice;});
  return '<span class="eyebrow">'+node.time+' &middot; '+node.label+'</span>'
    +(o?'<p class="conf-choice">'+svg(I.checkSmall)+'<span>'+o.text+'</span></p>':'')
    +'<p class="m-q">How confident are you in that decision?</p>'
    +'<div class="conf-opts">'
    + confPill('cautious','scale','Cautious','Not sure it was right')
    + confPill('measured','gauge2','Measured','Reasonably sure')
    + confPill('confident','bolt','Confident','Sure it was right')
    +'</div>';
}
function consequenceBody(node){
  const fl=flow();
  const o=chosenOpt(fl[S.nodeIdx]);
  const last = S.nodeIdx>=fl.length-1;
  const nextIsEmergency = fl[S.nodeIdx+1]==='N6';
  const btn = last
    ? '<button class="btn-go" data-act="resolve">'+svg(I.arrowR)+'See how the meal ends</button>'
    : nextIsEmergency
      ? '<button class="btn-go" data-act="next-node">'+svg(I.alertT)+'What happens next</button>'
      : '<button class="btn-go" data-act="next-node">'+svg(I.arrowR)+'Carry on</button>';
  // In-the-moment observation only: no grade, no coaching. The instrument
  // cluster above shows the situation change; judgement waits for the debrief.
  return '<span class="eyebrow">'+node.time+' &middot; '+node.label+'</span>'
    +'<p class="scene-text">'+(o?o.note:'')+'</p>'
    +'<div class="micro-actions">'+btn+'</div>';
}
function recogSceneText(){
  return S.primed
    ? 'Daniel coughs, once, hard. Then he goes quiet. His lips are moving but no sound comes.'
    : 'Daniel gives a small cough, then carries on. He clears his throat and keeps eating.';
}
function confPill(v,ic,b,s){
  return '<button class="conf-pill" data-act="confidence" data-val="'+v+'"><span class="cp-ic">'+svg(I[ic])+'</span><b>'+b+'</b><span>'+s+'</span></button>';
}

/* ---------- Instrument cluster ---------- */
/* Live mealtime-risk score, 0..100, derived from the running mechanics.
   Rises as controls slip; stays low when the plan is held. */
function riskScore(){
  // Derived from applied state only, so the gauge does not move until a
  // choice is committed (after the confidence rating on confidence nodes).
  let r=14;                         // baseline: new meds, "drowsy lately"
  if(S.foodAccessible) r+=8;        // others' food within reach
  if(S.plateUnverified) r+=16;      // served the plate without checking
  if(!S.supervisionOk) r+=26;       // supervision currently broken
  r += (S.splits||0)*8;             // attention divided
  if(S.primed) r+=24;               // unsafe mouthful possible
  if(S.cc1) r+=6; if(S.cc2) r+=6;
  return clamp(r);
}
function riskZone(r){
  return r<34 ? {c:'var(--g-green)',l:'Low'}
       : r<67 ? {c:'var(--g-amber)',l:'Elevated'}
              : {c:'var(--g-red)',l:'High'};
}
/* Assurance direction: higher = safer (green). Risk is the inverse. */
function assurZone(v){ return v>=70 ? 'var(--g-green)' : v>=40 ? 'var(--g-amber)' : 'var(--g-red)'; }
function meter(value,color,word,label){
  const len=157.08; const off=(len*(1-value/100)).toFixed(2);
  return '<div class="sv-gauge">'
    +'<svg viewBox="0 0 120 66" aria-hidden="true">'
    +'<path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="var(--gauge-track)" stroke-width="9" stroke-linecap="round"/>'
    +'<path class="gv" d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+len+'" stroke-dashoffset="'+off+'"/>'
    +'<text x="60" y="55" text-anchor="middle" class="g-num" fill="'+color+'">'+value+'</text>'
    +'</svg>'
    +'<div class="g-cap"><b style="color:'+color+'">'+word+'</b><span>'+label+'</span></div>'
    +'</div>';
}
function superstrip(){
  const t=currentTime();
  const c=S.choices;
  const rk=riskScore(), rz=riskZone(rk);
  const split=['N2','N3','N4'].some(function(n){return c[n]==='b';});
  const sup = !S.supervisionOk ? {v:12,w:'Broken'} : split ? {v:60,w:'Divided'} : {v:100,w:'Eyes on'};
  const food = S.foodAccessible ? {v:45,w:'In reach'} : {v:100,w:'Secured'};
  const dan = S.primed ? {v:50,w:'Unsettled'} : {v:100,w:'Settled'};
  return '<div class="superstrip">'
    +'<div class="sv-clock"><div class="cw">Larkfield &middot; teatime</div><div class="cl">'+t+'</div></div>'
    + meter(rk, rz.c, rz.l, 'Mealtime risk')
    + meter(sup.v, assurZone(sup.v), sup.w, 'Supervision')
    + meter(food.v, assurZone(food.v), food.w, 'Access to food')
    + meter(dan.v, assurZone(dan.v), dan.w, 'Daniel')
    +'</div>';
}

/* ---------- Evidence rail ---------- */
function eviRail(){
  const openedCount = DOC_ORDER.filter(function(id){return S.opened[id];}).length;
  const rows = function(grp){
    return DOC_ORDER.filter(function(id){return DOCS[id].group===grp;}).map(function(id){
      const d=DOCS[id]; const op=S.opened[id];
      return '<button class="doc-row'+(op?' opened':'')+'" data-act="open-doc" data-id="'+id+'">'
        +'<span class="di">'+svg(I[d.icon])+'</span>'
        +'<span class="dt">'+d.title+(d.ref?'<span class="dts">Toolkit '+d.ref+'</span>':'<span class="dts">Daniel’s file</span>')+'</span>'
        +(op?'<span class="dv">'+svg(I.checkSmall)+'</span>':'')
        +'</button>';
    }).join('');
  };
  return '<div class="evi">'
    +'<div class="evi-head"><h3>'+svg(I.eye)+'Records &amp; tools</h3>'
    +'<p>Opened '+openedCount+' of '+DOC_ORDER.length+'. Open a document to read it and judge it yourself.</p></div>'
    +'<div class="evi-scroll">'
    +'<div class="evi-grp">Daniel’s records</div>'+rows('daniel')
    +'<div class="evi-grp">Reference tools</div>'+rows('ref')
    +'</div></div>';
}

/* ---------- Document modal ---------- */
function docModal(id){
  const d=DOCS[id];
  const items=d.list.map(function(x){return '<li>'+svg(I[x.ic])+'<span>'+x.t+'</span></li>';}).join('');
  let flag='';
  if(d.flag){
    flag = S.medFlagged
      ? '<div class="dm-flag dm-flagged">'+svg(I.check)+'Flagged for reassessment and an Early Watch entry</div>'
      : '<button class="dm-flag" data-act="flag-med">'+svg(I.flag)+'Flag: the plan may under-state today’s risk</button>';
  }
  return '<div class="backdrop" data-act="close-modal"><div class="modal doc-modal" data-stop="1">'
    +'<div class="dm-top"><span class="dm-emblem">'+svg(I[d.icon])+'</span>'
    +'<div><div class="dm-kick">'+d.kicker+(d.ref?' &middot; '+d.ref:'')+'</div><h3>'+d.title+'</h3></div>'
    +'<button class="dm-x" data-act="close-modal">'+svg(I.x)+'</button></div>'
    +'<div class="doc-body"><ul class="dl">'+items+'</ul>'
    +(d.note?'<p class="doc-note" style="margin-top:16px">'+d.note+'</p>':'')
    +'</div>'
    + flag
    +'<div class="dm-prov">'+svg(I.lock)+d.prov+'</div>'
    +'</div></div>';
}

/* ---------- Outcome (S5) ---------- */
function stepBlock(title, steps, startNum){
  return '<span class="eyebrow" style="display:block;margin-top:22px;margin-bottom:10px">'+title+'</span>'
    + '<div class="oc-steps">'+steps.map(function(s,i){
        return '<div class="os"><span class="osn">'+(startNum+i)+'</span><p>'+s+'</p></div>';
      }).join('')+'</div>';
}
function caveatBox(){
  return '<div class="caveat">'+svg(I.info)+'<span>'+SIM_CAVEAT+'</span></div>';
}
/* The chain named on the fatal screen and in the debrief only lists failures
   that were genuinely on this learner's route (Emma's requirement). */
function failureChain(){
  const links=[];
  if(S.cc2 || S.plateUnverified){ links.push('a plate that did not meet Daniel’s plan'); }
  if(S.cc1){ links.push('supervision that broke while food was within reach'); }
  if(!S.medFlagged){ links.push('a medication change that was never connected to today’s risk'); }
  return links;
}
/* Post-incident steps, split into what the frontline worker owns and what
   happens later at manager/organisation level (Emma's requirement). */
function postIncidentBlocks(fatal){
  const org = ORG_STEPS.slice();
  if(fatal){ org.splice(2,0,ORG_STEP_FATAL); }   // CQC sits after safeguarding on the fatal path
  return stepBlock('What the frontline worker owns', WORKER_STEPS, 1)
    + stepBlock('What happens later, at manager and service level', org, WORKER_STEPS.length+1);
}
function fatalAftermath(){
  return '<div class="aftermath">'
    +'<p class="af-line">'+svg(I.users)+'<span>You are not expected to carry this alone. The team holds a debrief, colleagues who witnessed it are checked on, and support is offered to staff. Being affected by this is not weakness; it is human.</span></p>'
    +'<p class="af-line">'+svg(I.target)+'<span>Sit with what this shift shows. The links that led here were ordinary and preventable. In the debrief you will see where each one could have held.</span></p>'
    +'</div>';
}
function viewOutcome(){
  const o=S.outcome;
  let badgeCls,badge,icon=I.alertT,h,body,extra='';
  if(o==='A'){
    const top = !S.primed && S.medFlagged;
    badgeCls='oc-good'; badge='Prevention'; icon=I.shield;
    h = top ? 'A safe, unhurried meal, and you saw what the plan missed' : 'Daniel has a safe, unhurried meal';
    body = 'Nothing dramatic happened, which is the whole point. The right texture, steady pacing and unbroken supervision meant the busy teatime was just fifteen ordinary minutes. '
      + (top ? 'You also read the medication change against the drowsiness note and flagged that Daniel needs a reassessment. That is prevention working several days before any incident.'
             : 'The incident was prevented by the ordinary controls holding, not by luck.');
  } else if(o==='B'){
    // Near miss, recovered. Only reached when the learner recognised at the
    // cough (N5 a); the copy affirms it and shows the safe recovery sequence.
    badgeCls='oc-warn'; badge='Near miss, recovered';
    h='Daniel coughs hard on an unsafe mouthful, then recovers';
    body='An unsafe mouthful was taken and Daniel coughed. You recognised it at once, stopped the meal, kept him upright and called for help, and he cleared it. Recording the near miss and adding an Early Watch entry is the right close: recognising and learning from a near miss is success, not failure. The conditions for it, though, were set earlier in the shift.';
    extra = stepBlock('The safe response, step by step', RECOVERY_STEPS, 1);
  } else if(o==='C'){
    // Emergency, survived. Copy must NOT read "without delay" if the learner
    // actually delayed the 999 call (Emma); the delay is named as unsafe.
    const n6=S.choices.N6;
    badgeCls='oc-warn'; badge='Emergency, survived';
    h='Daniel is stabilised and taken to hospital';
    if(n6==='a'){
      body='The obstruction was serious. You recognised the emergency, called 999 and followed choking first-aid guidance without delay, and the paramedics took over. Daniel is alive because the response was run at once — not a near miss, and not luck, but a fast, correct emergency response after the meal had already gone wrong.';
    } else {
      body='The obstruction was serious. You began to help, but the 999 call was left until you had a free moment. Daniel survived — and that matters — but that delay was unsafe: in a full obstruction the call for help cannot wait. Getting emergency help on its way is part of the first response, not something to fit in afterwards.';
    }
    extra = postIncidentBlocks(false);
  } else {
    // Emergency, fatal. Reached only through the full three-failure chain.
    // The chain is composed from what actually went wrong on this run.
    badgeCls='oc-bad'; badge='Emergency';
    h='Daniel does not survive';
    const links=failureChain(); links.push('an emergency that was not answered in time');
    const chain = links.length>1 ? links.slice(0,-1).join(', ')+' and '+links[links.length-1] : links[0];
    body='The airway stayed blocked. With the emergency response not run in time, Daniel could not be resuscitated. This is the outcome the whole shift was working to prevent. '
      +'It did not come from one moment. It came from a chain: '+chain+'. Any one link, held, would have changed the ending.';
    extra = fatalAftermath() + postIncidentBlocks(true);
  }
  return '<div class="outcome"><div class="oc-card">'
    +'<span class="oc-badge '+badgeCls+'">'+svg(icon)+badge+'</span>'
    +'<h1>'+h+'</h1>'
    +'<p class="oc-body">'+body+'</p>'
    + extra
    +'<div class="oc-actions"><button class="btn-go" data-act="to-debrief">'+svg(I.arrowR)+'Go to the debrief</button></div>'
    +'</div></div>';
}

/* ---------- Scoring ---------- */
function scoreProfile(){
  const c=S.choices; const m={a:100,b:55,c:15};
  const info = clamp((S.openedBeforeServe?45:0) + (c.N1==='a'?25:0) + (S.medFlagged?30:0));
  const prep = m[c.N1]||0;
  const dyn  = Math.round(((m[c.N2]||0)+(m[c.N3]||0))/2);
  const person = Math.round(((c.N1==='a'?72:c.N1==='b'?48:20) + (c.N4==='a'?100:c.N4==='b'?55:25))/2);
  const team = m[c.N4]||0;
  // Response & learning: at the emerging signs, and (if it reached one) the emergency.
  let resp = c.N5?(m[c.N5]||0):0;
  if(c.N6){ resp = Math.round(((m[c.N5]||0) + (c.N6==='a'?100:c.N6==='b'?45:0))/2); }
  return [
    {k:'Information use', v:info, note:'Read the plan before serving; connected the medication clue.'},
    {k:'Preparation', v:prep, note:'Verified and corrected the plate before the meal.'},
    {k:'Dynamic judgement', v:dyn, note:'Held supervision across the door and the phone.'},
    {k:'Person-centred practice', v:person, note:'Kept Daniel’s pace and dignity, no blanket restriction.'},
    {k:'Team coordination', v:team, note:'Called for help rather than abandoning supervision.'},
    {k:'Response & learning', v:resp, note:'Recognised the signs and acted; recorded the near miss.'},
  ];
}
function barCls(v){ return v>=70?'hi':v>=40?'mid':'lo'; }

/* ---------- Debrief (S6) ---------- */
function viewDebrief(){
  const doms=scoreProfile();
  const domHtml=doms.map(function(d){
    return '<div class="dom-row"><div class="dr-top"><b>'+d.k+'</b><span>'+d.v+' / 100</span></div>'
      +'<div class="dom-bar"><i class="'+barCls(d.v)+'" style="width:'+d.v+'%"></i></div></div>';
  }).join('');

  const cc1 = ccItem('CC1', 'Supervision', S.cc1, 'You kept eyes on Daniel while food was in reach.', 'Supervision broke while food was accessible.');
  const cc2 = ccItem('CC2', 'Unsafe mouthful', S.cc2, 'Food served always met Daniel’s plan.', 'Food that did not meet the plan was allowed.');

  const sawMed = S.opened.DOC_MEDS && S.opened.DOC_HANDOVER;
  const reveal = S.medFlagged
    ? '<div class="reveal-box ok"><h5>'+svg(I.check)+'You saw what the plan did not say</h5><p>You read the new medication against the “drowsy lately” line and flagged that Daniel’s plan needs a reassessment. The plan alone would have under-stated today’s risk.</p></div>'
    : '<div class="reveal-box"><h5>'+svg(I.alertT)+'What the evidence actually showed</h5><p>'
      +(sawMed?'You opened the medication record and the handover note, but the connection was left unflagged. ':'A medication started three weeks ago, listing sedation and dry mouth, was recorded but never opened. ')
      +'Daniel’s plan and EDAR do not reflect it, so the plan on its own under-states today’s risk.</p></div>';

  const eventsHtml = summariseEvents().map(function(e){
    return '<div class="ev"><span class="evk">'+e.k+'</span><span class="evd">'+e.d+'</span></div>';
  }).join('');

  const outLabel = S.outcome==='A'?'Prevention':'Near miss, recovered';

  return '<div class="debrief"><div class="db-wrap">'
    +'<div class="vhero">'+vslot('Debrief video &mdash; your assessor','',false)+'</div>'
    +'<div class="db-head"><div><span class="eyebrow">Debrief &middot; the teatime shift</span>'
    +'<h1>How the shift went, and why</h1></div>'
    +'<span class="oc-badge '+(S.outcome==='A'?'oc-good':'oc-warn')+'">'+svg(S.outcome==='A'?I.shield:I.alertT)+outLabel+'</span></div>'

    +'<div class="db-grid">'
    +  '<div class="panel"><h3>'+svg(I.gauge2)+'Your practice profile</h3>'
    +    '<p class="ph-sub">Weighted domains, not a single mark. Critical controls sit above the domains: a control missed is never offset by strong practice elsewhere.</p>'
    +    '<div class="dom">'+domHtml+'</div></div>'

    +  '<div class="panel"><h3>'+svg(I.shield)+'Critical controls</h3>'
    +    '<p class="ph-sub">The two that keep Daniel safe.</p>'
    +    '<div class="cc-list">'+cc1+cc2+'</div>'
    +    reveal
    +  '</div>'
    +'</div>'

    +'<div class="db-grid">'
    +  '<div class="panel"><h3>'+svg(I.route)+'Captured this run</h3>'
    +    '<p class="ph-sub">The platform records what you opened and relied on, not just the answer you chose.</p>'
    +    '<div class="events">'+eventsHtml+'</div></div>'
    +  '<div class="panel" style="display:flex;flex-direction:column;justify-content:center;align-items:flex-start">'
    +    '<h3>'+svg(I.restart)+'Run it again</h3>'
    +    '<p class="ph-sub" style="margin-bottom:16px">Each run is assessed on its own. You can take the shift again.</p>'
    +    '<button class="btn-ghost" data-act="restart">'+svg(I.restart)+'Restart the shift</button></div>'
    +'</div>'

    + targetedToolkit()
    + readiness()
    + crossTrackReveal()
    +'</div></div>';
}
function ccItem(code,name,tripped,holdTxt,tripTxt){
  return '<div class="cc-item '+(tripped?'cc-trip':'cc-hold')+'">'
    +'<div class="cci">'+svg(tripped?I.alertT:I.check)+'</div>'
    +'<div><h5>'+code+' &middot; '+name+'</h5><p>'+(tripped?tripTxt:holdTxt)+'</p></div></div>';
}
function summariseEvents(){
  const out=[];
  const opened=DOC_ORDER.filter(function(id){return S.opened[id];}).length;
  out.push({k:'DOC_OPENED', d:opened+' of '+DOC_ORDER.length+' documents opened'});
  out.push({k:'PLATE_VERIFIED', d:S.plateVerified?'Checked against IDDSI Level 6 before serving':'Not verified before serving'});
  const breaks=S.events.filter(function(e){return e.t==='SUPERVISION_BREAK';}).length;
  out.push({k:'SUPERVISION_BREAK', d:breaks===0?'None: supervision held all shift':breaks+' break'+(breaks>1?'s':'')+' logged'});
  out.push({k:'MEDCLUE_FLAGGED', d:S.medFlagged?'Yes: reassessment flagged':'No'});
  const esc=S.events.filter(function(e){return e.t==='ESCALATION';}).length;
  out.push({k:'ESCALATION', d:esc?'Escalated / called for help':'Not escalated'});
  if(S.choices.N6){
    out.push({k:'EMERGENCY_RESPONSE', d:S.choices.N6==='a'?'999 called and first aid given without delay':S.choices.N6==='b'?'First aid given; 999 call delayed':'No effective response run'});
  }
  const oc={A:'prevention',B:'near miss',C:'emergency, survived',D:'emergency, fatal'};
  out.push({k:'OUTCOME', d:'Path '+S.outcome+' ('+(oc[S.outcome]||'')+')'});
  return out;
}
function readiness(){
  // Assessment verdict, not coaching. Derived from the critical controls,
  // the outcome and the practice profile.
  const doms=scoreProfile();
  const lowAny=doms.some(function(d){return d.v<40;});
  let band,cls,txt;
  if(S.outcome==='D'){
    band='Not yet ready'; cls='r-bad';
    txt='The shift ended in the outcome this training exists to prevent. It was a chain of failures, each recoverable on its own — in practice, any one of them held would have changed the ending. This cannot be offset by good work elsewhere.';
  } else if(S.cc1 || S.cc2){
    band='Not yet ready'; cls='r-bad';
    txt = S.outcome==='C'
      ? 'Daniel survived a choking emergency, but only after a critical control had already failed earlier in the shift. Reaching an emergency at all means the safe margins were gone, and a delayed call for help is never safe. This cannot be offset by good work elsewhere.'
      : 'A critical control was missed during the shift. In practice that is the difference between a safe meal and a serious incident, and it cannot be offset by good work elsewhere.';
  } else if(lowAny){
    band='Developing'; cls='r-warn';
    txt='Daniel came through the meal, but safety rested on margins thinner than they needed to be. Parts of practice are not yet consistent.';
  } else {
    band='Ready'; cls='r-good';
    txt='Supervision held, the food met Daniel’s plan, and the meal stayed safe throughout. This is the standard a lone teatime shift asks for.';
  }
  return '<div class="crosstrack '+cls+'">'
    +'<div class="ct-k">Readiness &middot; this run</div>'
    +'<div class="r-band"><span class="r-chip">'+svg(band==='Ready'?I.shield:I.alertT)+band+'</span></div>'
    +'<p>'+txt+'</p>'
    +'</div>';
}
/* Targeted toolkit: send the learner only to the tools their own decisions
   touched, not the whole library (build script §10). Built from run state. */
function targetedToolkit(){
  const items=[
    {ic:'book',ref:'TK5.2',t:'Structured debrief',p:'Work back through the shift against Daniel’s plan and the source guidance.'},
    {ic:'target',ref:'TK5.3',t:'Reflective learning',p:'Note what you would repeat, and what you would do differently next time.'},
  ];
  if(S.outcome==='B'){
    items.push({ic:'flag',ref:'TK5.5b',t:'Record a near miss',p:'An unsafe mouthful was taken and recovered. Log it so it is reviewed.'});
    items.push({ic:'eye',ref:'TK5.1',t:'Early Watch entry',p:'Open an Early Watch so Daniel is monitored closely over the coming meals.'});
  }
  if(!S.medFlagged){
    items.push({ic:'pill',ref:'TK6.4',t:'Review the mealtime plan',p:'The medication change was not reflected in the plan. Flag it for reassessment.'});
  }
  if(S.cc2 || S.plateUnverified){
    items.push({ic:'utensils',ref:'TK2.4',t:'IDDSI texture guide',p:'Re-check what Level 6, Soft & Bite-Sized means and how to verify a plate.'});
  }
  if(S.cc1){
    items.push({ic:'clipboard',ref:'TK2.1',t:'Level 1 mealtime controls',p:'Supervision broke while food was in reach. Revisit the core controls.'});
  }
  if(S.choices.N5==='b' || S.choices.N5==='c'){
    items.push({ic:'alertT',ref:'TK7.1',t:'Choking red flags',p:'Revisit how to recognise deterioration and act without waiting.'});
  }
  if(S.outcome==='C' || S.outcome==='D'){
    items.push({ic:'route',ref:'TK2.3',t:'Incident escalation flowchart',p:'The full sequence from incident to learning, and who owns each step.'});
    items.push({ic:'phone',ref:'TK7.2a',t:'Who to call',p:'999, manager, safeguarding and CQC — who to contact, when, and why.'});
  }
  if(S.outcome==='D'){
    items.push({ic:'heart',ref:'TK5.4',t:'Emotional impact',p:'Support for staff after a serious incident. Being affected is human, not weakness.'});
  }
  const rows=items.map(function(x){
    return '<div class="tk-row"><div class="tki">'+svg(I[x.ic])+'</div>'
      +'<div><h5>'+x.t+' <span class="tkref">&middot; '+x.ref+'</span></h5><p>'+x.p+'</p></div></div>';
  }).join('');
  return '<div class="panel" style="margin-top:18px"><h3>'+svg(I.book)+'Your targeted toolkit</h3>'
    +'<p class="ph-sub">Only the tools your decisions touched this run, not the whole library.</p>'
    +'<div class="tk-list">'+rows+'</div></div>';
}
/* Cross-track reveal stub (build script §10): a short upstream teaser that the
   conditions the learner fought were shaped by the manager and organisation. */
function ctNode(ic,t){ return '<span class="ct-node">'+svg(I[ic])+t+'</span>'; }
function crossTrackReveal(){
  return '<div class="crosstrack">'
    +'<div class="ct-k">Cross-track &middot; where this shift came from</div>'
    +'<h3>Here is the shift your paperwork produced</h3>'
    +'<p>The pressures you worked against tonight were set long before teatime. A colleague off sick with no cover, a medication change that never reached Daniel’s plan, and a reassessment that was never booked — these were shaped upstream, by the manager and the organisation, not on the dining-room floor.</p>'
    +'<div class="ct-chain">'
    + ctNode('users','Short-staffed rota')
    + '<span class="ct-arr">'+svg(I.arrowR)+'</span>'
    + ctNode('pill','Medication change unlogged')
    + '<span class="ct-arr">'+svg(I.arrowR)+'</span>'
    + ctNode('clipboard','No Early Watch entry')
    + '<span class="ct-arr">'+svg(I.arrowR)+'</span>'
    + ctNode('home','The shift you were handed')
    +'</div>'
    +'<p style="margin-top:16px">In the full PracticE Ready programme you would take the Manager and Director shifts that built this one. For now, this is a teaser for that connected view.</p>'
    +'</div>';
}

/* ---------- Reducers / actions ---------- */
function beginShift(){ AUDIO.unlock(); handoverT=0; handoverEnded=false; S.stage='handover'; save(); render(); }
function toTable(){ S.stage='node'; S.nodeIdx=0; enterNode(); }
function enterNode(){
  stopBuzzSequence();
  S.sub='decide';               // decide first; confidence is asked inline after the choice
  S.pendingChoice=null;
  save(); render();
  playNodeCue(flow()[S.nodeIdx]);
}
function chosenOpt(nodeId){
  const node=NODES[nodeId];
  return node.options.find(function(o){return o.id===S.choices[nodeId];});
}
/* Apply the choice's state effects. Deferred until after the confidence
   rating on confidence nodes, so the gauges do not hint the outcome. */
function applyEffects(nodeId){
  const node=NODES[nodeId]; const opt=chosenOpt(nodeId);
  if(nodeId==='N1'){
    S.openedBeforeServe = !!(S.opened.DOC_PLAN || S.opened.DOC_IDDSI);
    if(opt.verified){ S.plateVerified=true; log('PLATE_VERIFIED',{bool:true}); log('DOC_RELIED',{id:'DOC_PLAN'}); }
    else if(opt.id==='b'){ S.plateUnverified=true; }   // served without checking
  }
  if(nodeId==='N6'){   // emergency response: recognition + 999 + first aid
    if(opt.id==='a'){ log('ESCALATION',{type:'ambulance_999',latency_ms:0}); log('FIRST_AID',{given:true,delayed:false}); }
    else if(opt.id==='b'){ log('ESCALATION',{type:'ambulance_999',latency_ms:9000}); log('FIRST_AID',{given:true,delayed:true}); }
    else { log('FIRST_AID',{given:false,delayed:false}); log('LEFT_TABLE',{node:'N6',food_accessible:S.foodAccessible}); }
  }
  if(opt.securesFood){ S.foodAccessible=false; }
  if(opt.cc==='CC2'){ S.cc2=true; S.primed=true; S.supervisionOk=false; }
  else if(opt.cc==='CC1'){
    S.supervisionOk=false;
    log('SUPERVISION_BREAK',{node:nodeId,duration_ms:12000});
    log('LEFT_TABLE',{node:nodeId,food_accessible:S.foodAccessible});
    if(S.foodAccessible){ S.cc1=true; S.primed=true; }
  } else if(opt.kind==='risky'){
    if(nodeId==='N2'){ log('SUPERVISION_BREAK',{node:nodeId,duration_ms:4000}); log('LEFT_TABLE',{node:nodeId,food_accessible:S.foodAccessible}); }
    if(nodeId==='N2'||nodeId==='N3'||nodeId==='N4'){ S.splits=(S.splits||0)+1; }
    S.supervisionOk=true;
  } else {
    S.supervisionOk=true;
  }
  if(opt.escalation){ log('ESCALATION',{type:'shift_leader',latency_ms:0}); }
  if(node.recog){
    const latency = opt.id==='a'?1500:opt.id==='b'?6000:12000;
    log('REDFLAG_RECOGNISED',{latency_ms:latency});
  }
}
function chooseOption(optId){
  stopBuzzSequence();
  const nodeId=flow()[S.nodeIdx];
  const node=NODES[nodeId];
  if(node.confidence && !S.pendingChoice){
    // hold the choice and ask confidence inline before revealing anything
    S.pendingChoice=optId; save(); render(); return;
  }
  S.choices[nodeId]=optId;
  applyEffects(nodeId);
  if(node.emergency){ resolve(); return; }   // emergency node goes straight to the outcome
  S.sub='consequence'; save(); render();
}
function setConfidence(val){
  const nodeId=flow()[S.nodeIdx];
  S.choices[nodeId]=S.pendingChoice;
  S.conf[nodeId]=val;
  log('CONFIDENCE', {node:nodeId, value:val});
  applyEffects(nodeId);
  S.pendingChoice=null;
  S.sub='consequence'; save(); render();
}
function nextNode(){
  if(S.nodeIdx < flow().length-1){ S.nodeIdx++; enterNode(); }
  else { resolve(); }
}
function resolve(){
  // Four outcome paths (validated with SME):
  //   A prevention · B near miss recovered · C emergency survived · D emergency fatal.
  // The fatal outcome is gated behind a full chain of failures: an unsafe
  // mouthful becomes possible (a critical control fails), the emerging signs
  // are not recognised (N5 b/c → obstruction), AND the emergency response is
  // not run (N6 c). Any single link held changes the ending; A is always
  // reachable and nothing is forced.
  if(!S.primed){ S.outcome='A'; }
  else if(S.choices.N5==='a'){ S.outcome='B'; }        // recognised at the cough → recovered
  else {                                               // obstruction → N6 decides survival
    const n6=S.choices.N6;
    S.outcome = (n6==='a'||n6==='b') ? 'C' : 'D';
  }
  // The near miss is only "recorded" as closed-loop learning if the learner
  // actually recognised and acted (not if they tried to wash it down).
  if(S.outcome==='B' && S.choices.N5!=='c'){ log('NEARMISS_RECORDED',{bool:true}); }
  log('OUTCOME',{path:S.outcome});
  AUDIO.ambienceStop();
  AUDIO.sfx({A:'good',B:'confirm',C:'warn',D:'somber'}[S.outcome]);
  S.stage='outcome'; save(); render();
}
function toDebrief(){ S.stage='debrief'; save(); render(); }

var docView=null; // transient (not persisted): which doc is open, and when, for dwell_ms
function recordDwell(){
  if(!docView) return;
  var ms=Math.max(0, Date.now()-docView.at);
  // accumulate onto the matching DOC_OPENED event, so reopens add up
  for(var i=S.events.length-1;i>=0;i--){
    if(S.events[i].t==='DOC_OPENED' && S.events[i].id===docView.id){ S.events[i].dwell_ms=(S.events[i].dwell_ms||0)+ms; break; }
  }
  docView=null;
}
function openDoc(id){
  if(docView){ recordDwell(); }               // switching straight to another doc
  if(!S.opened[id]){
    const order=DOC_ORDER.filter(function(x){return S.opened[x];}).length+1;
    S.opened[id]=true; log('DOC_OPENED',{id:id,order:order,dwell_ms:0});
  }
  docView={id:id, at:Date.now()};
  AUDIO.sfx('open');
  S.modal={id:id}; save(); render();
}
function flagMed(){ S.medFlagged=true; log('MEDCLUE_FLAGGED',{bool:true}); AUDIO.sfx('confirm'); save(); render(); }
function closeModal(){ recordDwell(); AUDIO.sfx('close'); S.modal=null; save(); render(); }

function restart(){ const keep={theme:S.theme,muted:S.muted}; stopBuzzSequence(); AUDIO.ambienceStop(); S=Object.assign(initState(),keep); applyTheme(); save(); render(); }
function toggleMute(){ S.muted=!S.muted; AUDIO.setMuted(S.muted); if(!S.muted){ AUDIO.sfx('toggle'); } save(); render(); }

/* ---------- Theme ---------- */
function applyTheme(){
  if(S.theme){ document.documentElement.setAttribute('data-theme',S.theme); }
  else{ document.documentElement.removeAttribute('data-theme'); }
}
function toggleTheme(){
  AUDIO.sfx('toggle');
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme:dark)').matches;
  S.theme = isDark ? 'light' : 'dark';
  applyTheme(); save(); render();
}

/* ---------- Events ---------- */
document.addEventListener('click', function(e){
  const el=e.target.closest('[data-act]');
  if(!el){ return; }
  const act=el.getAttribute('data-act');
  // Navigation / selection cues. Document, flag, toggle and outcome cues are
  // fired inside their own handlers so they stay precise (e.g. the modal
  // close-guard, or the outcome tone matched to the path).
  const nav={begin:'forward','to-table':'forward',confidence:'select',choose:'select','next-node':'forward','to-debrief':'forward',restart:'back'};
  if(nav[act]){ AUDIO.sfx(nav[act]); }
  switch(act){
    case 'begin': beginShift(); break;
    case 'to-table': toTable(); break;
    case 'confidence': setConfidence(el.getAttribute('data-val')); break;
    case 'choose': chooseOption(el.getAttribute('data-opt')); break;
    case 'next-node': nextNode(); break;
    case 'resolve': nextNode(); break;
    case 'to-debrief': toDebrief(); break;
    case 'open-doc': openDoc(el.getAttribute('data-id')); break;
    case 'flag-med': flagMed(); break;
    case 'close-modal':
      // close only when the backdrop itself or the X is clicked, not the card body
      if(el.classList.contains('backdrop') && e.target.closest('.modal')){ break; }
      closeModal();
      break;
    case 'ack-disclaimer': ackDisclaimer(); break;
    case 'restart': restart(); break;
    case 'theme': toggleTheme(); break;
    case 'mute': toggleMute(); break;
  }
});

/* ---------- Boot ---------- */
applyTheme();
render();
</script>
</body>
</html>
