<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Teatime Shift, Frontline Care Simulation</title>
<meta name="description" content="A first-person frontline simulation on preventing choking at a mealtime in adult social care. Fictional proof of concept.">
<style>
/* ============================================================
   PracticE Ready, Frontline simulation, "The Teatime Shift".
   Shares The Risk Chain v7 "NHS clinical" design tokens so the
   two seats read as one product. Light is primary; a clinical
   dark variant sits on the theme toggle.
   ============================================================ */
/* ------------------------------------------------------------------
   Palette: "Dusk". A calm blue-grey backdrop drawn from the windows
   at teatime, so the warm care-home photography (amber lamplight, oak,
   the worker's navy jumper) glows against it. Four zone identities,
   each its own surface + accent so no two panels read alike:
     chrome  = navy  (top bar + records header: the "system" layer)
     monitor = navy HUD instrument panel (metric strip: things to watch)
     read    = cool card, navy header, slate chips (evidence: things to read)
     do      = amber (the scene + options: things to do; via --teal)
   Cards lift off the ground on real elevation, in light and dark.
   ------------------------------------------------------------------ */
:root{
  --ground:#e7ebf1; --surface:#ffffff; --surface-2:#eef2f6; --surface-3:#dde4ec;
  --ink:#1e2e3b; --ink-2:#46586a; --ink-3:#5c6d7d; --ink-4:#7d8ea0;
  --line:#d6dfe8; --line-2:#e8edf2;
  --navy:#22374f; --navy-2:#15263b; --navy-ink:#ffffff;
  --teal:#a9741f; --teal-strong:#8a5f18; --teal-tint:#faecd2; --teal-deep:#6f4c12;
  --z-monitor:#3f6486; --z-monitor-2:#33526e; --z-monitor-tint:#ffffff;
  --z-read:#1a6a72; --z-read-2:#155158; --z-read-tint:#e5f1f1; --chip-bg:#1a6a72; --chip-ink:#ffffff; --read-head:#1c6d75; --read-head-2:#14535a;
  --z-do:#b87c20; --z-do-2:#96631a; --z-do-tint:#faecd2;
  --hud-1:#274056; --hud-2:#182838; --hud-label:rgba(203,220,236,.75); --gauge-track:rgba(116,196,228,.26);
  --good:#3f7d38; --good-tint:#e6efe0; --good-line:#bcd8b1;
  --warn:#c06a10; --warn-tint:#f7ead2; --warn-line:#eece9b;
  --bad:#c0392b; --bad-tint:#f7e4df; --bad-line:#eec5bd;
  --info:#1a6a72; --info-tint:#e5f1f1;
  --g-red:#e2604e; --g-amber:#f0ad2e; --g-green:#5fbf53;
  --shadow:0 1px 2px rgba(24,42,66,.06),0 3px 10px rgba(24,42,66,.08);
  --shadow-lg:0 2px 6px rgba(24,42,66,.08),0 24px 50px rgba(24,42,66,.18);
  --r:8px; --r-sm:5px; --r-lg:12px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:Arial,"Helvetica Neue",Helvetica,"Segoe UI",system-ui,-apple-system,sans-serif;
  --scene:"Segoe UI","Seravek","Helvetica Neue",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#1b2632; --surface:#2b3948; --surface-2:#35434f; --surface-3:#41505e;
    --ink:#eef4f9; --ink-2:#c4d0db; --ink-3:#9fb0bd; --ink-4:#82929f;
    --line:#3c4a58; --line-2:#313e4b;
    --navy:#233a54; --navy-2:#152840; --navy-ink:#eef4f9;
    --teal:#e0a24a; --teal-strong:#ecb469; --teal-tint:#3a2c15; --teal-deep:#c2872f;
    --z-monitor:#7ea6c8; --z-monitor-2:#98b7d2; --z-monitor-tint:#2c3f52;
    --z-read:#5ac0c7; --z-read-2:#7bd3d9; --z-read-tint:#153230; --chip-bg:#3ba7af; --chip-ink:#0b2321; --read-head:#17656d; --read-head-2:#0f4a51;
    --z-do:#e0a24a; --z-do-2:#eab868; --z-do-tint:#342a13;
    --hud-1:#28405a; --hud-2:#16222f; --hud-label:rgba(203,220,236,.72); --gauge-track:rgba(116,196,228,.24);
    --good:#5fbf53; --good-tint:#213a20; --good-line:#356a3a;
    --warn:#e0a02a; --warn-tint:#3a2f14; --warn-line:#5f4a1c;
    --bad:#e2604e; --bad-tint:#3a221c; --bad-line:#61332b;
    --info:#5ac0c7; --info-tint:#153230;
    --g-red:#e2604e; --g-amber:#f0ad2e; --g-green:#5fbf53;
    --shadow:0 2px 6px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.4);
    --shadow-lg:0 10px 24px rgba(0,0,0,.4),0 28px 56px rgba(0,0,0,.5);
  }
}
:root[data-theme="light"]{
  --ground:#e7ebf1; --surface:#ffffff; --surface-2:#eef2f6; --surface-3:#dde4ec;
  --ink:#1e2e3b; --ink-2:#46586a; --ink-3:#5c6d7d; --ink-4:#7d8ea0;
  --line:#d6dfe8; --line-2:#e8edf2;
  --navy:#22374f; --navy-2:#15263b; --navy-ink:#ffffff;
  --teal:#a9741f; --teal-strong:#8a5f18; --teal-tint:#faecd2; --teal-deep:#6f4c12;
  --z-monitor:#3f6486; --z-monitor-2:#33526e; --z-monitor-tint:#ffffff;
  --z-read:#1a6a72; --z-read-2:#155158; --z-read-tint:#e5f1f1; --chip-bg:#1a6a72; --chip-ink:#ffffff; --read-head:#1c6d75; --read-head-2:#14535a;
  --z-do:#b87c20; --z-do-2:#96631a; --z-do-tint:#faecd2;
  --hud-1:#274056; --hud-2:#182838; --hud-label:rgba(203,220,236,.75); --gauge-track:rgba(116,196,228,.26);
  --good:#3f7d38; --good-tint:#e6efe0; --good-line:#bcd8b1;
  --warn:#c06a10; --warn-tint:#f7ead2; --warn-line:#eece9b;
  --bad:#c0392b; --bad-tint:#f7e4df; --bad-line:#eec5bd;
  --info:#1a6a72; --info-tint:#e5f1f1;
  --g-red:#e2604e; --g-amber:#f0ad2e; --g-green:#5fbf53;
  --shadow:0 1px 2px rgba(24,42,66,.06),0 3px 10px rgba(24,42,66,.08);
  --shadow-lg:0 2px 6px rgba(24,42,66,.08),0 24px 50px rgba(24,42,66,.18);
}
:root[data-theme="dark"]{
  --ground:#1b2632; --surface:#2b3948; --surface-2:#35434f; --surface-3:#41505e;
  --ink:#eef4f9; --ink-2:#c4d0db; --ink-3:#9fb0bd; --ink-4:#82929f;
  --line:#3c4a58; --line-2:#313e4b;
  --navy:#233a54; --navy-2:#152840; --navy-ink:#eef4f9;
  --teal:#e0a24a; --teal-strong:#ecb469; --teal-tint:#3a2c15; --teal-deep:#c2872f;
  --z-monitor:#7ea6c8; --z-monitor-2:#98b7d2; --z-monitor-tint:#2c3f52;
  --z-read:#5ac0c7; --z-read-2:#7bd3d9; --z-read-tint:#153230; --chip-bg:#3ba7af; --chip-ink:#0b2321; --read-head:#17656d; --read-head-2:#0f4a51;
  --z-do:#e0a24a; --z-do-2:#eab868; --z-do-tint:#342a13;
  --hud-1:#28405a; --hud-2:#16222f; --hud-label:rgba(203,220,236,.72); --gauge-track:rgba(116,196,228,.24);
  --good:#5fbf53; --good-tint:#213a20; --good-line:#356a3a;
  --warn:#e0a02a; --warn-tint:#3a2f14; --warn-line:#5f4a1c;
  --bad:#e2604e; --bad-tint:#3a221c; --bad-line:#61332b;
  --info:#5ac0c7; --info-tint:#153230;
  --g-red:#e2604e; --g-amber:#f0ad2e; --g-green:#5fbf53;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.4);
  --shadow-lg:0 10px 24px rgba(0,0,0,.4),0 28px 56px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
svg:not([width]){width:1.1em;height:1.1em;flex:none}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,h5{margin:0;font-weight:700;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:4px}
::selection{background:var(--teal);color:#fff}
.serif{font-family:var(--serif)}
/* Rule 3: hide scrollbars everywhere; wheel/trackpad still scroll */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}

#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- Top bar (navy chrome) ---------- */
.topbar{flex:none;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);border-bottom:1px solid rgba(255,255,255,.05);box-shadow:0 6px 22px rgba(10,20,34,.18);position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:0 20px;height:54px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.01em;font-size:15px}
.brand .emblem{width:30px;height:30px;border-radius:7px;background:linear-gradient(160deg,#e0a659,#a9741f);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.brand .emblem svg{width:18px;height:18px}
.brand small{display:block;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.tb-spacer{margin-left:auto}
.tb-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#eaf1fb;border-radius:100px;padding:7px 13px;font-size:12.5px;font-weight:650}
.tb-btn:hover{background:rgba(255,255,255,.15)}
.tb-btn svg{width:15px;height:15px}
.tb-tag{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.55)}

/* ---------- Generic ---------- */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-strong)}
.btn-go{display:inline-flex;align-items:center;gap:10px;background:var(--good);color:#fff;border:0;border-radius:var(--r);padding:13px 22px;font-weight:750;font-size:15px;box-shadow:0 3px 0 #00602c}
.btn-go:hover{filter:brightness(1.05)}
.btn-go:active{transform:translateY(2px);box-shadow:0 1px 0 #00602c}
.btn-go svg{width:18px;height:18px}
.btn-go[disabled]{background:var(--surface-3);color:var(--ink-4);box-shadow:none;cursor:not-allowed}
.btn-ghost{display:inline-flex;align-items:center;gap:9px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;font-weight:700;font-size:14px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost svg{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* ---------- Landing ---------- */
.landing{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:36px 22px;background:
  radial-gradient(1100px 460px at 82% -8%,rgba(176,122,36,.14),transparent 60%),var(--ground)}
.land-card{max-width:760px;width:100%;text-align:left}
.land-kicker{display:inline-flex;align-items:center;gap:8px;background:var(--teal-tint);color:var(--teal-strong);border:1px solid #e6d3ad;border-radius:100px;padding:6px 14px;font-size:12px;font-weight:750;letter-spacing:.04em}
.land-kicker svg{width:15px;height:15px}
.land-card h1{font-size:44px;letter-spacing:-.025em;margin:20px 0 0;line-height:1.02}
.land-card .lead{font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--ink-2);margin-top:16px;max-width:60ch}
.land-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.land-facts .lf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.land-facts .lf .lf-ic{width:48px;height:48px;border-radius:11px;background:var(--teal-tint);color:var(--teal-strong);display:grid;place-items:center;margin-bottom:12px}
.land-facts .lf .lf-ic svg{width:27px;height:27px}
.land-facts .lf h4{font-size:14px}
.land-facts .lf p{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.land-actions{margin-top:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.land-note{font-size:12.5px;color:var(--ink-4);max-width:44ch}

/* ---------- Scene shell ---------- */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 20px 18px;max-width:1240px;width:100%;margin:0 auto}

/* instrument cluster */
.superstrip{flex:none;display:flex;align-items:stretch;gap:10px;margin-bottom:13px}
.sv-clock{flex:none;background:linear-gradient(180deg,var(--hud-1),var(--hud-2));color:#fff;border:1px solid rgba(255,255,255,.07);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 12px rgba(10,20,34,.20);padding:9px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:118px}
.sv-clock .cl{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:1px}
.sv-clock .cw{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:rgba(232,238,242,.6);font-weight:700}
.sv-gauge{flex:1;min-width:0;background:linear-gradient(180deg,var(--hud-1),var(--hud-2));border:1px solid rgba(255,255,255,.07);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 12px rgba(10,20,34,.20);padding:9px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sv-gauge svg{width:118px;height:auto;display:block}
.sv-gauge .gv{transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1),stroke .3s}
.sv-gauge .g-num{font-family:var(--sans);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.sv-gauge .g-cap{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.sv-gauge .g-cap b{font-size:12.5px;font-weight:800}
.sv-gauge .g-cap span{font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--hud-label);margin-top:1px}
.sv-stat{flex:1;display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,var(--hud-1),var(--hud-2));border:1px solid rgba(255,255,255,.07);border-radius:var(--r);padding:9px 15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 12px rgba(10,20,34,.20)}
.sv-stat .si{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;flex:none}
.sv-stat .si svg{width:24px;height:24px}
.sv-stat .sl{font-size:11px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--hud-label)}
.sv-stat .sv{font-size:14px;font-weight:750;margin-top:1px}
.sv-ok .si{background:var(--good-tint);color:var(--good)} .sv-ok .sv{color:var(--good)}
.sv-warn .si{background:var(--warn-tint);color:var(--warn)} .sv-warn .sv{color:var(--warn)}
.sv-bad .si{background:var(--bad-tint);color:var(--bad)} .sv-bad .sv{color:var(--bad)}

/* scene grid: moment + evidence */
.scene{flex:1;min-height:0;display:grid;grid-template-columns:1fr 322px;gap:16px}
.moment{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden;padding:22px 28px}
.m-scene-ic{width:52px;height:52px;border-radius:12px;background:var(--teal-tint);color:var(--teal-strong);display:grid;place-items:center;margin-bottom:16px}
.m-scene-ic svg{width:29px;height:29px}
.moment .eyebrow{margin-bottom:2px}
/* bespoke scene illustration (photos can drop into the same slot later) */
.scene-illo{position:relative;flex:none;height:150px;border-radius:var(--r-lg);background:radial-gradient(135% 160% at 22% -12%,var(--teal-tint),var(--surface-2));border:1px solid var(--line);display:grid;place-items:center;margin-bottom:18px;overflow:hidden}
.scene-illo.warn{background:radial-gradient(135% 160% at 22% -12%,var(--warn-tint),var(--surface-2))}
.scene-illo svg{height:120px;width:auto;display:block}
.scene-illo.has-img{flex:1 1 auto;min-height:96px;height:auto;padding:0;background:none;display:block;margin-bottom:16px}
.scene-illo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;transform-origin:55% 42%;animation:kenburns 24s ease-in-out infinite alternate;will-change:transform}
@keyframes kenburns{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.18) translate(-2.2%,-1.6%)}}
.scene-illo img.no-kb{animation:none}
@media (prefers-reduced-motion:reduce){.scene-illo img{animation:none}}
/* buzzer light: red glow over the intercom button, flashed in sync with the sound */
.buzz-glow{position:absolute;width:78px;height:78px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:2;filter:blur(1px);mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,66,48,.95),rgba(255,48,36,.5) 38%,rgba(255,40,30,0) 70%)}
.il{fill:none;stroke:var(--teal-strong);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.il-soft{fill:none;stroke:var(--teal-strong);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:.32}
.il-fill{fill:var(--surface)}
.il-tint{fill:var(--teal-tint)}
.il-skin{fill:#f0d0b4}
.il-dot{fill:var(--teal-strong);stroke:none}
.il-warn{stroke:var(--warn)}
.il-warn-f{fill:var(--warn);stroke:var(--warn)}
.scene-text{font-family:var(--scene);font-size:19px;line-height:1.6;color:var(--ink);margin-top:12px;max-width:54ch;letter-spacing:-.005em}
.m-q{font-size:15px;font-weight:750;color:var(--ink-2);margin-top:22px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{text-align:left;display:flex;gap:13px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);transition:background .12s,border-color .12s}
.opt:hover{border-color:#b9c6d2;background:var(--surface-2)}
.opt .ob{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center}
.opt .ob svg{width:17px;height:17px;color:#fff;opacity:0}
.opt .ot{font-size:14.5px;line-height:1.42;color:var(--ink)}
.opt.sel{background:var(--teal-tint);border-color:var(--teal)}
.opt.sel .ob{background:var(--teal);border-color:var(--teal)} .opt.sel .ob svg{opacity:1}

/* confidence */
.conf-wrap{margin:auto 0;max-width:46ch}
.conf-wrap .eyebrow{margin-bottom:10px}
.conf-wrap h3{font-size:22px;letter-spacing:-.02em}
.conf-wrap p{color:var(--ink-3);font-size:14.5px;margin-top:8px}
.conf-choice{display:flex;gap:9px;align-items:flex-start;margin-top:16px;padding:12px 15px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);font-size:14.5px;color:var(--ink);font-family:var(--serif)}
.conf-choice svg{width:18px;height:18px;color:var(--teal-strong);flex:none;margin-top:3px}
.conf-opts{display:flex;gap:11px;margin-top:22px;flex-wrap:wrap}
.conf-pill{display:flex;flex-direction:column;gap:5px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;box-shadow:var(--shadow);min-width:150px;flex:1}
.conf-pill:hover{border-color:var(--teal);background:var(--teal-tint)}
.conf-pill .cp-ic{width:42px;height:42px;border-radius:9px;background:var(--teal-tint);color:var(--teal-strong);display:grid;place-items:center}
.conf-pill .cp-ic svg{width:24px;height:24px}
.conf-pill b{font-size:15px}
.conf-pill span{font-size:12px;color:var(--ink-4)}

/* micro consequence */
.micro{margin:auto 0;max-width:54ch}
.micro .m-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 12px;border-radius:100px}
.micro .m-tag svg{width:15px;height:15px}
.m-good{background:var(--good-tint);color:var(--good)}
.m-warn{background:var(--warn-tint);color:var(--warn)}
.m-bad{background:var(--bad-tint);color:var(--bad)}
.micro .m-body{font-family:var(--serif);font-size:19px;line-height:1.55;margin-top:16px;color:var(--ink)}

.evi{min-height:0;display:flex;flex-direction:column;background:var(--z-read-tint);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}

.evi-head p{font-size:11.5px;color:rgba(255,255,255,.62);margin-top:3px}
.evi-scroll{flex:1;min-height:0;overflow:auto;padding:10px 12px}
.evi-grp{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--z-read-2);padding:8px 4px 6px}
.doc-row{width:100%;text-align:left;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);border:1px solid transparent;background:none}

.doc-row .dt{font-size:13px;font-weight:650;line-height:1.25;flex:1}
.doc-row .dts{font-size:11px;color:var(--ink-4);margin-top:1px;font-weight:400}
.doc-row .dv{flex:none;width:18px;height:18px;color:var(--good)}
.doc-row.opened .di{background:var(--good);color:#fff}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(10,22,36,.55);backdrop-filter:blur(2px);z-index:80;display:grid;place-items:center;padding:24px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:560px;width:100%;max-height:86vh;overflow:auto;animation:pop .18s}

.doc-modal .dm-kick{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4)}

.doc-modal .dm-x{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--ink-3)}
.doc-modal .dm-x:hover{background:var(--surface-3)}
.doc-modal .dm-x svg{width:17px;height:17px}
.doc-body{padding:20px 24px 8px}
.doc-body .dl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px}
.doc-body .dl li{display:flex;gap:11px;font-size:14.5px;line-height:1.45;color:var(--ink)}
.doc-body .dl li svg{width:17px;height:17px;color:var(--z-read);flex:none;margin-top:2px}
.doc-note{font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:4px}
.dm-prov{padding:14px 24px 22px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-4)}
.dm-prov svg{width:15px;height:15px}
.dm-flag{margin:8px 24px 22px;width:calc(100% - 48px);display:flex;align-items:center;gap:10px;justify-content:center;background:var(--warn-tint);border:1px solid var(--warn-line);color:var(--warn);border-radius:var(--r);padding:12px;font-weight:750;font-size:13.5px}

.dm-flag svg{width:17px;height:17px}
.dm-flagged{background:var(--good-tint);border-color:var(--good-line);color:var(--good)}

/* outcome */
.outcome{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:34px 22px}

.oc-badge svg{width:18px;height:18px}
.oc-good{background:var(--good-tint);color:var(--good)}
.oc-warn{background:var(--warn-tint);color:var(--warn)}
.oc-bad{background:var(--bad-tint);color:var(--bad)}
.oc-card h1{font-size:34px;letter-spacing:-.025em;margin-top:20px;line-height:1.08}

.oc-steps{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:6px 4px}

.oc-steps .os p{font-size:14px;color:var(--ink);line-height:1.4}
.oc-actions{margin-top:26px}

.crosstrack{margin-top:18px;background:linear-gradient(150deg,var(--navy),var(--navy-2));color:#eaf1fb;border-radius:var(--r-lg);padding:22px 24px;position:relative;overflow:hidden}
.crosstrack .ct-k{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#e2b877}
.crosstrack h3{color:#fff;font-size:20px;margin-top:8px;letter-spacing:-.02em}
.crosstrack p{font-size:14px;line-height:1.55;color:rgba(234,241,251,.85);margin-top:10px;max-width:64ch}
.crosstrack .r-band{margin-top:12px}
.r-chip{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:100px;font-weight:800;font-size:15px;letter-spacing:.02em;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}

.ct-node svg{width:15px;height:15px;color:#e2b877}
.ct-arr{color:#b79256}
.ct-actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}
.btn-navy{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--r);padding:11px 18px;font-weight:700;font-size:14px}

/* ---------- Audio (synthesised; no external files) ---------- */
const AUDIO = (function(){
  var ctx=null, master=null, amb=null;
  function ensure(){
    if(ctx) return ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
    }catch(e){ ctx=null; }
    return ctx;
  }
  function unlock(){ if(!ensure()) return; if(ctx.state==='suspended'){ ctx.resume(); } if(!S.muted){ ambienceStart(); } }
  function tone(type,freq,t0,dur,peak){
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0+dur+0.02);
  }
  function buzzer(){ if(S.muted||!ensure()) return; if(ctx.state==='suspended') ctx.resume();
    var t=ctx.currentTime, dur=1.15;
    // deep, smooth low buzz: warm tone with a gentle pulse (no harsh chop)
    var o1=ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=110;
    var o2=ctx.createOscillator(); o2.type='sine';     o2.frequency.value=110; // sub body
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=680; lp.Q.value=0.5;
    // faster sine tremolo for an electric flutter, still smooth (no chop)
    var trem=ctx.createGain(); trem.gain.value=0.85;
    var lfo=ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=26;
    var lfoAmt=ctx.createGain(); lfoAmt.gain.value=0.22;
    lfo.connect(lfoAmt).connect(trem.gain);
    // amplitude envelope: soft attack (no click), sustain, gentle release
    var amp=ctx.createGain();
    amp.gain.setValueAtTime(0.0001,t);
    amp.gain.exponentialRampToValueAtTime(0.17,t+0.06);
    amp.gain.setValueAtTime(0.17,t+dur-0.22);
    amp.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    var o2g=ctx.createGain(); o2g.gain.value=0.4;
    o1.connect(lp); o2.connect(o2g).connect(lp);
    lp.connect(trem).connect(amp).connect(master);
    o1.start(t); o2.start(t); lfo.start(t);
    o1.stop(t+dur+0.02); o2.stop(t+dur+0.02); lfo.stop(t+dur+0.02);
  }
  function phone(){ if(S.muted||!ensure()) return; if(ctx.state==='suspended') ctx.resume();
    var t=ctx.currentTime;
    for(var r=0;r<2;r++){ for(var b=0;b<2;b++){ var st=t+r*0.9+b*0.2; tone('sine',420,st,0.16,0.06); tone('sine',480,st+0.08,0.1,0.05); } }
  }
  function ambienceStart(){
    if(S.muted||!ensure()||amb) return; if(ctx.state==='suspended') ctx.resume();
    var buf=ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*0.5; }
    var src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
    var g=ctx.createGain(); g.gain.value=0.012;
    var hum=ctx.createOscillator(), hg=ctx.createGain(); hum.type='sine'; hum.frequency.value=70; hg.gain.value=0.006;
    src.connect(lp).connect(g).connect(master); hum.connect(hg).connect(master);
    src.start(); hum.start();
    amb={src:src,hum:hum};
  }
  function ambienceStop(){ if(!amb) return; try{ amb.src.stop(); amb.hum.stop(); }catch(e){} amb=null; }
  function setMuted(m){ if(m){ ambienceStop(); } else { unlock(); } }
  return {unlock:unlock, buzzer:buzzer, phone:phone, ambienceStart:ambienceStart, ambienceStop:ambienceStop, setMuted:setMuted};
})();
/* Buzzer: sound + a red flash on the intercom light, getting more
   insistent (shorter gaps) like an impatient delivery driver. */
var buzzTimers=[];
function flashGlow(){
  var g=document.querySelector('.buzz-glow');
  if(!g || !g.animate) return;
  // sustained red glow that flickers for the length of the buzz (~1.15s)
  g.animate(
    [{opacity:0},{opacity:1,offset:.04},{opacity:.72,offset:.22},{opacity:1,offset:.4},
     {opacity:.74,offset:.6},{opacity:.95,offset:.78},{opacity:0,offset:1}],
    {duration:1150, easing:'ease-out'}
  );
}
function buzzOnce(){ AUDIO.buzzer(); flashGlow(); }
function startBuzzSequence(){
  stopBuzzSequence();
  buzzOnce();
  var gaps=[3600,3200,2800,2500,2300,2200,2100,2100], t=0;
  for(var i=0;i<gaps.length;i++){ t+=gaps[i]; buzzTimers.push(setTimeout(buzzOnce, t)); }
}
function stopBuzzSequence(){ for(var i=0;i<buzzTimers.length;i++){ clearTimeout(buzzTimers[i]); } buzzTimers=[]; }
function playNodeCue(id){ if(id==='N2'){ startBuzzSequence(); } else if(id==='N3'){ AUDIO.phone(); } }

  const o=node.options.find(function(x){return x.id===S.pendingChoice;});
  return '<span class="eyebrow">'+node.time+' &middot; '+node.label+'</span>'
    +(o?'<p class="conf-choice">'+svg(I.checkSmall)+'<span>'+o.text+'</span></p>':'')
    +'<p class="m-q">How confident are you in that decision?</p>'
    +'<div class="conf-opts">'
    + confPill('cautious','scale','Cautious','Not sure it was right')
    + confPill('measured','gauge2','Measured','Reasonably sure')
    + confPill('confident','bolt','Confident','Sure it was right')
    +'</div>';
}
function consequenceBody(node){
  const o=chosenOpt(FLOW[S.nodeIdx]);
  const last = S.nodeIdx>=FLOW.length-1;
  const btn = last
    ? '<button class="btn-go" data-act="resolve">'+svg(I.arrowR)+'See how the meal ends</button>'
    : '<button class="btn-go" data-act="next-node">'+svg(I.arrowR)+'Carry on</button>';
  // In-the-moment observation only: no grade, no coaching. The instrument
  // cluster above shows the situation change; judgement waits for the debrief.
  return '<span class="eyebrow">'+node.time+' &middot; '+node.label+'</span>'
    +'<p class="scene-text">'+(o?o.note:'')+'</p>'
    +'<div class="micro-actions">'+btn+'</div>';
}
function recogSceneText(){
  return S.primed
    ? 'Daniel coughs, once, hard. Then he goes quiet. His lips are moving but no sound comes.'
    : 'Daniel gives a small cough, then carries on. He clears his throat and keeps eating.';
}
function confPill(v,ic,b,s){
  return '<button class="conf-pill" data-act="confidence" data-val="'+v+'"><span class="cp-ic">'+svg(I[ic])+'</span><b>'+b+'</b><span>'+s+'</span></button>';
}

/* ---------- Instrument cluster ---------- */
/* Live mealtime-risk score, 0..100, derived from the running mechanics.
   Rises as controls slip; stays low when the plan is held. */
function riskScore(){
  // Derived from applied state only, so the gauge does not move until a
  // choice is committed (after the confidence rating on confidence nodes).
  let r=14;                         // baseline: new meds, "drowsy lately"
  if(S.foodAccessible) r+=8;        // others' food within reach
  if(S.plateUnverified) r+=16;      // served the plate without checking
  if(!S.supervisionOk) r+=26;       // supervision currently broken
  r += (S.splits||0)*8;             // attention divided
  if(S.primed) r+=24;               // unsafe mouthful possible
  if(S.cc1) r+=6; if(S.cc2) r+=6;
  return clamp(r);
}
function riskZone(r){
  return r<34 ? {c:'var(--g-green)',l:'Low'}
       : r<67 ? {c:'var(--g-amber)',l:'Elevated'}
              : {c:'var(--g-red)',l:'High'};
}
/* Assurance direction: higher = safer (green). Risk is the inverse. */
function assurZone(v){ return v>=70 ? 'var(--g-green)' : v>=40 ? 'var(--g-amber)' : 'var(--g-red)'; }
function meter(value,color,word,label){
  const len=157.08; const off=(len*(1-value/100)).toFixed(2);
  return '<div class="sv-gauge">'
    +'<svg viewBox="0 0 120 66" aria-hidden="true">'
    +'<path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="var(--gauge-track)" stroke-width="9" stroke-linecap="round"/>'
    +'<path class="gv" d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+len+'" stroke-dashoffset="'+off+'"/>'
    +'<text x="60" y="55" text-anchor="middle" class="g-num" fill="'+color+'">'+value+'</text>'
    +'</svg>'
    +'<div class="g-cap"><b style="color:'+color+'">'+word+'</b><span>'+label+'</span></div>'
    +'</div>';
}
function superstrip(){
  const t=currentTime();
  const c=S.choices;
  const rk=riskScore(), rz=riskZone(rk);
  const split=['N2','N3','N4'].some(function(n){return c[n]==='b';});
  const sup = !S.supervisionOk ? {v:12,w:'Broken'} : split ? {v:60,w:'Divided'} : {v:100,w:'Eyes on'};
  const food = S.foodAccessible ? {v:45,w:'In reach'} : {v:100,w:'Secured'};
  const dan = S.primed ? {v:50,w:'Unsettled'} : {v:100,w:'Settled'};
  return '<div class="superstrip">'
    +'<div class="sv-clock"><div class="cw">Larkfield &middot; teatime</div><div class="cl">'+t+'</div></div>'
    + meter(rk, rz.c, rz.l, 'Mealtime risk')
    + meter(sup.v, assurZone(sup.v), sup.w, 'Supervision')
    + meter(food.v, assurZone(food.v), food.w, 'Access to food')
    + meter(dan.v, assurZone(dan.v), dan.w, 'Daniel')
    +'</div>';
}

/* ---------- Evidence rail ---------- */
function eviRail(){
  const openedCount = DOC_ORDER.filter(function(id){return S.opened[id];}).length;
  const rows = function(grp){
    return DOC_ORDER.filter(function(id){return DOCS[id].group===grp;}).map(function(id){
      const d=DOCS[id]; const op=S.opened[id];
      return '<button class="doc-row'+(op?' opened':'')+'" data-act="open-doc" data-id="'+id+'">'
        +'<span class="di">'+svg(I[d.icon])+'</span>'
        +'<span class="dt">'+d.title+(d.ref?'<span class="dts">Toolkit '+d.ref+'</span>':'<span class="dts">Daniel’s file</span>')+'</span>'
        +(op?'<span class="dv">'+svg(I.checkSmall)+'</span>':'')
        +'</button>';
    }).join('');
  };
  return '<div class="evi">'
    +'<div class="evi-head"><h3>'+svg(I.eye)+'Records &amp; tools</h3>'
    +'<p>Opened '+openedCount+' of '+DOC_ORDER.length+'. Open a document to read it and judge it yourself.</p></div>'
    +'<div class="evi-scroll">'
    +'<div class="evi-grp">Daniel’s records</div>'+rows('daniel')
    +'<div class="evi-grp">Reference tools</div>'+rows('ref')
    +'</div></div>';
}

/* ---------- Document modal ---------- */
function docModal(id){
  const d=DOCS[id];
  const items=d.list.map(function(x){return '<li>'+svg(I[x.ic])+'<span>'+x.t+'</span></li>';}).join('');
  let flag='';
  if(d.flag){
    flag = S.medFlagged
      ? '<div class="dm-flag dm-flagged">'+svg(I.check)+'Flagged for reassessment and an Early Watch entry</div>'
      : '<button class="dm-flag" data-act="flag-med">'+svg(I.flag)+'Flag: the plan may under-state today’s risk</button>';
  }
  return '<div class="backdrop" data-act="close-modal"><div class="modal doc-modal" data-stop="1">'
    +'<div class="dm-top"><span class="dm-emblem">'+svg(I[d.icon])+'</span>'
    +'<div><div class="dm-kick">'+d.kicker+(d.ref?' &middot; '+d.ref:'')+'</div><h3>'+d.title+'</h3></div>'
    +'<button class="dm-x" data-act="close-modal">'+svg(I.x)+'</button></div>'
    +'<div class="doc-body"><ul class="dl">'+items+'</ul>'
    +(d.note?'<p class="doc-note" style="margin-top:16px">'+d.note+'</p>':'')
    +'</div>'
    + flag
    +'<div class="dm-prov">'+svg(I.lock)+d.prov+'</div>'
    +'</div></div>';
}

/* ---------- Outcome (S5) ---------- */
function viewOutcome(){
  const o=S.outcome;
  let badge,badgeCls,h,body,steps='';
  if(o==='A'){
    const top = !S.primed && S.medFlagged;
    badgeCls='oc-good'; badge='Prevention';
    h = top ? 'A safe, unhurried meal, and you saw what the plan missed' : 'Daniel has a safe, unhurried meal';
    body = 'Nothing dramatic happened, which is the whole point. The right texture, steady pacing and unbroken supervision meant the busy teatime was just fifteen ordinary minutes. '
      + (top ? 'You also read the medication change against the drowsiness note and flagged that Daniel needs a reassessment. That is prevention working several days before any incident.'
             : 'The incident was prevented by the ordinary controls holding, not by luck.');
  } else if(o==='B'){
    badgeCls='oc-warn'; badge='Near miss, recovered';
    h='Daniel coughs hard on an unsafe mouthful, then recovers';
    body='An unsafe mouthful was taken and Daniel coughed. You recognised it, stopped the meal, kept him upright and called for help, and he cleared it. You then record a near miss and add an Early Watch entry so it is reviewed. Recognising and learning from a near miss is success, not failure. The conditions for it, though, were set earlier in the shift.';
  } else {
    badgeCls='oc-bad'; badge='Emergency';
    h='Daniel experiences a serious choking episode';
    body='With an unsafe mouthful and a missed quiet phase, Daniel’s airway obstructs. This was not one mistake at teatime. It was a chain: a plate that did not meet his plan, supervision broken while food was in reach, and a medication change no one had connected. The response now follows the source escalation sequence.';
    steps = '<div class="oc-steps">'+EMERGENCY_STEPS.map(function(s,i){
      return '<div class="os"><span class="osn">'+(i+1)+'</span><p>'+s+'</p></div>';
    }).join('')+'</div>';
  }
  return '<div class="outcome"><div class="oc-card">'
    +'<span class="oc-badge '+badgeCls+'">'+svg(o==='A'?I.shield:I.alertT)+badge+'</span>'
    +'<h1>'+h+'</h1>'
    +'<p class="oc-body">'+body+'</p>'
    + steps
    +'<div class="oc-actions"><button class="btn-go" data-act="to-debrief">'+svg(I.arrowR)+'Go to the debrief</button></div>'
    +'</div></div>';
}

/* ---------- Scoring ---------- */
function scoreProfile(){
  const c=S.choices; const m={a:100,b:55,c:15};
  const info = clamp((S.openedBeforeServe?45:0) + (c.N1==='a'?25:0) + (S.medFlagged?30:0));
  const prep = m[c.N1]||0;
  const dyn  = Math.round(((m[c.N2]||0)+(m[c.N3]||0))/2);
  const person = Math.round(((c.N1==='a'?72:c.N1==='b'?48:20) + (c.N4==='a'?100:c.N4==='b'?55:25))/2);
  const team = m[c.N4]||0;
  const resp = c.N5?(m[c.N5]||0):0;
  return [
    {k:'Information use', v:info, note:'Read the plan before serving; connected the medication clue.'},
    {k:'Preparation', v:prep, note:'Verified and corrected the plate before the meal.'},
    {k:'Dynamic judgement', v:dyn, note:'Held supervision across the door and the phone.'},
    {k:'Person-centred practice', v:person, note:'Kept Daniel’s pace and dignity, no blanket restriction.'},
    {k:'Team coordination', v:team, note:'Called for help rather than abandoning supervision.'},
    {k:'Response & learning', v:resp, note:'Recognised the signs and acted; recorded the near miss.'},
  ];
}
function barCls(v){ return v>=70?'hi':v>=40?'mid':'lo'; }

/* ---------- Debrief (S6) ---------- */
function viewDebrief(){
  const doms=scoreProfile();
  const domHtml=doms.map(function(d){
    return '<div class="dom-row"><div class="dr-top"><b>'+d.k+'</b><span>'+d.v+' / 100</span></div>'
      +'<div class="dom-bar"><i class="'+barCls(d.v)+'" style="width:'+d.v+'%"></i></div></div>';
  }).join('');

  const cc1 = ccItem('CC1', 'Supervision', S.cc1, 'You kept eyes on Daniel while food was in reach.', 'Supervision broke while food was accessible.');
  const cc2 = ccItem('CC2', 'Unsafe mouthful', S.cc2, 'Food served always met Daniel’s plan.', 'Food that did not meet the plan was allowed.');

  const sawMed = S.opened.DOC_MEDS && S.opened.DOC_HANDOVER;
  const reveal = S.medFlagged
    ? '<div class="reveal-box ok"><h5>'+svg(I.check)+'You saw what the plan did not say</h5><p>You read the new medication against the “drowsy lately” line and flagged that Daniel’s plan needs a reassessment. The plan alone would have under-stated today’s risk.</p></div>'
    : '<div class="reveal-box"><h5>'+svg(I.alertT)+'What the evidence actually showed</h5><p>'
      +(sawMed?'You opened the medication record and the handover note, but the connection was left unflagged. ':'A medication started three weeks ago, listing sedation and dry mouth, was recorded but never opened. ')
      +'Daniel’s plan and EDAR do not reflect it, so the plan on its own under-states today’s risk.</p></div>';

  const eventsHtml = summariseEvents().map(function(e){
    return '<div class="ev"><span class="evk">'+e.k+'</span><span class="evd">'+e.d+'</span></div>';
  }).join('');

  const outLabel = S.outcome==='A'?'Prevention':S.outcome==='B'?'Near miss, recovered':'Emergency';

  return '<div class="debrief"><div class="db-wrap">'
    +'<div class="db-head"><div><span class="eyebrow">Debrief &middot; the teatime shift</span>'
    +'<h1>How the shift went, and why</h1></div>'
    +'<span class="oc-badge '+(S.outcome==='A'?'oc-good':S.outcome==='B'?'oc-warn':'oc-bad')+'">'+svg(S.outcome==='A'?I.shield:I.alertT)+outLabel+'</span></div>'

    +'<div class="db-grid">'
    +  '<div class="panel"><h3>'+svg(I.gauge2)+'Your practice profile</h3>'
    +    '<p class="ph-sub">Weighted domains, not a single mark. Critical controls sit above the domains: a control missed is never offset by strong practice elsewhere.</p>'
    +    '<div class="dom">'+domHtml+'</div></div>'

    +  '<div class="panel"><h3>'+svg(I.shield)+'Critical controls</h3>'
    +    '<p class="ph-sub">The two that keep Daniel safe.</p>'
    +    '<div class="cc-list">'+cc1+cc2+'</div>'
    +    reveal
    +  '</div>'
    +'</div>'

    +'<div class="db-grid">'
    +  '<div class="panel"><h3>'+svg(I.route)+'Captured this run</h3>'
    +    '<p class="ph-sub">The platform records what you opened and relied on, not just the answer you chose.</p>'
    +    '<div class="events">'+eventsHtml+'</div></div>'
    +  '<div class="panel" style="display:flex;flex-direction:column;justify-content:center;align-items:flex-start">'
    +    '<h3>'+svg(I.restart)+'Run it again</h3>'
    +    '<p class="ph-sub" style="margin-bottom:16px">Each run is assessed on its own. You can take the shift again.</p>'
    +    '<button class="btn-ghost" data-act="restart">'+svg(I.restart)+'Restart the shift</button></div>'
    +'</div>'

    + readiness()
    +'</div></div>';
}
function ccItem(code,name,tripped,holdTxt,tripTxt){
  return '<div class="cc-item '+(tripped?'cc-trip':'cc-hold')+'">'
    +'<div class="cci">'+svg(tripped?I.alertT:I.check)+'</div>'
    +'<div><h5>'+code+' &middot; '+name+'</h5><p>'+(tripped?tripTxt:holdTxt)+'</p></div></div>';
}
function summariseEvents(){
  const out=[];
  const opened=DOC_ORDER.filter(function(id){return S.opened[id];}).length;
  out.push({k:'DOC_OPENED', d:opened+' of '+DOC_ORDER.length+' documents opened'});
  out.push({k:'PLATE_VERIFIED', d:S.plateVerified?'Checked against IDDSI Level 6 before serving':'Not verified before serving'});
  const breaks=S.events.filter(function(e){return e.t==='SUPERVISION_BREAK';}).length;
  out.push({k:'SUPERVISION_BREAK', d:breaks===0?'None: supervision held all shift':breaks+' break'+(breaks>1?'s':'')+' logged'});
  out.push({k:'MEDCLUE_FLAGGED', d:S.medFlagged?'Yes: reassessment flagged':'No'});
  const esc=S.events.filter(function(e){return e.t==='ESCALATION';}).length;
  out.push({k:'ESCALATION', d:esc?'Called for the shift leader':'Not escalated'});
  out.push({k:'OUTCOME', d:'Path '+S.outcome+' ('+(S.outcome==='A'?'prevention':S.outcome==='B'?'near miss':'emergency')+')'});
  return out;
}
function readiness(){
  // Assessment verdict, not coaching. Derived from the critical controls,
  // the outcome and the practice profile.
  const doms=scoreProfile();
  const lowAny=doms.some(function(d){return d.v<40;});
  let band,cls,txt;
  if(S.cc1 || S.cc2 || S.outcome==='C'){
    band='Not yet ready'; cls='r-bad';
    txt='A critical control was missed during the shift. In practice that is the difference between a safe meal and a serious incident, and it cannot be offset by good work elsewhere.';
  } else if(S.outcome==='B' || lowAny){
    band='Developing'; cls='r-warn';
    txt='Daniel came through the meal, but safety rested on recovery or on margins thinner than they needed to be. Parts of practice are not yet consistent.';
  } else {
    band='Ready'; cls='r-good';
    txt='Supervision held, the food met Daniel’s plan, and the meal stayed safe throughout. This is the standard a lone teatime shift asks for.';
  }
  return '<div class="crosstrack '+cls+'">'
    +'<div class="ct-k">Readiness &middot; this run</div>'
    +'<div class="r-band"><span class="r-chip">'+svg(band==='Ready'?I.shield:I.alertT)+band+'</span></div>'
    +'<p>'+txt+'</p>'
    +'</div>';
}

/* ---------- Reducers / actions ---------- */
function beginShift(){ AUDIO.unlock(); S.stage='handover'; save(); render(); }
function toTable(){ S.stage='node'; S.nodeIdx=0; enterNode(); }
function enterNode(){
  stopBuzzSequence();
  S.sub='decide';               // decide first; confidence is asked inline after the choice
  S.pendingChoice=null;
  save(); render();
  playNodeCue(FLOW[S.nodeIdx]);
}
function chosenOpt(nodeId){
  const node=NODES[nodeId];
  return node.options.find(function(o){return o.id===S.choices[nodeId];});
}
/* Apply the choice's state effects. Deferred until after the confidence
   rating on confidence nodes, so the gauges do not hint the outcome. */
function applyEffects(nodeId){
  const node=NODES[nodeId]; const opt=chosenOpt(nodeId);
  if(nodeId==='N1'){
    S.openedBeforeServe = !!(S.opened.DOC_PLAN || S.opened.DOC_IDDSI);
    if(opt.verified){ S.plateVerified=true; log('PLATE_VERIFIED',{bool:true}); log('DOC_RELIED',{id:'DOC_PLAN'}); }
    else if(opt.id==='b'){ S.plateUnverified=true; }   // served without checking
  }
  if(opt.securesFood){ S.foodAccessible=false; }
  if(opt.cc==='CC2'){ S.cc2=true; S.primed=true; S.supervisionOk=false; }
  else if(opt.cc==='CC1'){
    S.supervisionOk=false;
    log('SUPERVISION_BREAK',{node:nodeId,duration_ms:12000});
    log('LEFT_TABLE',{node:nodeId,food_accessible:S.foodAccessible});
    if(S.foodAccessible){ S.cc1=true; S.primed=true; }
  } else if(opt.kind==='risky'){
    if(nodeId==='N2'){ log('SUPERVISION_BREAK',{node:nodeId,duration_ms:4000}); log('LEFT_TABLE',{node:nodeId,food_accessible:S.foodAccessible}); }
    if(nodeId==='N2'||nodeId==='N3'||nodeId==='N4'){ S.splits=(S.splits||0)+1; }
    S.supervisionOk=true;
  } else {
    S.supervisionOk=true;
  }
  if(opt.escalation){ log('ESCALATION',{type:'shift_leader',latency_ms:0}); }
  if(node.recog){
    const latency = opt.id==='a'?1500:opt.id==='b'?6000:12000;
    log('REDFLAG_RECOGNISED',{latency_ms:latency});
  }
}
function chooseOption(optId){
  stopBuzzSequence();
  const nodeId=FLOW[S.nodeIdx];
  const node=NODES[nodeId];
  if(node.confidence && !S.pendingChoice){
    // hold the choice and ask confidence inline before revealing anything
    S.pendingChoice=optId; save(); render(); return;
  }
  S.choices[nodeId]=optId;
  applyEffects(nodeId);
  S.sub='consequence'; save(); render();
}
function setConfidence(val){
  const nodeId=FLOW[S.nodeIdx];
  S.choices[nodeId]=S.pendingChoice;
  S.conf[nodeId]=val;
  log('CONFIDENCE', {node:nodeId, value:val});
  applyEffects(nodeId);
  S.pendingChoice=null;
  S.sub='consequence'; save(); render();
}
function nextNode(){
  if(S.nodeIdx < FLOW.length-1){ S.nodeIdx++; enterNode(); }
  else { resolve(); }
}
function resolve(){
  const n5=S.choices.N5;
  if(!S.primed){ S.outcome='A'; }
  else { S.outcome = (n5==='a'||n5==='b') ? 'B' : 'C'; }
  if(S.outcome==='B'){ log('NEARMISS_RECORDED',{bool:true}); }
  log('OUTCOME',{path:S.outcome});
  AUDIO.ambienceStop();
  S.stage='outcome'; save(); render();
}
function toDebrief(){ S.stage='debrief'; save(); render(); }

function openDoc(id){
  if(!S.opened[id]){
    const order=DOC_ORDER.filter(function(x){return S.opened[x];}).length+1;
    S.opened[id]=true; log('DOC_OPENED',{id:id,order:order,dwell_ms:0});
  }
  S.modal={id:id}; save(); render();
}
function flagMed(){ S.medFlagged=true; log('MEDCLUE_FLAGGED',{bool:true}); save(); render(); }
function closeModal(){ S.modal=null; save(); render(); }

function restart(){ const keep={theme:S.theme,muted:S.muted}; stopBuzzSequence(); AUDIO.ambienceStop(); S=Object.assign(initState(),keep); applyTheme(); save(); render(); }
function toggleMute(){ S.muted=!S.muted; AUDIO.setMuted(S.muted); save(); render(); }

/* ---------- Theme ---------- */
function applyTheme(){
  if(S.theme){ document.documentElement.setAttribute('data-theme',S.theme); }
  else{ document.documentElement.removeAttribute('data-theme'); }
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme:dark)').matches;
  S.theme = isDark ? 'light' : 'dark';
  applyTheme(); save(); render();
}

/* ---------- Events ---------- */
document.addEventListener('click', function(e){
  const el=e.target.closest('[data-act]');
  if(!el){ return; }
  const act=el.getAttribute('data-act');
  switch(act){
    case 'begin': beginShift(); break;
    case 'to-table': toTable(); break;
    case 'confidence': setConfidence(el.getAttribute('data-val')); break;
    case 'choose': chooseOption(el.getAttribute('data-opt')); break;
    case 'next-node': nextNode(); break;
    case 'resolve': nextNode(); break;
    case 'to-debrief': toDebrief(); break;
    case 'open-doc': openDoc(el.getAttribute('data-id')); break;
    case 'flag-med': flagMed(); break;
    case 'close-modal':
      // close only when the backdrop itself or the X is clicked, not the card body
      if(el.classList.contains('backdrop') && e.target.closest('.modal')){ break; }
      closeModal();
      break;
    case 'restart': restart(); break;
    case 'theme': toggleTheme(); break;
    case 'mute': toggleMute(); break;
  }
});

/* ---------- Boot ---------- */
applyTheme();
render();
</script>
</body>
</html>
