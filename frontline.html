/* ============================================================
   PracticE Ready, Frontline simulation, "The Teatime Shift".
   Shares The Risk Chain v7 "NHS clinical" design tokens so the
   two seats read as one product. Light is primary; a clinical
   dark variant sits on the theme toggle.
   ============================================================ */
/* ------------------------------------------------------------------
   Palette: "Dusk". A calm blue-grey backdrop drawn from the windows
   at teatime, so the warm care-home photography (amber lamplight, oak,
   the worker's navy jumper) glows against it. Four zone identities,
   each its own surface + accent so no two panels read alike:
     chrome  = navy  (top bar + records header: the "system" layer)
     monitor = navy HUD instrument panel (metric strip: things to watch)
     read    = cool card, navy header, slate chips (evidence: things to read)
     do      = amber (the scene + options: things to do; via --teal)
   Cards lift off the ground on real elevation, in light and dark.
   ------------------------------------------------------------------ */
:root{
  --ground:#f4f7fc; --ground-2:#fbfcff; --surface:#ffffff; --surface-2:#f3f6fb; --surface-3:#e8eef6;
  --zn-records:#e3f6fa; --zn-records-ln:#a6e0e8; --zn-tools:#f2eafb; --zn-tools-ln:#d7c3f0; --violet:#8a3ccb; --sheen:rgba(255,255,255,.85); --zn-metric-ln:#b1cbeb;
  --ink:#072a6b; --ink-2:#3c4f86; --ink-3:#6d7aa6; --ink-4:#9aa4c4;
  --line:#c9cdd4; --line-2:#e4e7ec;
  --navy:#0a2f7a; --navy-2:#072a6b; --navy-ink:#ffffff;
  --teal:#16afc2; --teal-strong:#0e8b9a; --teal-tint:#e3f6fa; --teal-deep:#0b6b78;
  --go:#ff7a1a; --go-sh:#d9620d; --kicker-bg:#e3f6fa; --kicker-line:#b9e4ec;
  --z-monitor:#21b8d9; --z-monitor-2:#1a97b4; --z-monitor-tint:#ffffff;
  --z-read:#16afc2; --z-read-2:#0e8b9a; --z-read-tint:#ffffff; --chip-bg:#16afc2; --chip-ink:#ffffff; --read-head:#ffffff; --read-head-2:#f3f6fb;
  --z-do:#ff7a1a; --z-do-2:#db6410; --z-do-tint:#fff1e4;
  --hud-1:#ffffff; --hud-2:#eef3f9; --hud-label:#5a6884; --gauge-track:#e2e8f1;
  --good:#1f9d57; --good-tint:#e4f6ec; --good-line:#bde7cd;
  --warn:#bd6510; --warn-tint:#fff2e0; --warn-line:#f5d6a6;
  --bad:#d84a42; --bad-tint:#fdeae8; --bad-line:#f4c4bf;
  --info:#16afc2; --info-tint:#e3f6fa;
  --g-red:#e0574f; --g-amber:#f0902a; --g-green:#2fb56a;
  --shadow:0 2px 6px rgba(20,38,74,.06),0 14px 30px rgba(20,38,74,.10);
  --shadow-lg:0 4px 14px rgba(20,38,74,.09),0 30px 60px rgba(20,38,74,.16);
  --r:12px; --r-sm:8px; --r-lg:18px;
  /* One humanist sans across every surface — the Frutiger / Clearview
     signage lineage, chosen for legibility at small sizes. Segoe UI is the
     closest default on Windows; Helvetica / Arial are the universal
     fallbacks. --serif and --scene are aliases so nothing reads as a second
     typeface; the whole product is one face. */
  --sans:"Source Sans 3","Helvetica Neue","Helvetica",sans-serif;
  --serif:var(--sans);
  --scene:var(--sans);
  --mono:var(--sans);
  /* Type scale: nine deliberate steps. Every font-size below snaps to one
     of these, so the interface reads as one system, not ad-hoc values. */
  --t-hero:38px; --t-h1:28px; --t-h2:21px; --t-h3:17px;
  --t-body:15.5px; --t-sm:14px; --t-cap:13px; --t-eyebrow:11.5px; --t-nano:10px;
}

    --z-do:#ff8a33; --z-do-2:#ffab63; --z-do-tint:#3a2a15;
    --hud-1:#20385e; --hud-2:#17294a; --hud-label:#8ea0c0; --gauge-track:#2e4c72;
    --good:#33c56f; --good-tint:#123626; --good-line:#245a3a;
    --warn:#f5a23c; --warn-tint:#37280f; --warn-line:#5c4319;
    --bad:#f0645a; --bad-tint:#361f1d; --bad-line:#5a322e;
    --info:#2fc4d8; --info-tint:#0e3a44;
    --g-red:#f0645a; --g-amber:#f5a23c; --g-green:#33c56f;
    --shadow:0 2px 12px rgba(0,0,0,.5),0 20px 44px rgba(0,0,0,.6);
    --shadow-lg:0 14px 34px rgba(0,0,0,.6),0 44px 78px rgba(0,0,0,.68);
  }
}
:root[data-theme="light"]{
  --ground:#f4f7fc; --ground-2:#fbfcff; --surface:#ffffff; --surface-2:#f3f6fb; --surface-3:#e8eef6;
  --zn-records:#e3f6fa; --zn-records-ln:#a6e0e8; --zn-tools:#f2eafb; --zn-tools-ln:#d7c3f0; --violet:#8a3ccb; --sheen:rgba(255,255,255,.85); --zn-metric-ln:#b1cbeb;
  --ink:#072a6b; --ink-2:#3c4f86; --ink-3:#6d7aa6; --ink-4:#9aa4c4;
  --line:#c9cdd4; --line-2:#e4e7ec;
  --navy:#0a2f7a; --navy-2:#072a6b; --navy-ink:#ffffff;
  --teal:#16afc2; --teal-strong:#0e8b9a; --teal-tint:#e3f6fa; --teal-deep:#0b6b78;
  --go:#ff7a1a; --go-sh:#d9620d; --kicker-bg:#e3f6fa; --kicker-line:#b9e4ec;
  --z-monitor:#21b8d9; --z-monitor-2:#1a97b4; --z-monitor-tint:#ffffff;
  --z-read:#16afc2; --z-read-2:#0e8b9a; --z-read-tint:#ffffff; --chip-bg:#16afc2; --chip-ink:#ffffff; --read-head:#ffffff; --read-head-2:#f3f6fb;
  --z-do:#ff7a1a; --z-do-2:#db6410; --z-do-tint:#fff1e4;
  --hud-1:#ffffff; --hud-2:#eef3f9; --hud-label:#5a6884; --gauge-track:#e2e8f1;
  --good:#1f9d57; --good-tint:#e4f6ec; --good-line:#bde7cd;
  --warn:#bd6510; --warn-tint:#fff2e0; --warn-line:#f5d6a6;
  --bad:#d84a42; --bad-tint:#fdeae8; --bad-line:#f4c4bf;
  --info:#16afc2; --info-tint:#e3f6fa;
  --g-red:#e0574f; --g-amber:#f0902a; --g-green:#2fb56a;
  --shadow:0 2px 6px rgba(45,55,95,.06),0 14px 30px rgba(45,55,95,.10);
  --shadow-lg:0 4px 14px rgba(45,55,95,.08),0 30px 60px rgba(45,55,95,.16);
}
:root[data-theme="dark"]{
  --ground:#060d1c; --ground-2:#0c1830; --surface:#17294a; --surface-2:#20385e; --surface-3:#2b4872;
  --ink:#eaf1fb; --ink-2:#b3c1da; --ink-3:#8695b5; --ink-4:#6a7a9c;
  --line:#294061; --line-2:#213551;
  --navy:#0c2668; --navy-2:#0b1f5d; --navy-ink:#eaf1fb;
  --teal:#2fc4d8; --teal-strong:#5cd6e6; --teal-tint:#0e3a44; --teal-deep:#8fe6f0;
  --go:#ff8a33; --go-sh:#cc5f12; --kicker-bg:rgba(47,196,216,.15); --kicker-line:rgba(47,196,216,.36);
  --z-monitor:#3ec4ea; --z-monitor-2:#6cd6f0; --z-monitor-tint:#1c3355;
  --z-read:#2fc4d8; --z-read-2:#6cdaea; --z-read-tint:#0f3244; --chip-bg:#16afc2; --chip-ink:#04252b; --read-head:#123354; --read-head-2:#0e2647;
  --z-do:#ff8a33; --z-do-2:#ffab63; --z-do-tint:#3a2a15;
  --hud-1:#20385e; --hud-2:#17294a; --hud-label:#8ea0c0; --gauge-track:#2e4c72;
  --good:#33c56f; --good-tint:#123626; --good-line:#245a3a;
  --warn:#f5a23c; --warn-tint:#37280f; --warn-line:#5c4319;
  --bad:#f0645a; --bad-tint:#361f1d; --bad-line:#5a322e;
  --info:#2fc4d8; --info-tint:#0e3a44;
  --g-red:#f0645a; --g-amber:#f5a23c; --g-green:#33c56f;
  --shadow:0 2px 12px rgba(0,0,0,.5),0 20px 44px rgba(0,0,0,.6);
  --shadow-lg:0 14px 34px rgba(0,0,0,.6),0 44px 78px rgba(0,0,0,.68);
}

*{box-sizing:border-box}
svg:not([width]){width:1.1em;height:1.1em;flex:none}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;color:var(--ink);background-attachment:fixed;
  background:
    radial-gradient(760px 460px at 8% -6%,rgba(15,157,180,.12),transparent 60%),
    radial-gradient(680px 440px at 100% 2%,rgba(28,58,104,.10),transparent 60%),
    radial-gradient(760px 520px at 50% 112%,rgba(245,127,32,.06),transparent 60%),
    var(--ground);
  font-family:var(--sans);font-size:var(--t-body);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,h5{margin:0;font-weight:700;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:4px}
::selection{background:var(--teal);color:#fff}
.serif{font-family:var(--serif)}
/* Rule 3: hide scrollbars everywhere; wheel/trackpad still scroll */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}

#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- Top bar (navy chrome) ---------- */
.topbar{flex:none;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);box-shadow:var(--shadow);border-radius:var(--r-lg);position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;max-width:1200px;width:100%;margin:14px auto 0}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.01em;font-size:var(--t-body)}
.brand .emblem{width:30px;height:30px;border-radius:7px;background:linear-gradient(160deg,#e0a659,#a9741f);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.brand .emblem svg{width:18px;height:18px}
.brand .brand-mark{width:38px;height:38px;flex:none;border-radius:9px;object-fit:contain;box-shadow:0 1px 3px rgba(0,0,0,.30)}
.pr-e{color:#16afc2;font-style:normal}
.brand small{display:block;font-weight:600;font-size:var(--t-eyebrow);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.tb-spacer{margin-left:auto}
.tb-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#eaf1fb;border-radius:100px;padding:7px 13px;font-size:var(--t-cap);font-weight:650}
.tb-btn:hover{background:rgba(255,255,255,.15)}
.tb-btn svg{width:15px;height:15px}
.tb-tag{font-size:var(--t-eyebrow);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.55)}

/* ---------- Generic ---------- */
.eyebrow{font-size:var(--t-cap);font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-strong)}
.btn-go{display:inline-flex;align-items:center;gap:10px;background:var(--go);color:#fff;border:0;border-radius:var(--r);padding:13px 22px;font-weight:750;font-size:var(--t-body);box-shadow:0 8px 18px rgba(245,127,32,.32);transition:filter .15s ease,transform .1s ease,box-shadow .15s ease}
.btn-go:hover{filter:brightness(1.05)}
.btn-go:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(245,127,32,.28)}
.btn-go svg{width:18px;height:18px}
.btn-go[disabled]{background:var(--surface-3);color:var(--ink-4);box-shadow:none;cursor:not-allowed}
.btn-ghost{display:inline-flex;align-items:center;gap:9px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;font-weight:700;font-size:var(--t-body)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost svg{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* ---------- Landing ---------- */
.landing{flex:1;min-height:0;overflow:auto;display:grid;place-items:start center;padding:16px 20px 28px}
.land-card{max-width:1200px;width:100%;text-align:left}
.land-hero{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;align-items:stretch}
.land-copy{min-width:0;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:22px 32px}
.land-media{position:relative;min-height:0}
.land-media img{width:100%;height:100%;min-height:280px;object-fit:cover;border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);display:block}
/* Inline intro video sits in the hero's right tile: a true 16:9 frame, centred
   in the column so it never stretches/crops the talking head. */
.land-media.land-video{align-self:center;aspect-ratio:16/9;min-height:0;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.land-media.land-video video{width:100%;height:100%;object-fit:cover;display:block;background:#0b1016;border-radius:inherit}
.land-media .lm-tag{position:absolute;left:14px;bottom:14px;display:inline-flex;align-items:center;gap:7px;background:rgba(16,35,64,.78);color:#fff;backdrop-filter:blur(4px);border-radius:100px;padding:7px 13px;font-size:var(--t-cap);font-weight:700}
.land-media .lm-tag svg{width:15px;height:15px}
.land-logo{display:block;width:auto;height:56px;margin:0 0 20px;object-fit:contain;object-position:left center}
.ll-dark{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ll-light{display:none}:root:not([data-theme="light"]) .ll-dark{display:block}}
[data-theme="dark"] .ll-light{display:none}
[data-theme="dark"] .ll-dark{display:block}
.land-kicker{display:inline-flex;align-items:center;gap:8px;background:var(--kicker-bg);color:var(--teal-strong);border:1px solid var(--kicker-line);border-radius:100px;padding:6px 14px;font-size:var(--t-cap);font-weight:750;letter-spacing:.04em}
.land-kicker svg{width:15px;height:15px}
.land-card h1{font-size:var(--t-hero);letter-spacing:-.025em;margin:18px 0 0;line-height:1.02}
.land-card .lead{font-family:var(--serif);font-size:var(--t-h3);line-height:1.55;color:var(--ink-2);margin-top:16px}
.land-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.land-facts .lf{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.land-facts .lf .lf-ic{width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,var(--z-read),var(--z-read-2));color:#fff;display:grid;place-items:center;margin-bottom:12px;box-shadow:0 4px 10px rgba(7,42,107,.16)}
.land-facts .lf:nth-child(1) .lf-ic{background:linear-gradient(160deg,#d94a8a,#b3396f)}
.land-facts .lf:nth-child(2) .lf-ic{background:linear-gradient(160deg,#0f8a9e,#0a5f70)}
.land-facts .lf:nth-child(3) .lf-ic{background:linear-gradient(160deg,var(--violet),#7331ad)}
.land-facts .lf .lf-ic svg{width:26px;height:26px}
.land-facts .lf h4{font-size:var(--t-h3)}
.land-facts .lf p{font-size:var(--t-sm);color:var(--ink-2);margin-top:5px;line-height:1.45}
.land-actions{margin-top:26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
/* Final CTA: its own full-width card below the fact tiles, so the button is the
   last thing after all the content (and the hero copy tile is shorter). */
.land-cta{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:14px;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 24px;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.land-cta .lc-prompt{margin:0;font-size:var(--t-h3);color:var(--ink-2);font-weight:600}
.land-cta .lc-prompt b{color:var(--ink);font-weight:800}
.land-note{font-size:var(--t-cap);color:var(--ink-4);max-width:44ch}

/* ---------- Scenario picker + brief (multi-scenario) ---------- */
.pick-head{margin:0 0 18px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:26px 30px}
.pick-head .land-kicker{margin-bottom:14px}
.pick-head h1{font-size:var(--t-hero);letter-spacing:-.025em;line-height:1.02;margin:0}
.pick-head p{font-family:var(--serif);font-size:var(--t-h3);line-height:1.5;color:var(--ink-2);margin:14px 0 0;max-width:64ch}
.pick-head .pick-cta{margin-top:10px;font-weight:800;color:var(--ink)}
.scn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
/* Picker backdrop sits a touch deeper than the ground so the white panel and the
   cards both lift off it. Theme-aware. */
.pick-screen{background:#e4eaf4}
@media(prefers-color-scheme:dark){.pick-screen{background:#04101f}}
:root[data-theme="dark"] .pick-screen{background:#04101f}
:root[data-theme="light"] .pick-screen{background:#e4eaf4}
.scn-card{position:relative;text-align:left;display:flex;flex-direction:column;gap:0;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:20px 22px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;font:inherit;color:inherit;width:100%}
.scn-card:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 var(--sheen),0 10px 28px rgba(7,42,107,.14);border-color:var(--teal)}
.scn-card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.scn-card .sc-top{display:flex;align-items:flex-start;gap:14px}
.scn-badge2{flex:none;width:50px;height:50px;border-radius:13px;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-weight:800;font-size:var(--t-h2);box-shadow:0 5px 12px rgba(7,42,107,.2)}
.scn-badge2 svg{width:26px;height:26px;stroke-width:1.9}
.scn-card[data-accent="navy"] .scn-badge2{background:linear-gradient(150deg,#0e3a86,var(--navy))}
.scn-card[data-accent="teal"] .scn-badge2{background:linear-gradient(150deg,var(--teal),#0a5f70)}
.scn-card[data-accent="violet"] .scn-badge2{background:linear-gradient(150deg,var(--violet),#6d2fa8)}
.scn-card[data-accent="magenta"] .scn-badge2{background:linear-gradient(150deg,#d94a8a,#b3396f)}
.scn-card .sc-h{flex:1;min-width:0}
.scn-card .sc-h h3{font-size:var(--t-h2);letter-spacing:-.01em;margin:2px 0 3px;color:var(--ink)}
.scn-card .sc-who{font-size:var(--t-sm);color:var(--ink-2);margin:0}
.scn-card .sc-who b{color:var(--ink);font-weight:700}
.status-pill{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:var(--t-cap);font-weight:800;letter-spacing:.03em;padding:5px 11px;border-radius:100px}
.status-pill svg{width:13px;height:13px}
.status-pill.ready{background:var(--kicker-bg);color:var(--teal-strong);border:1px solid var(--kicker-line)}
.status-pill.build{background:rgba(120,134,156,.14);color:var(--ink-3);border:1px solid var(--line)}
.status-pill.locked{background:rgba(120,134,156,.14);color:var(--ink-3);border:1px solid var(--line)}
.scn-card.locked{cursor:default}
.scn-card.locked .scn-badge2{filter:grayscale(.55);opacity:.72}
.scn-card.locked .sc-h h3,.scn-card.locked .sc-teach,.scn-card.locked .sc-who,.scn-card.locked .sc-levels{opacity:.9}
.scn-card.locked:hover{transform:none;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);border-color:var(--line)}
.scn-card .sc-go.sc-locked{color:var(--ink-3);font-weight:700}
.scn-card .sc-teach{font-size:var(--t-sm);color:var(--ink-2);margin:14px 0 0;line-height:1.45}
.scn-card .sc-levels{font-size:var(--t-cap);color:var(--ink-2);margin:10px 0 0;display:flex;align-items:center;gap:7px}
.scn-card .sc-levels svg{width:14px;height:14px}
.scn-card .sc-go{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);font-weight:800;color:var(--teal-strong)}
.scn-card .sc-go svg{width:16px;height:16px}

.brief-wrap{max-width:1000px;width:100%;margin:0 auto;text-align:left}
.brief-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:stretch}
.brief-copy{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:24px 30px;display:flex;flex-direction:column;justify-content:center}
.brief-copy .b-badge{display:inline-flex;align-items:center;gap:9px;margin-bottom:14px}
.brief-copy .b-badge .scn-badge2{width:42px;height:42px;font-size:var(--t-h3)}
.brief-copy .b-badge span{font-size:var(--t-cap);font-weight:800;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase}
.brief-copy h1{font-size:var(--t-h1);letter-spacing:-.02em;line-height:1.05;margin:0}
.brief-copy .b-who{font-size:var(--t-sm);color:var(--ink-2);margin:8px 0 0}
.brief-copy .b-who b{color:var(--ink);font-weight:700}
.brief-copy .b-brief{font-family:var(--serif);font-size:var(--t-h3);line-height:1.55;color:var(--ink-2);margin:16px 0 0}
.brief-media{align-self:center;width:100%}
.brief-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.bpanel{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:20px 22px}
.bpanel h4{font-size:var(--t-cap);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;font-weight:800}
.cc-item{display:flex;gap:12px;margin-bottom:12px}
.cc-item:last-child{margin-bottom:0}
.cc-item .cc-code{flex:none;font-family:var(--mono);font-size:var(--t-cap);font-weight:800;color:var(--z-emerg);background:var(--emerg-bg);border:1px solid var(--emerg-line);border-radius:6px;padding:3px 8px;height:fit-content}
.cc-item .cc-t{font-size:var(--t-sm)}
.cc-item .cc-t b{display:block;color:var(--ink);font-weight:700;margin-bottom:2px}
.cc-item .cc-t span{color:var(--ink-2)}
.sig-box{display:flex;gap:12px;align-items:flex-start}
.sig-box .sig-ic{flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(160deg,var(--violet),#6d2fa8);color:#fff;display:grid;place-items:center}
.sig-box .sig-ic svg{width:22px;height:22px}
.sig-box p{font-size:var(--t-sm);color:var(--ink-2);margin:0;line-height:1.5}
.brief-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 22px;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.brief-foot p{margin:0;font-size:var(--t-sm);color:var(--ink-3);display:inline-flex;align-items:center;gap:9px}
.brief-foot p svg{width:16px;height:16px;color:var(--ink-4)}
@media(max-width:820px){.scn-grid{grid-template-columns:1fr}.brief-hero{grid-template-columns:1fr}.brief-panels{grid-template-columns:1fr}}

/* ---------- Reconcile widget (S2 signature interaction) ---------- */
.recon{display:flex;flex-direction:column;gap:12px;margin:8px 0 2px}
.recon-row{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center}
.recon-field{display:flex;align-items:center;gap:10px;min-width:0}
.recon-field .rf-ic{flex:none;width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,var(--teal),#0a5f70);color:#fff;display:grid;place-items:center}
.recon-field .rf-ic svg{width:20px;height:20px}
.recon-field b{font-size:var(--t-sm)}
.recon-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.recon-chip{text-align:left;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:background .14s ease,border-color .14s ease,transform .12s ease;font:inherit}
.recon-chip:hover{border-color:var(--teal);transform:translateY(-1px)}
.recon-chip:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.recon-chip .rc-src{font-size:var(--t-cap);color:var(--ink-4);font-weight:750;text-transform:uppercase;letter-spacing:.05em}
.recon-chip .rc-val{font-size:var(--t-sm);color:var(--ink);font-weight:600}
.recon-chip.sel{background:var(--kicker-bg);border-color:var(--teal)}
.recon-chip.sel .rc-src{color:var(--teal-strong)}
@media(max-width:900px){.recon-row{grid-template-columns:1fr;gap:8px}.recon-field{margin-bottom:2px}}

/* ---------- Flow / spoon-tilt test (S3 signature interaction) ---------- */
.flowt{display:flex;flex-direction:column;gap:16px;margin:8px 0 2px}
.ft-step-h{font-size:var(--t-cap);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.ft-step-h .fsn{width:20px;height:20px;border-radius:50%;background:var(--kicker-bg);color:var(--teal-strong);display:grid;place-items:center;font-size:.7rem;font-weight:800}
.ft-tins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ft-tin{text-align:left;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:background .14s ease,border-color .14s ease,transform .12s ease;font:inherit}
.ft-tin:hover{border-color:var(--teal);transform:translateY(-1px)}
.ft-tin:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.ft-tin .ftt-name{font-size:var(--t-sm);font-weight:700;color:var(--ink)}
.ft-tin .ftt-sub{font-size:var(--t-cap);color:var(--ink-4)}
.ft-tin.sel{background:var(--kicker-bg);border-color:var(--teal)}
.ft-scoop{display:flex;align-items:center;gap:14px}
.ft-stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:var(--surface)}
.ft-stepper button{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font-size:1.2rem;font-weight:700;cursor:pointer;display:grid;place-items:center}
.ft-stepper button:hover{background:var(--kicker-bg);color:var(--teal-strong)}
.ft-stepper .ft-val{min-width:44px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.ft-scoop-lbl{font-size:var(--t-sm);color:var(--ink-2)}
.ft-scoop-lbl b{color:var(--ink)}
.ft-visual{display:flex;align-items:center;gap:20px;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.ft-spoon{flex:none;width:96px;height:96px;position:relative}
.ft-spoon svg{width:100%;height:100%;transform-origin:30% 40%;animation:spoonTilt 1.6s ease forwards}
@keyframes spoonTilt{0%{transform:rotate(0deg)}45%{transform:rotate(0deg)}100%{transform:rotate(58deg)}}
.ft-drip{flex:1;height:64px;position:relative;overflow:hidden;border-radius:8px;background:repeating-linear-gradient(90deg,transparent,transparent 22px,rgba(120,134,156,.08) 22px,rgba(120,134,156,.08) 23px)}
.ft-stream{position:absolute;top:0;left:14px;border-radius:0 0 6px 6px}
.ft-drip.thin .ft-stream{width:4px;height:100%;background:linear-gradient(var(--cyan),transparent);animation:streamFall .5s linear infinite}
.ft-drip.level2 .ft-stream{width:12px;height:78%;background:linear-gradient(var(--teal),rgba(22,175,194,.5));animation:streamFall 1.5s ease-in infinite}
.ft-drip.thick .ft-stream{width:22px;height:44%;background:linear-gradient(var(--violet),rgba(138,60,203,.4));border-radius:0 0 12px 12px;animation:streamFall 2.6s ease-in infinite}
@keyframes streamFall{0%{opacity:.2;transform:translateY(-10%)}50%{opacity:1}100%{opacity:.4;transform:translateY(4%)}}
.ft-caption{font-size:var(--t-sm);color:var(--ink-2);margin:0}
.ft-verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ft-vchip{text-align:center;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r);padding:11px 10px;cursor:pointer;font:inherit;font-size:var(--t-sm);font-weight:700;color:var(--ink);transition:background .14s ease,border-color .14s ease}
.ft-vchip:hover{border-color:var(--teal)}
.ft-vchip:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.ft-vchip.sel{background:var(--kicker-bg);border-color:var(--teal);color:var(--teal-strong)}
@media(prefers-reduced-motion:reduce){.ft-spoon svg{animation:none;transform:rotate(52deg)}.ft-drip .ft-stream{animation:none}}
@media(max-width:900px){.ft-tins{grid-template-columns:1fr}.ft-verdict{grid-template-columns:1fr}.ft-visual{flex-direction:column;align-items:stretch}.ft-spoon{width:72px;height:72px;align-self:center}}

/* ---------- On-call exchange (S4 signature interaction) ---------- */
.oncall{display:flex;flex-direction:column;gap:10px;margin:6px 0 10px}
.oc-line{display:flex;gap:11px;align-items:flex-start}
.oc-av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--kicker-bg);color:var(--teal-strong);display:grid;place-items:center}
.oc-av svg{width:18px;height:18px}
.oc-av.oc-on{background:linear-gradient(160deg,var(--teal),#0a5f70);color:#fff}
.oc-bubble{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:12px;border-top-left-radius:3px;padding:12px 15px;font-size:var(--t-sm);color:var(--ink);font-style:italic;box-shadow:inset 0 1px 0 var(--sheen)}

/* ---------- Scene shell ---------- */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 20px 18px;max-width:1240px;width:100%;margin:0 auto}

/* instrument cluster */
.superstrip{flex:none;display:flex;align-items:stretch;gap:10px;margin-bottom:13px}
.sv-clock{flex:none;background:linear-gradient(180deg,var(--hud-1),var(--hud-2));color:var(--ink);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:9px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:118px}
.sv-clock .cl{font-family:var(--mono);font-size:32px;font-weight:800;letter-spacing:1px}
.sv-clock .cw{font-size:var(--t-nano);letter-spacing:.09em;text-transform:uppercase;color:var(--hud-label);font-weight:700}
.sv-gauge{flex:1;min-width:0;background:linear-gradient(180deg,var(--hud-1),var(--hud-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:11px 15px;display:flex;align-items:center;gap:13px}
.sv-gauge .ring{position:relative;width:54px;height:54px;flex:none}
.sv-gauge .ring svg{width:54px;height:54px;display:block}
.sv-gauge .gv{transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1),stroke .3s}
.sv-gauge .g-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--sans);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.sv-gauge .g-cap{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.sv-gauge .g-cap b{font-size:var(--t-sm);font-weight:800}
.sv-gauge .g-cap span{font-size:var(--t-eyebrow);font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--hud-label);margin-top:2px}
.sv-stat{flex:1;display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,var(--hud-1),var(--hud-2));border:1px solid var(--line);border-radius:var(--r);padding:9px 15px;box-shadow:var(--shadow)}
.sv-stat .si{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;flex:none}
.sv-stat .si svg{width:24px;height:24px}
.sv-stat .sl{font-size:var(--t-eyebrow);font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--hud-label)}
.sv-stat .sv{font-size:var(--t-sm);font-weight:750;margin-top:1px}
.sv-ok .si{background:var(--good-tint);color:var(--good)} .sv-ok .sv{color:var(--good)}
.sv-warn .si{background:var(--warn-tint);color:var(--warn)} .sv-warn .sv{color:var(--warn)}
.sv-bad .si{background:var(--bad-tint);color:var(--bad)} .sv-bad .sv{color:var(--bad)}
/* glossy metric tiles: a sheen highlight lifts them off the background */
.sv-clock,.sv-gauge{background:linear-gradient(160deg,var(--hud-1),var(--hud-2));box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);border-color:var(--line)}

/* scene grid: moment + evidence */
.scene{flex:1;min-height:0;display:grid;grid-template-columns:1fr 322px;gap:16px}
.moment{min-height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.m-pad{flex:1;min-height:0;overflow:auto;padding:20px 30px 24px;display:flex;flex-direction:column}
.m-scene-ic{width:52px;height:52px;border-radius:12px;background:var(--teal-tint);color:var(--teal-strong);display:grid;place-items:center;margin-bottom:16px}
.m-scene-ic svg{width:29px;height:29px}
.moment .eyebrow{margin-bottom:2px}
/* bespoke scene illustration (photos can drop into the same slot later) */
.scene-illo{position:relative;flex:none;height:176px;background:radial-gradient(135% 160% at 22% -12%,var(--teal-tint),var(--surface-2));border-bottom:1px solid var(--line);display:grid;place-items:center;margin:0;overflow:hidden}
.scene-illo.warn{background:radial-gradient(135% 160% at 22% -12%,var(--warn-tint),var(--surface-2))}
.scene-illo svg{height:120px;width:auto;display:block}
.scene-illo.has-img{flex:none;height:330px;min-height:330px;background:none;display:block;margin:0}
.scene-illo.has-img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(to top,rgba(10,16,24,.34),rgba(10,16,24,0));pointer-events:none}
.scene-illo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;transform-origin:55% 42%;animation:kenburns 24s ease-in-out infinite alternate;will-change:transform}
@keyframes kenburns{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.18) translate(-2.2%,-1.6%)}}
.scene-illo img.no-kb{animation:none}
@media (prefers-reduced-motion:reduce){.scene-illo img{animation:none}}
/* buzzer light: red glow over the intercom button, flashed in sync with the sound */
.buzz-glow{position:absolute;width:78px;height:78px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:2;filter:blur(1px);mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,66,48,.95),rgba(255,48,36,.5) 38%,rgba(255,40,30,0) 70%)}
.il{fill:none;stroke:var(--teal-strong);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.il-soft{fill:none;stroke:var(--teal-strong);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:.32}
.il-fill{fill:var(--surface)}
.il-tint{fill:var(--teal-tint)}
.il-skin{fill:#f0d0b4}
.il-dot{fill:var(--teal-strong);stroke:none}
.il-warn{stroke:var(--warn)}
.il-warn-f{fill:var(--warn);stroke:var(--warn)}
.scene-text{font-family:var(--scene);font-size:var(--t-h3);line-height:1.55;color:var(--ink);margin-top:12px;max-width:none;letter-spacing:-.005em}
.m-q{font-size:var(--t-body);font-weight:750;color:var(--ink-2);margin-top:22px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{position:relative;text-align:left;display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:0 1px 2px rgba(24,42,66,.05),0 2px 8px rgba(24,42,66,.06);transition:transform .13s ease,box-shadow .13s ease,border-color .13s ease;cursor:pointer}
.opt:hover{transform:translateY(-1px);border-color:var(--go);box-shadow:var(--shadow)}
.opt:active{transform:translateY(0);box-shadow:0 1px 3px rgba(24,42,66,.10)}
.opt .ob{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--go);flex:none;display:grid;place-items:center;transition:background .13s,color .13s,border-color .13s}
.opt:hover .ob{background:var(--go);border-color:var(--go);color:#fff}
.opt .ob svg{width:17px;height:17px;opacity:1}
.opt .ot{font-size:var(--t-body);line-height:1.42;color:var(--ink);font-weight:550;flex:1}
.opt.sel{background:var(--z-do-tint);border-color:var(--go)}
.opt.sel .ob{background:var(--go);border-color:var(--go);color:#fff}

/* confidence */
.conf-wrap{margin:auto 0;max-width:46ch}
.conf-wrap .eyebrow{margin-bottom:10px}
.conf-wrap h3{font-size:var(--t-h2);letter-spacing:-.02em}
.conf-wrap p{color:var(--ink-3);font-size:var(--t-sm);margin-top:8px}
.conf-choice{display:flex;gap:9px;align-items:flex-start;margin-top:16px;padding:12px 15px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);font-size:var(--t-sm);color:var(--ink);font-family:var(--serif)}
.conf-choice svg{width:18px;height:18px;color:var(--teal-strong);flex:none;margin-top:3px}
.conf-opts{display:flex;gap:11px;margin-top:22px;flex-wrap:wrap}
.conf-pill{display:flex;flex-direction:column;gap:5px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;box-shadow:var(--shadow);min-width:150px;flex:1}
.conf-pill:hover{border-color:var(--teal);background:var(--teal-tint)}
.conf-pill .cp-ic{width:42px;height:42px;border-radius:9px;background:var(--teal-tint);color:var(--teal-strong);display:grid;place-items:center}
.conf-pill .cp-ic svg{width:24px;height:24px}
.conf-pill b{font-size:var(--t-body)}
.conf-pill span{font-size:var(--t-cap);color:var(--ink-4)}

/* micro consequence */
.micro{margin:auto 0;max-width:54ch}
.micro .m-tag{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-cap);font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 12px;border-radius:100px}
.micro .m-tag svg{width:15px;height:15px}
.m-good{background:var(--good-tint);color:var(--good)}
.m-warn{background:var(--warn-tint);color:var(--warn)}
.m-bad{background:var(--bad-tint);color:var(--bad)}
.micro .m-body{font-family:var(--serif);font-size:var(--t-h3);line-height:1.55;margin-top:16px;color:var(--ink)}
.micro .m-sup{margin-top:16px;font-size:var(--t-sm);color:var(--ink-3);display:flex;align-items:center;gap:9px}
.micro .m-sup svg{width:17px;height:17px;flex:none}
.micro-actions{margin-top:26px}

/* evidence rail */
.evi{min-height:0;display:flex;flex-direction:column}
.evi-head{flex:none;padding:2px 6px 12px}
.evi-head h3{font-size:var(--t-h3);display:flex;align-items:center;gap:8px;color:var(--ink)}
.evi-head h3 svg{width:20px;height:20px;color:var(--z-read)}
.evi-head p{font-size:var(--t-sm);color:var(--ink-2);margin-top:4px}
.evi-scroll{flex:1;min-height:0;overflow:auto;padding:0 4px 4px}
.evi-sec{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px 8px 8px;margin-bottom:12px;box-shadow:inset 0 1px 0 var(--sheen)}
.evi-sec:last-child{margin-bottom:0}
.sec-records{background:var(--zn-records);border-color:var(--zn-records-ln)}
.sec-tools{background:var(--zn-tools);border-color:var(--zn-tools-ln)}
.sec-tools .evi-grp{color:var(--violet)}
.sec-tools .doc-row .di{background:var(--violet)}
.evi-grp{font-size:var(--t-cap);font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--z-read-2);padding:6px 6px 8px}
.doc-row{width:100%;text-align:left;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 1px 0 var(--sheen),0 1px 3px rgba(20,38,74,.09);margin-bottom:8px;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.doc-row:last-child{margin-bottom:0}
.doc-row:hover{border-color:var(--teal);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.doc-row .di{width:40px;height:40px;border-radius:8px;background:var(--chip-bg);color:var(--chip-ink);display:grid;place-items:center;flex:none}
.doc-row .di svg{width:23px;height:23px}
.doc-row .dt{font-size:var(--t-sm);font-weight:650;line-height:1.25;flex:1}
.doc-row .dts{display:block;font-size:var(--t-cap);color:var(--ink-2);margin-top:2px;font-weight:400}
.doc-row .dv{flex:none;width:18px;height:18px;color:var(--good)}
.doc-row.opened .di{background:var(--good);color:#fff}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(10,22,36,.55);backdrop-filter:blur(2px);z-index:80;display:grid;place-items:center;padding:24px;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:560px;width:100%;max-height:86vh;overflow:auto;animation:pop .42s cubic-bezier(.2,.72,.28,1.04)}
@keyframes pop{from{transform:translateY(22px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal,.backdrop{animation:none}}
.doc-modal .dm-top{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 16px;border-bottom:1px solid var(--line-2)}
.doc-modal .dm-emblem{width:46px;height:46px;border-radius:10px;background:var(--z-read-tint);color:var(--z-read);display:grid;place-items:center;flex:none}
.doc-modal .dm-emblem svg{width:25px;height:25px}
.doc-modal .dm-kick{font-size:var(--t-eyebrow);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4)}
.doc-modal h3{font-size:var(--t-h3);margin-top:3px}
.doc-modal .dm-x{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--ink-3)}
.doc-modal .dm-x:hover{background:var(--surface-3)}
.doc-modal .dm-x svg{width:17px;height:17px}
.doc-body{padding:20px 24px 8px}
.doc-body .dl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px}
.doc-body .dl li{display:flex;gap:11px;font-size:var(--t-body);line-height:1.45;color:var(--ink)}
.doc-body .dl li svg{width:17px;height:17px;color:var(--z-read);flex:none;margin-top:2px}
.doc-note{font-family:var(--serif);font-size:var(--t-body);line-height:1.55;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:4px}
.dm-prov{padding:14px 24px 22px;display:flex;align-items:center;gap:9px;font-size:var(--t-cap);color:var(--ink-4)}
.dm-prov svg{width:15px;height:15px}
.dm-flag{margin:8px 24px 22px;width:calc(100% - 48px);display:flex;align-items:center;gap:10px;justify-content:center;background:var(--warn-tint);border:1px solid var(--warn-line);color:var(--warn);border-radius:var(--r);padding:12px;font-weight:750;font-size:var(--t-sm)}
.dm-flag:hover{filter:brightness(.97)}
.dm-flag svg{width:17px;height:17px}
.dm-flagged{background:var(--good-tint);border-color:var(--good-line);color:var(--good)}

/* outcome */
.outcome{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:34px 22px}
.oc-card{max-width:680px;width:100%}
.oc-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:100px;font-weight:800;font-size:var(--t-sm);letter-spacing:.04em;text-transform:uppercase}
.oc-badge svg{width:18px;height:18px}
.oc-good{background:var(--good-tint);color:var(--good)}
.oc-warn{background:var(--warn-tint);color:var(--warn)}
.oc-bad{background:var(--bad-tint);color:var(--bad)}
.oc-card h1{font-size:var(--t-h1);letter-spacing:-.025em;margin-top:20px;line-height:1.08}
.oc-card .oc-body{font-family:var(--serif);font-size:var(--t-h3);line-height:1.6;color:var(--ink-2);margin-top:16px}
.oc-steps{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:6px 4px}

.cc-hold{background:var(--good-tint);border-color:var(--good-line)} .cc-hold .cci{background:#fff;color:var(--good)}
.cc-trip{background:var(--bad-tint);border-color:var(--bad-line)} .cc-trip .cci{background:#fff;color:var(--bad)}
.cc-item h5{font-size:var(--t-sm)}
.cc-item p{font-size:var(--t-cap);color:var(--ink-3);margin-top:2px;line-height:1.4}
.reveal-box{margin-top:14px;background:var(--warn-tint);border:1px solid var(--warn-line);border-radius:var(--r);padding:14px 16px}
.reveal-box.ok{background:var(--good-tint);border-color:var(--good-line)}
.reveal-box h5{font-size:var(--t-sm);display:flex;align-items:center;gap:8px}

.btn-navy:hover{background:rgba(255,255,255,.2)}
.btn-navy svg{width:16px;height:16px}

/* Motion polish: soft, brief entrances with an ease-out that settles like a
   spring. Disabled entirely for anyone who prefers reduced motion. */
@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes settle{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
  .land-card,.oc-card,.db-wrap,.moment{animation:settle .42s cubic-bezier(.22,.61,.36,1) both}
  .opt{animation:rise .34s cubic-bezier(.22,.61,.36,1) both}
  .opt:nth-child(1){animation-delay:.04s}
  .opt:nth-child(2){animation-delay:.09s}
  .opt:nth-child(3){animation-delay:.14s}
  .oc-steps .os{animation:rise .32s ease both}
  .oc-steps .os:nth-child(2){animation-delay:.05s}
  .oc-steps .os:nth-child(3){animation-delay:.10s}
  .oc-steps .os:nth-child(4){animation-delay:.15s}
  .oc-steps .os:nth-child(5){animation-delay:.20s}
  .oc-steps .os:nth-child(6){animation-delay:.25s}
  .conf-pill{animation:rise .3s cubic-bezier(.22,.61,.36,1) both}
  .conf-pill:nth-child(2){animation-delay:.06s} .conf-pill:nth-child(3){animation-delay:.12s}
  .oc-badge,.r-chip{animation:settle .5s cubic-bezier(.22,.61,.36,1) both}
  .land-media{animation:settle .55s cubic-bezier(.22,.61,.36,1) both;animation-delay:.06s}
  .land-facts .lf{animation:rise .44s cubic-bezier(.22,.61,.36,1) both}
  .land-facts .lf:nth-child(2){animation-delay:.09s}
  .land-facts .lf:nth-child(3){animation-delay:.18s}
  .evi-sec{animation:rise .42s cubic-bezier(.22,.61,.36,1) both}
  .evi-sec.sec-tools{animation-delay:.09s}
}

/* SME-owned learning caveat (landing + emergency outcomes) */
.caveat{display:flex;gap:10px;align-items:flex-start;margin-top:22px;padding:13px 15px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);font-size:var(--t-cap);color:var(--ink-3);line-height:1.5}
.caveat svg{width:17px;height:17px;color:var(--ink-4);flex:none;margin-top:1px}
/* fatal-path aftermath lines */
.aftermath{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.aftermath .af-line{display:flex;gap:11px;align-items:flex-start;font-size:var(--t-sm);color:var(--ink-2);line-height:1.5}
.aftermath .af-line svg{width:18px;height:18px;color:var(--teal-strong);flex:none;margin-top:2px}
/* talking-head video placeholder (shows the real footprint before clips exist) */
.vslot{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-lg);border:2px dashed var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface-3));display:grid;place-items:center;overflow:hidden}
.vslot.band{border:0;border-bottom:1px solid var(--line);border-radius:0}
.vslot-in{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;padding:14px}
.vslot-play{width:58px;height:58px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--teal-strong);box-shadow:var(--shadow)}
.vslot-play svg{width:30px;height:30px}
.vslot-label{font-size:var(--t-body);font-weight:700;color:var(--ink-2)}
.vslot-dim{font-size:var(--t-cap);color:var(--ink-4);font-family:var(--mono);letter-spacing:.02em}
.vhero{max-width:520px;margin-bottom:18px}
/* real video band (fills a 16:9 slot, corners clipped by the parent card) */
.vband{position:relative;width:100%;aspect-ratio:16/9;background:#0b1016;border-bottom:1px solid var(--line);overflow:hidden}
.vband.flush{border:0;border-bottom:1px solid var(--line);border-radius:0}
.vplayer{width:100%;height:100%;display:block;object-fit:cover;background:#0b1016}
/* gated intro video in the disclaimer lightbox */
.disc-vband,.disc-video{background:#0b1016}
.disc-playoverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(11,16,22,.5);color:#fff;border:0;font-size:var(--t-body);font-weight:700;cursor:pointer}
.disc-playoverlay[hidden]{display:none}
.disc-playoverlay span{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.disc-playoverlay svg{width:30px;height:30px}
.disc-playoverlay:hover span{background:rgba(255,255,255,.26)}
.disc-vctrl{position:absolute;left:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:rgba(11,16,22,.55);color:#fff;border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;cursor:pointer;z-index:3}
.disc-vctrl svg{width:20px;height:20px}
.disc-vctrl:hover{background:rgba(11,16,22,.78)}
.disc-progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18)}
.disc-progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s linear}
.disc-wait{padding:14px 26px 20px;text-align:center;font-size:var(--t-sm);color:var(--ink-4)}
.disc-gate{display:none}
.disc-gate.show{display:block}

/* disclaimer lightbox */
.disc-modal{max-width:540px}
.disc-top{display:flex;align-items:center;gap:13px;padding:24px 26px 4px}
.disc-emblem{width:44px;height:44px;border-radius:11px;background:var(--z-read-tint);color:var(--z-read);display:grid;place-items:center;flex:none}
.disc-emblem svg{width:24px;height:24px}
.disc-modal h3{font-size:var(--t-h2)}
.disc-body{padding:10px 26px 4px}
.disc-body p{font-size:var(--t-h3);line-height:1.6;color:var(--ink)}
.disc-actions{padding:18px 26px 24px}

/* targeted toolkit rows (debrief) */
.tk-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.tk-row{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tk-row .tki{width:34px;height:34px;border-radius:8px;background:var(--z-read-tint);color:var(--z-read);display:grid;place-items:center;flex:none}
.tk-row .tki svg{width:19px;height:19px}
.tk-row h5{font-size:var(--t-sm)}
.tk-row .tkref{font-weight:400;color:var(--ink-4)}
.tk-row p{font-size:var(--t-cap);color:var(--ink-3);margin-top:2px;line-height:1.4}

/* mobile scene/records tabs (hidden on desktop) */
.mob-tabs{display:none}
.mob-tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 10px;font-weight:700;font-size:var(--t-sm);color:var(--ink-2);box-shadow:var(--shadow)}
.mob-tab svg{width:17px;height:17px}
.mob-tab.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.mob-tab .mt-n{font-weight:800;font-size:var(--t-cap);opacity:.85}
@media(max-width:900px){
  .scene{grid-template-columns:1fr;overflow:auto}
  .db-grid{grid-template-columns:1fr}
  .land-facts{grid-template-columns:1fr}
  .land-hero{grid-template-columns:1fr;gap:14px}
  .land-cta{flex-direction:column;align-items:stretch;text-align:center}
  .land-cta .btn-go{justify-content:center}
  .land-media img{height:auto;min-height:0;aspect-ratio:4/3}
  #app{height:auto;min-height:100%}
  .stage,.landing,.outcome,.debrief{overflow:visible}
  /* instrument strip: clock full-width, gauges 2x2 so the arcs never overflow */
  .superstrip{flex-wrap:wrap;gap:8px}
  .sv-clock{flex:1 1 100%;flex-direction:row;justify-content:center;gap:12px;min-width:0;padding:8px 14px}
  .sv-gauge{flex:1 1 calc(50% - 4px);min-width:0}
  /* tabbed scene vs records so there is no scrolling past one to reach the other */
  .mob-tabs{display:flex;gap:8px;margin-bottom:12px}
  .scene[data-tab="scene"] .evi{display:none}
  .scene[data-tab="records"] .moment{display:none}
  .scene-illo.has-img{height:210px;min-height:210px}
  /* header: keep the brand on one line so nothing clips; drop the subtitle */
  .topbar{gap:8px;padding:0 12px}
  .brand{min-width:0;gap:9px}
  .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .brand small{display:none}
  .brand .brand-mark{width:32px;height:32px}
  /* video captions: bump size so they are legible on a phone */
  .vplayer::cue{font-size:2em}
}

/* ---------- Audio (synthesised; no external files) ---------- */
const AUDIO = (function(){
  var ctx=null, master=null, amb=null;
  function ensure(){
    if(ctx) return ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
    }catch(e){ ctx=null; }
    return ctx;
  }
  function unlock(){ if(!ensure()) return; if(ctx.state==='suspended'){ ctx.resume(); } if(!S.muted){ ambienceStart(); } }
  function tone(type,freq,t0,dur,peak){
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0+dur+0.02);
  }
  function buzzer(){ if(S.muted||!ensure()) return; if(ctx.state==='suspended') ctx.resume();
    var t=ctx.currentTime, dur=1.15;
    // deep, smooth low buzz: warm tone with a gentle pulse (no harsh chop)
    var o1=ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=110;
    var o2=ctx.createOscillator(); o2.type='sine';     o2.frequency.value=110; // sub body
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=680; lp.Q.value=0.5;
    // faster sine tremolo for an electric flutter, still smooth (no chop)
    var trem=ctx.createGain(); trem.gain.value=0.85;
    var lfo=ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=26;
    var lfoAmt=ctx.createGain(); lfoAmt.gain.value=0.22;
    lfo.connect(lfoAmt).connect(trem.gain);
    // amplitude envelope: soft attack (no click), sustain, gentle release
    var amp=ctx.createGain();
    amp.gain.setValueAtTime(0.0001,t);
    amp.gain.exponentialRampToValueAtTime(0.17,t+0.06);
    amp.gain.setValueAtTime(0.17,t+dur-0.22);
    amp.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    var o2g=ctx.createGain(); o2g.gain.value=0.4;
    o1.connect(lp); o2.connect(o2g).connect(lp);
    lp.connect(trem).connect(amp).connect(master);
    o1.start(t); o2.start(t); lfo.start(t);
    o1.stop(t+dur+0.02); o2.stop(t+dur+0.02); lfo.stop(t+dur+0.02);
  }
  function phone(){ if(S.muted||!ensure()) return; if(ctx.state==='suspended') ctx.resume();
    var t=ctx.currentTime;
    for(var r=0;r<2;r++){ for(var b=0;b<2;b++){ var st=t+r*0.9+b*0.2; tone('sine',420,st,0.16,0.06); tone('sine',480,st+0.08,0.1,0.05); } }
  }
  function ambienceStart(){
    if(S.muted||!ensure()||amb) return; if(ctx.state==='suspended') ctx.resume();
    var buf=ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*0.5; }
    var src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
    var g=ctx.createGain(); g.gain.value=0.012;
    var hum=ctx.createOscillator(), hg=ctx.createGain(); hum.type='sine'; hum.frequency.value=70; hg.gain.value=0.006;
    src.connect(lp).connect(g).connect(master); hum.connect(hg).connect(master);
    src.start(); hum.start();
    amb={src:src,hum:hum};
  }
  function ambienceStop(){ if(!amb) return; try{ amb.src.stop(); amb.hum.stop(); }catch(e){} amb=null; }
  function setMuted(m){ if(m){ ambienceStop(); } else { unlock(); } }
  /* ---- UI sound design: soft, short, low-level cues in the Apple mould.
     Sine bodies, gentle exponential attack/release, quiet peaks (~0.03–0.05
     against a 0.9 master). A light lowpass keeps them warm, never clicky. */
  function note(freq,t0,dur,peak,type){
    var o=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=2600;
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(lp).connect(master); o.start(t0); o.stop(t0+dur+0.02);
  }
  function glide(f0,f1,t0,dur,peak,type){
    var o=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=2600;
    o.type=type||'sine'; o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(peak,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(lp).connect(master); o.start(t0); o.stop(t0+dur+0.02);
  }
  function sfx(name){
    if(S.muted||!ensure()) return;
    if(ctx.state==='suspended'){ var p=ctx.resume(); if(p&&p.then){ p.then(function(){ playSfx(name); }); } else { playSfx(name); } return; }
    playSfx(name);
  }
  function playSfx(name){
    var t=ctx.currentTime;
    switch(name){
      case 'tap':     note(523,t,0.05,0.035); break;                                   // soft key press
      case 'select':  note(587,t,0.05,0.045); note(880,t+0.028,0.05,0.028); break;     // pick an option
      case 'forward': note(523,t,0.09,0.045); note(784,t+0.055,0.13,0.05); break;      // advance / continue
      case 'back':    glide(500,360,t,0.10,0.035); break;                              // restart / back
      case 'open':    glide(320,660,t,0.12,0.045); break;                              // open a document
      case 'close':   glide(600,320,t,0.11,0.04); break;                               // close a document
      case 'confirm': note(659,t,0.11,0.075); note(988,t+0.08,0.20,0.06); break;        // flag / commit
      case 'toggle':  note(720,t,0.04,0.03); break;                                    // theme / sound
      case 'good':    note(523,t,0.13,0.045); note(659,t+0.085,0.13,0.045); note(988,t+0.17,0.30,0.04); break;   // prevention
      case 'warn':    note(392,t,0.16,0.045,'triangle'); note(294,t+0.11,0.22,0.038); break;                     // near miss / emergency
      case 'somber':  note(147,t,0.55,0.05); note(110,t+0.20,0.8,0.045); break;        // fatal — low, slow, respectful
    }
  }
  function prime(){ if(!ensure()) return; if(ctx.state==='suspended'){ ctx.resume(); } }
  return {unlock:unlock, buzzer:buzzer, phone:phone, ambienceStart:ambienceStart, ambienceStop:ambienceStop, setMuted:setMuted, sfx:sfx, prime:prime};
})();
/* Buzzer: sound + a red flash on the intercom light, getting more
   insistent (shorter gaps) like an impatient delivery driver. */
var buzzTimers=[];
function flashGlow(){
  var g=document.querySelector('.buzz-glow');
  if(!g || !g.animate) return;
  // sustained red glow that flickers for the length of the buzz (~1.15s)
  g.animate(
    [{opacity:0},{opacity:1,offset:.04},{opacity:.72,offset:.22},{opacity:1,offset:.4},
     {opacity:.74,offset:.6},{opacity:.95,offset:.78},{opacity:0,offset:1}],
    {duration:1150, easing:'ease-out'}
  );
}
function buzzOnce(){ AUDIO.buzzer(); flashGlow(); }
function startBuzzSequence(){
  stopBuzzSequence();
  buzzOnce();
  var gaps=[3600,3200,2800,2500,2300,2200,2100,2100], t=0;
  for(var i=0;i<gaps.length;i++){ t+=gaps[i]; buzzTimers.push(setTimeout(buzzOnce, t)); }
}
function stopBuzzSequence(){ for(var i=0;i<buzzTimers.length;i++){ clearTimeout(buzzTimers[i]); } buzzTimers=[]; }
function playNodeCue(id){
  if(S.scenario==='S1'){ if(id==='N2'){ startBuzzSequence(); } else if(id==='N3'){ AUDIO.phone(); } return; }
  var n=NODES[id]; if(!n) return;
  if(n.cue==='phone'){ AUDIO.phone(); } else if(n.cue==='buzz'){ startBuzzSequence(); }
}

/* ---------- Shift countdown (15:00) ----------
   The teatime shift is a 15-minute window; the HUD clock runs it down live.
   Started when the handover screen first loads (deterministic; the video's
   autoplay can be blocked, so we don't tie the count to playback). It keeps
   running across the nodes and clamps at 00:00. Held in a non-persisted var
   so a page reload restarts the shift rather than resuming a stale count. */
var SHIFT_SECONDS = 15*60;
var shiftStartMs = 0, shiftTimer = null;
function shiftRemaining(){
  if(!shiftStartMs) return SHIFT_SECONDS;
  return Math.max(0, SHIFT_SECONDS - Math.floor((Date.now()-shiftStartMs)/1000));
}
function fmtCountdown(s){ var m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
function tickShiftClock(){
  var el=document.querySelector('.sv-clock .cl');
  var rem=shiftRemaining();
  if(el) el.textContent=fmtCountdown(rem);
  if(rem<=0 && shiftTimer){ clearInterval(shiftTimer); shiftTimer=null; }
}
function startShiftClock(){
  if(shiftStartMs) return;                 // already counting
  shiftStartMs=Date.now();
  tickShiftClock();
  shiftTimer=setInterval(tickShiftClock,1000);
}
function resetShiftClock(){
  if(shiftTimer){ clearInterval(shiftTimer); shiftTimer=null; }
  shiftStartMs=0;
}

var introT=0;

  function showCaps(){ try{ if(v.textTracks && v.textTracks.length){ v.textTracks[0].mode='showing'; } }catch(e){} }

var handoverT=0, handoverEnded=false;
function setupHandoverVideo(){
  var v=document.querySelector('.handover-video'); if(!v) return;
  function showCaps(){ try{ if(v.textTracks && v.textTracks.length){ v.textTracks[0].mode='showing'; } }catch(e){} }

  v.addEventListener('loadedmetadata', function(){ if(handoverT>0 && handoverT < v.duration-0.3){ try{ v.currentTime=handoverT; }catch(e){} } });

function ftTin(){ var cfg=SC.build.flowtest; return (cfg.tins||[]).find(function(t){return t.id===(S.flow||{}).tin;}); }

/* On-call exchange (deep signature interaction, S4). Manager first (voicemail),

function oncallOpts(q){ return (q.opts||[]).filter(function(op){ return !op.needDoc || S.opened[op.needDoc]; }); }
function oncallBody(node){
  var cfg=(SC.build&&SC.build.oncall)||{questions:[]}, o=S.oncall||{phase:'start',qi:0,answers:[]};
  var head='<span class="eyebrow">'+node.time+' &middot; '+node.label+'</span>';

/* Live mealtime-risk score, 0..100, derived from the running mechanics.

function riskScore(){
  // Derived from applied state only, so the gauge does not move until a
  // choice is committed (after the confidence rating on confidence nodes).
  let r=14;                         // baseline: new meds, "drowsy lately"
  if(S.foodAccessible) r+=8;        // others' food within reach
  if(S.plateUnverified) r+=16;      // served the plate without checking
  if(!S.supervisionOk) r+=26;       // supervision currently broken
  r += (S.splits||0)*8;             // attention divided
  if(S.primed) r+=24;               // unsafe mouthful possible
  if(S.cc1) r+=6; if(S.cc2) r+=6;
  return clamp(r);
}
function riskZone(r){
  return r<34 ? {c:'var(--good)',l:'Low'}
       : r<67 ? {c:'var(--warn)',l:'Elevated'}
              : {c:'var(--bad)',l:'High'};
}
/* Assurance direction: higher = safer (green). Risk is the inverse. */
function assurZone(v){ return v>=70 ? 'var(--good)' : v>=40 ? 'var(--warn)' : 'var(--bad)'; }
function meter(value,color,word,label){
  const len=113.1; const off=(len*(1-value/100)).toFixed(2);
  return '<div class="sv-gauge">'
    +'<div class="ring">'
    +'<svg viewBox="0 0 44 44" aria-hidden="true">'
    +'<circle cx="22" cy="22" r="18" fill="none" stroke="var(--gauge-track)" stroke-width="5"/>'
    +'<circle class="gv" cx="22" cy="22" r="18" fill="none" stroke="'+color+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+len+'" stroke-dashoffset="'+off+'" transform="rotate(-90 22 22)"/>'
    +'</svg>'
    +'<b class="g-num" style="color:'+color+'">'+value+'</b>'
    +'</div>'
    +'<div class="g-cap"><b style="color:'+color+'">'+word+'</b><span>'+label+'</span></div>'
    +'</div>';
}
function superstrip(){
  if(S.scenario!=='S1'){ return superstripGeneric(); }
  const c=S.choices;
  const rk=riskScore(), rz=riskZone(rk);
  const split=['N2','N3','N4'].some(function(n){return c[n]==='b';});
  const sup = !S.supervisionOk ? {v:12,w:'Broken'} : split ? {v:60,w:'Divided'} : {v:100,w:'Eyes on'};
  const food = S.foodAccessible ? {v:45,w:'In reach'} : {v:100,w:'Secured'};
  const dan = S.primed ? {v:50,w:'Unsettled'} : {v:100,w:'Settled'};
  return '<div class="superstrip">'
    +'<div class="sv-clock"><div class="cl">'+fmtCountdown(shiftRemaining())+'</div><div class="cw">Time left</div></div>'
    + meter(rk, rz.c, rz.l, 'Mealtime risk')
    + meter(sup.v, assurZone(sup.v), sup.w, 'Supervision')
    + meter(food.v, assurZone(food.v), food.w, 'Access to food')
    + meter(dan.v, assurZone(dan.v), dan.w, 'Daniel')
    +'</div>';
}

/* ---------- Evidence rail ---------- */

  const openedCount = DOC_ORDER.filter(function(id){return S.opened[id];}).length;
  const fileLabel = SC.person+'’s file';
  const rows = function(isRef){
    return DOC_ORDER.filter(function(id){return (DOCS[id].group==='ref')===isRef;}).map(function(id){
      const d=DOCS[id]; const op=S.opened[id];
      return '<button class="doc-row'+(op?' opened':'')+'" data-act="open-doc" data-id="'+id+'">'
        +'<span class="di">'+svg(I[d.icon])+'</span>'
        +'<span class="dt">'+d.title+(d.ref?'<span class="dts">Toolkit '+d.ref+'</span>':'<span class="dts">'+fileLabel+'</span>')+'</span>'
        +(op?'<span class="dv">'+svg(I.checkSmall)+'</span>':'')
        +'</button>';
    }).join('');
  };
  const recLabel = (SC.build&&SC.build.recordsLabel)||(SC.person+'’s records');
  return '<div class="evi">'
    +'<div class="evi-head"><h3>'+svg(I.eye)+'Records &amp; tools</h3>'
    +'<p>Opened '+openedCount+' of '+DOC_ORDER.length+'. Open a document to read it and judge it yourself.</p></div>'
    +'<div class="evi-scroll">'
    +'<div class="evi-sec sec-records"><div class="evi-grp">'+recLabel+'</div>'+rows(false)+'</div>'
    +'<div class="evi-sec sec-tools"><div class="evi-grp">Reference tools</div>'+rows(true)+'</div>'
    +'</div></div>';
}
