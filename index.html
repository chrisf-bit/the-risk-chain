DATA[2].actions.find(a=>a.id==='signplan').selNote='The audit gap closes: the plan is signed and competency confirmed, so what is written is now actually delivered.';
DATA[2].actions.find(a=>a.id==='signplan').missNote='The unsigned plan and lapsed competency were left open, so delivery stayed a matter of chance.';

/* How many records the team can review each round. Fewer than are available,
   so you cannot read everything and must choose which records matter. Reviewing
   does NOT consume management time, that is spent only on actions, so
   investigating never locks you out of acting. */
const REVIEW_CAP = { 1:3, 2:4, 3:3 };
function reviewCap(round){return REVIEW_CAP[round]||3;}
function reviewedCount(round){const o=S.opened[round]||{};return Object.keys(o).filter(k=>o[k]).length;}
function canReviewMore(round){return reviewedCount(round)<reviewCap(round);}

/* Which record(s) inform each decision. Taking a decision without having
   reviewed any of its informing records means acting on assumption:
   the effect is weaker and a risk goes unseen. */
const INFORMED_BY = {
  1:{ salt:['salt'], hospital:['discharge'], texture:['salt'], supervise:['prevplan','salt'],
      competency:['staff'], experienced:['staff'], interimplan:['salt','prevplan','discharge'],
      speakfamily:['family'], delay:['salt','discharge'] },
  2:{ pattern:['shiftnote','quickmsg','daily'], salt2:['medupdate'], medreview:['medupdate'],
      updateplan:['audit'], signplan:['audit'], contactfamily2:['sistermsg'], teambrief2:['staffleave'],
      supervise2:['shiftnote'] },
  3:{ safealt:['kitchen','foodfromhome'], deploycompetent:['board'], calm:['michaelstate'],
      supportsister:['foodfromhome','michaelstate'], guideagency:['board'], prioritise_other:['otherres','board'],
      delaymeal:['kitchen'] },
};

   ENGINE
   ============================================================ */
const el = id => document.getElementById(id);
const app = () => el('app');
function clamp(v){return Math.max(0,Math.min(100,Math.round(v)));}

function attentionUsed(round){
  // Time is spent on BOTH reviewing records and taking actions.
  const d=DATA[round];
  let used=0;
  const opened=S.opened[round]||{};
  d.docs.forEach(doc=>{if(opened[doc.id])used+=doc.cost;});
  const sel=S.selected[round]||{};
  d.actions.forEach(a=>{if(sel[a.id])used+=a.cost;});
  return used;
}
function attentionRemaining(round){return ROUND_TIME-attentionUsed(round);}

/* Apply a round's selected actions to KPIs & flags, build chain events */
function commitRound(round){
  const d=DATA[round];
  const before={...S.kpi};
  const sel=S.selected[round]||{};
  const chosen=d.actions.filter(a=>sel[a.id]);
  // Effects are scaled so indicators don't saturate and the middle band stays real.
  // A round of "risk pressure" also applies: a developing situation quietly erodes
  // prevention and raises exposure unless the team actively counters it.
  const KSCALE=0.58, PSCALE=0.5;
  // Confidence subtly amplifies BOTH gains and losses this round.
  const conf=S.confidence&&S.confidence[round]||'measured';
  const CONF_MULT={cautious:0.85,measured:1,confident:1.2}[conf]||1;
  const opened=S.opened[round]||{};
  const blind=[];   // actions taken without reviewing any informing record
  chosen.forEach(a=>{
    const inf=(INFORMED_BY[round]||{})[a.id];
    const isBlind = inf && inf.length && !inf.some(id=>opened[id]);
    if(isBlind){blind.push({id:a.id,title:a.title,docs:inf});S.flags['blind_'+a.id]=true;}
    // Acting on assumption: weaker benefit, and negative effects are NOT softened.
    for(const k in a.eff){
      let v=a.eff[k]*KSCALE*CONF_MULT;
      if(isBlind && v>0 && k!=='exposure') v*=0.55;   // upside dampened when blind
      if(isBlind && k==='exposure') v+=2.5;            // acting blind raises exposure
      S.kpi[k]=clamp(S.kpi[k]+v);
    }
    let pv=(a.prev||0)*PSCALE*CONF_MULT;
    if(isBlind && pv>0) pv*=0.5;
    S.prevention=clamp(S.prevention+pv);
    (a.sets||[]).forEach(f=>S.flags[f]=true);
  });
  // Background risk pressure for this round
  S.prevention=clamp(S.prevention-5);
  S.kpi.exposure=clamp(S.kpi.exposure+3);
  // cross-round contextual adjustments
  applyContext(round,chosen);
  const delta={};KPIS.forEach(k=>delta[k.key]=S.kpi[k.key]-before[k.key]);
  // stats
  const idCats=['Risk identification','Escalation','Control'];
  chosen.forEach(a=>{if(['pattern','salt','salt2','saltContacted','interimplan','medreview','texture','supervise'].includes(a.id)||idCats.includes(a.cat))S.stats.identified++;});
  S.committed[round]={chosen:chosen.map(a=>a.id),delta,before,blind,conf};
  buildChainForRound(round,chosen);
  save();
  return {chosen,delta,before};
}

function applyContext(round,chosen){
  const f=S.flags;
  if(round===2){
    // If interim controls established, pattern easier to see -> small safety bonus if pattern identified
    if(f.interimControls && f.patternIdentified){S.kpi.safety=clamp(S.kpi.safety+3);S.prevention=clamp(S.prevention+2);}
    // If staff not briefed in R1, observations inconsistent -> reliability penalty
    if(!f.staffBriefed && !f.teamBriefed2){S.kpi.reliability=clamp(S.kpi.reliability-4);}
    // High staff confidence -> earlier escalation bonus
    if(S.kpi.staff>=72 && (f.salt2||f.medreview)){S.kpi.exposure=clamp(S.kpi.exposure-3);}
  }
  if(round===3){
    // riskyFood is much worse if no relationship/interim controls
    if(f.riskyFood && !f.interimControls){S.kpi.safety=clamp(S.kpi.safety-4);}
    // agency guided but never briefed -> reduced benefit
    if(f.agencyGuided && !f.staffBriefed && !f.teamBriefed2){S.kpi.safety=clamp(S.kpi.safety-3);S.kpi.reliability=clamp(S.kpi.reliability-2);}
    // competent support without prior competency arrangement -> reduced
    if(f.competentSupport && !(f.competencyChecked||f.experiencedWorker)){S.kpi.safety=clamp(S.kpi.safety-4);}
  }
}

/* ---------- Risk chain construction ---------- */
function buildChainForRound(round,chosen){
  const f=S.flags;
  const push=(o)=>S.chain.push(o);
  if(round===1){
    push({round:1,time:'Day 0',type:'introduced',title:'Incomplete, conflicting records arrive',
      detail:'Hospital "soft diet", a six-month-old SALT texture recommendation, an out-of-date supervision note and a family message that all point in different directions.'});
    if(f.saltContacted||f.hospitalContacted) push({round:1,time:'Day 0',type:'identified',title:'Team sought to clarify the contradictions',detail:'Rather than accept the vaguest instruction, the team went back to the source to reconcile the diet and medication information.'});
    if(f.interimControls) push({round:1,time:'Day 0',type:'controlled',title:'Interim mealtime controls put in place',detail:'Supervision and/or the documented texture were applied while awaiting reassessment, so the first meal was covered.'});
    else push({round:1,time:'Day 0',type:'missed',title:'First meal left without agreed safeguards',detail:'Two records pointed to mealtime risk, but no interim control was in place for Michael’s first, highest-uncertainty meal.'});
    if(!f.staffBriefed) push({round:1,time:'Day 0',type:'missed',title:'No staff briefing at admission',detail:'Whatever was decided existed on paper only; the agency worker started blind.'});
    if(f.familyEngaged) push({round:1,time:'Day 0',type:'controlled',title:'Relationship built with Angela early',detail:'Michael’s wishes were recorded and his sister felt heard, making later conversations about risk far easier.'});
  }
  if(round===2){
    push({round:2,time:'Day 5',type:'introduced',title:'Warning signs appear across the service',detail:'Coughing on fluids, quicker eating, reduced intake and tiredness surface separately, driven partly by the new medication’s dry-mouth and drowsiness effects.'});
    if(f.patternIdentified) push({round:2,time:'Day 5',type:'identified',title:'Team connected the signs into a pattern',detail:'The separate observations were read together as a developing swallowing risk while there was still time to act calmly.'});
    else push({round:2,time:'Day 5',type:'missed',title:'Warning signs read in isolation',detail:'Each note looked minor alone, so the developing pattern was not recognised in time.'});
    if(f.salt2||f.medReviewed) push({round:2,time:'Day 5',type:'controlled',title:'Clinical reassessment triggered',detail:'The "significant change" prompted escalation to SALT and/or a medication review, addressing the underlying driver.'});
    if(f.planUpdated2||f.planSigned) push({round:2,time:'Day 5',type:'controlled',title:'Support plan updated and delivered',detail:'The plan was brought up to date and, where signed off, actually followed on the floor.'});
  }
}

function buildChainForOutcome(){
  const f=S.flags;const o=S.outcome;
  const t=o.tier;
  let type = t==='controlled'?'controlled':t==='mixed'?'identified':t==='nearmiss'?'missed':'consequence';
  S.chain.push({round:3,time:'12:52',type:'consequence',title:'The lunchtime outcome',detail:o.chainDetail});
}

/* ---------- Outcome computation (depends on all 3 rounds) ---------- */
function computeOutcome(){
  const f=S.flags;
  let score=0;
  const add=(cond,pts)=>{if(cond)score+=pts;};
  // Round 1 foundations
  add(f.interimControls,3); add(f.textureApplied,1); add(f.supervised,1);
  add(f.saltContacted,2); add(f.hospitalContacted,1);
  add(f.staffBriefed,2); add(f.competencyChecked,2); add(f.experiencedWorker,2);
  add(f.familyEngaged,2); add(f.interimPlan,2);
  add(f.noControls,-5); add(f.delayed,-1);
  // Round 2
  add(f.patternIdentified,4); add(f.salt2,2); add(f.medReviewed,2);
  add(f.planUpdated2,2); add(f.teamBriefed2,2); add(f.supervised2,1);
  add(f.familyContacted2,1); add(f.planSigned,2);
  add(f.isolatedR2,-5);
  // Round 3
  add(f.calmedR3,3); add(f.safeAlt,3); add(f.competentSupport,3);
  add(f.sisterSupported,2); add(f.escalationReady,2); add(f.agencyGuided,1); add(f.deployedBoth,1);
  add(f.riskyFood,-6); add(f.delayedMealR3 && !f.calmedR3,-2);
  // KPI influence
  score += (S.kpi.safety-64)/6;
  score -= (S.kpi.exposure-32)/8;

  let tier;
  if(score>=22) tier='controlled';
  else if(score>=13) tier='mixed';
  else if(score>=5) tier='nearmiss';
  else tier='serious';

  const O = {
    controlled:{
      cls:'outcome-good',ico:I.shield,label:'Risk controlled effectively',
      headline:'Michael has a safe, unhurried lunch',
      body:'Michael is supported by someone who knows what to watch for, his distress is managed before it drives unsafe eating, and Angela is part of the solution rather than a standoff. The prescribed meal arrives to a calm table. Nothing dramatic happens, which is exactly the point: the incident was prevented several days and several decisions ago.',
      chainDetail:'A safe, settled lunch. The controls, escalation and relationships built across admission and the early-warning days meant the busy lunchtime was a manageable twelve minutes, not a crisis.'},
    mixed:{
      cls:'outcome-mixed',ico:I.flag,label:'Managed, but real vulnerabilities remain',
      headline:'Lunch passes without harm, but on thin margins',
      body:'The immediate moment is handled and Michael is not hurt. But it holds together partly by luck: gaps in briefing, delivery or the family relationship meant the response was improvised where it should have been routine. On a worse day, with different staff on shift, this could have gone another way.',
      chainDetail:'No harm today, but the moment was managed on thin margins. Missing controls or briefings meant safety depended on improvisation rather than the system working as designed.'},
    nearmiss:{
      cls:'outcome-bad',ico:I.alertT,label:'A near miss',
      headline:'Michael coughs hard on unsuitable food, but recovers',
      body:'In the rush, Michael ends up eating quickly while distressed. He coughs violently and struggles for a moment before clearing it himself. He is shaken but unharmed. It is a near miss, and it was not bad luck: the conditions were set by earlier gaps in controls, escalation and communication that were never closed.',
      chainDetail:'A near miss. Michael coughed hard on unsuitable food and recovered on his own. The conditions were created by earlier gaps, not by the busy lunchtime alone.'},
    serious:{
      cls:'outcome-bad',ico:I.alertT,label:'A serious choking episode, Michael recovers',
      headline:'Michael experiences a serious choking episode',
      body:'With no safe alternative, no calm support and an unsuitable meal, Michael chokes. Staff respond and he recovers, badly frightened. This was not one obvious mistake at lunchtime. It was a chain: conflicting records accepted at admission, warning signs read in isolation, plans left unsigned, and no safe hands free when it mattered. Each link, on its own, looked minor.',
      chainDetail:'A serious choking episode, from which Michael recovers. The lunchtime was only the final link: the chain ran back through unmanaged records, missed warning signs and undelivered plans.'},
  };
  const chosen=O[tier];
  S.outcome={tier,...chosen};
  save();
  return S.outcome;
}

/* ============================================================
   Arrival animations — motion at the beats.
   render() replaces innerHTML on every interaction (tab switches,
   selecting actions), so "arrival" effects are gated on a
   screen:round key and only play when you actually land somewhere
   new. In-screen re-renders leave everything at its final state.
   ============================================================ */
let _animKey=null, _clockTimer=null;
function prefersReduce(){return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches);}
function afterRender(){
  if(_clockTimer){clearInterval(_clockTimer);_clockTimer=null;}
  const key=S.screen+':'+S.round;
  const fresh = key!==_animKey;
  _animKey=key;
  const motion = fresh && !prefersReduce();
  animateBars(motion);
  animateCounts(motion);
  if(motion){
    if(S.screen==='reveal'){staggerFeed();flashDeltas();}
    if(S.screen==='riskchain')drawChain();
  }
  if(S.screen==='dashboard' && S.round===3) startAtmosClock();
}
/* Grow the meter fills and sweep the prevention ring from empty. */
function animateBars(play){
  document.querySelectorAll('.k-fill,.tb-fill').forEach(b=>{
    if(!play)return;
    const target=b.style.width||'0%';
    b.style.width='0%';
    void b.offsetWidth;                       // commit the reset before the transition
    requestAnimationFrame(()=>{b.style.width=target;});
  });
  const arc=document.querySelector('.prev-arc');
  if(arc && play){
    const full=arc.getAttribute('stroke-dasharray');
    const target=arc.getAttribute('stroke-dashoffset');
    arc.style.strokeDashoffset=full;          // empty ring
    void arc.getBoundingClientRect();
    requestAnimationFrame(()=>{arc.style.strokeDashoffset=target;});
  }
}
/* Tick numbers up/down to their value (a subtle "scoring" feel). */
function animateCounts(play){
  document.querySelectorAll('[data-count]').forEach(elm=>{
    const to=parseInt(elm.getAttribute('data-count'),10);
    if(isNaN(to))return;
    const from=parseInt(elm.getAttribute('data-from')||'0',10);
    if(!play || from===to){elm.textContent=to;return;}
    const dur=850, t0=performance.now();
    (function tick(now){
      const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      elm.textContent=Math.round(from+(to-from)*e);
      if(p<1)requestAnimationFrame(tick); else elm.textContent=to;
    })(t0);
  });
}
/* Consequence feed lands item by item, like alerts arriving. */
function staggerFeed(){
  document.querySelectorAll('.feed .feed-item').forEach((it,i)=>{
    it.style.animation='none';void it.offsetWidth;
    it.style.animation='slidein .5s cubic-bezier(.2,.7,.2,1) both';
    it.style.animationDelay=(0.12+i*0.11)+'s';
  });
}
/* Pulse the indicators that actually changed, in the change's direction. */
function flashDeltas(){
  document.querySelectorAll('.kpi').forEach((row,i)=>{
    const d=row.querySelector('.k-delta');
    if(!d)return;
    const cls=d.classList.contains('k-good')?'flash-good':'flash-bad';
    setTimeout(()=>{
      row.classList.add(cls);
      setTimeout(()=>row.classList.remove(cls),1500);
    },550+i*90);
  });
}
/* The Risk Chain assembles from the top down. */
function drawChain(){
  document.querySelectorAll('#chain-track .chain-node').forEach((n,i)=>{
    n.style.animation='none';void n.offsetWidth;
    n.style.animation='chainpop .5s cubic-bezier(.2,.8,.2,1) both';
    n.style.animationDelay=(i*0.15)+'s';
  });
}
/* Round 3: a gently ticking clock for atmosphere and quiet time pressure. */
function startAtmosClock(){
  if(prefersReduce())return;
  const face=document.querySelector('.clock-strip .clock-face');
  if(!face)return;
  const parts=face.textContent.trim().split(':').map(Number);
  let h=parts[0]||12, m=parts[1]||0, sec=0;
  const paint=()=>face.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  paint();
  _clockTimer=setInterval(()=>{
    if(++sec>=60){sec=0;if(++m>=60){m=0;h++;}}
    paint();
  },1000);
}

function stepper(){
  const cur=S.screen==='summary'||S.screen==='riskchain'?7:S.round;
  const lead=`<span class="stepper-lead">${svg(I.route)} 6 Rounds</span>`;
  return lead+ROUNDS_META.map((r,i)=>{
    let cls='step';
    if(r.n<cur||S.screen==='summary'||(S.screen==='riskchain'))cls+= r.n<=3?' done':' locked';
    if(r.n===cur && S.screen!=='summary')cls+=' active';
    if(r.n>3)cls+=' locked';
    if(r.n<S.round)cls='step done';
    if(r.n===S.round && ['dashboard','reveal','intro'].includes(S.screen))cls='step active';
    if((S.screen==='summary'||S.screen==='riskchain')&&r.n<=3)cls='step done';
    const done=cls.includes('done');
    const inner = done?svg(I.checkSmall):(r.n>3?svg(I.lock):r.n);
    const link = i<ROUNDS_META.length-1?`<span class="step-link ${(r.n<S.round||S.screen==='summary')&&r.n<=3?'done':''}"></span>`:'';
    const nowTag = cls.includes('active')?'<b class="lbl-now">Now</b>':'';
    return `<div class="${cls}"><div class="dot">${inner}</div><span class="lbl">${r.short}${nowTag}</span></div>${link}`;
  }).join('');
}

/* ---------- Between-round bridge ---------- */
function viewBridge(){
  const round=S.round; const b=BRIDGES[round]; if(!b) {S.screen='dashboard';return viewDashboard();}
  const f=S.flags;
  // A couple of threads that carry forward, reflecting the actual path
  const threads=[];
  if(round===2){
    threads.push(f.interimControls?'Your interim controls are in place, giving staff a clear baseline':'No interim controls were set, so staff have little to measure change against');
    threads.push((f.staffBriefed||f.familyEngaged)?'The groundwork you laid at admission is carrying forward':'Gaps left at admission are still open as the days pass');
  }
  if(round===3){
    threads.push(f.patternIdentified?'The pattern you named last week means the team is watching the right things':'Last week’s signs were read in isolation, so the team is not primed for what is coming');
    threads.push((f.salt2||f.medReviewed)?'Your clinical escalation is in motion':'No clinical escalation is in motion as pressure builds');
  }
  return `<main class="wrap"><div class="bridge-wrap">
    <div class="bridge-tick">${svg(I.clock)} ${b.eyebrow}</div>
    <h1>${b.title}</h1>
    <p class="b-body">${b.body}</p>
    <div class="bridge-thread">
      ${threads.map((t,i)=>`<div class="bt rise-${i+1}" style="animation-delay:${.15+i*.12}s">${svg(I.link)}<div>${t}</div></div>`).join('')}
    </div>
    <div class="bridge-status">${svg(I.alertT)}<p>${b.status}</p></div>
    <div class="hero-cta" style="justify-content:center;margin-top:28px">
      <button class="btn btn-lg" data-act="enter-round">Enter Round ${round}: ${DATA[round].title} ${svg(I.arrowR)}</button>
    </div>
  </div></main>`;
}

/* ---------- Dashboard ---------- */
function viewDashboard(){
  const round=S.round;const d=DATA[round];
  const remaining=attentionRemaining(round);
  const used=attentionUsed(round);
  const sel=S.selected[round]||{};
  const anySel=Object.values(sel).some(Boolean);
  const over=used>ROUND_TIME;
  const canSubmit=anySel && !over;
  const tab=S.tab||'situation';
  const openedCount=Object.keys(S.opened[round]||{}).filter(k=>(S.opened[round]||{})[k]).length;
  const selCount=Object.values(sel).filter(Boolean).length;
  const alertCount=(d.alerts||[]).length;

  const tabBtn=(id,label,ico,count)=>`<button class="tab ${tab===id?'active':''}" role="tab" aria-selected="${tab===id}" data-act="set-tab" data-tab="${id}">${svg(ico)}<span>${label}</span>${count?`<span class="tcount">${count}</span>`:''}</button>`;

  const facts=(d.status.line||'').split('. ').map(s=>s.replace(/\.\s*$/,'').trim()).filter(Boolean);
  const chipTone=d.status.tone==='red'?'contradictory':d.status.tone==='amber'?'incomplete':'teal';
  const situationPanel=`
    <section class="card card-pad dossier">
      <div class="dossier-top">
        <div class="dossier-photo">${michaelAvatar(true)}</div>
        <div class="dossier-id">
          <span class="eyebrow">Round ${round} of 6 · ${d.title}</span>
          <h2 class="dossier-name">Michael Turner</h2>
          <div class="dossier-sub">${svg(I.user||I.users)} The person you're supporting</div>
          <ul class="dossier-facts">${facts.map(f=>`<li>${f}</li>`).join('')}</ul>
        </div>
        <span class="chip chip-${chipTone} dossier-chip" style="white-space:nowrap">${d.status.state}</span>
      </div>
      <blockquote class="dossier-brief">${d.brief}</blockquote>
    </section>
    ${alertCount?`<section>
      <div class="sec-head"><div class="sec-title-ico">${svg(I.bell)}<h3>New alerts</h3></div></div>
      <div class="stack gap-12" style="margin-top:8px">
        ${d.alerts.map(a=>{const tn=a.tone==='red'?'red':a.tone==='info'?'info':'amber';return `<div class="alert alert-${tn}"><span class="al-ico">${svg(I[a.ico])}</span><div class="al-body">${a.text}</div></div>`;}).join('')}
      </div>
    </section>`:''}
    ${round===3?round3Notifs():''}`;

  const revd=reviewedCount(round);
  const informationPanel=`
    <section>
      <div class="sec-head"><div class="sec-title-ico">${svg(I.eye)}<h3>Information sources</h3></div>
        <span class="chip chip-teal" style="font-size:12px">Reviewed ${revd} of ${d.docs.length}</span></div>
      <div class="link-note" style="margin:10px 0 4px">${svg(I.info)}<div>Reviewing a record uses some of your time, the same time you need for actions, so you cannot read everything. Choose the ones most likely to matter; you can still act on the rest, just with less certainty.</div></div>
      <div class="src-grid" style="margin-top:10px">
        ${d.docs.map(doc=>srcCard(doc,round)).join('')}
      </div>
    </section>`;

  const decisionsPanel=`
    <section>
      <div class="sec-head" style="margin-bottom:9px"><div class="sec-title-ico">${svg(I.check)}<h3 style="font-size:16px">Your decisions</h3></div>
        <span class="muted" style="font-size:12px">Colour shows the type of action</span></div>
      <div class="acts">
        ${d.actions.map(a=>actCard(a,round,remaining,sel[a.id])).join('')}
      </div>
    </section>`;

  return `<main class="console-main">
    <div class="console-col">
      ${round===3?`<div class="clock-strip">${round3ClockBar()}</div>`:''}
      <div class="tab-guide">${svg(tab==='decisions'?I.check:tab==='information'?I.eye:I.route)}<div>${tabGuide(tab,round)}</div></div>
      <div class="tabbar" role="tablist">
        ${tabBtn('situation','Situation',I.clipboard,alertCount||'')}
        ${tabBtn('information','Information',I.eye,`${openedCount}/${d.docs.length}`)}
        ${tabBtn('decisions','Decisions',I.check,selCount||'')}
      </div>
      <div class="tabpanel" role="tabpanel">
        ${tab==='situation'?situationPanel:tab==='information'?informationPanel:decisionsPanel}
      </div>
    </div>

    <aside class="console-rail">
      <div class="rail-scroll">
        ${preventionCard()}
        ${attentionCard(round)}
        ${kpiCard()}
      </div>
      <div class="rail-submit">
        <div class="submit-status">
          <span><span class="ss-count">${selCount}</span> action${selCount===1?'':'s'} selected</span>
          <span class="${over?'ss-over':''}">${over?'Over time':`${Math.max(0,Math.round((ROUND_TIME-used)/ROUND_TIME*100))}% time left`}</span>
        </div>
        <button class="btn btn-lg" style="width:100%" data-act="submit-round" ${canSubmit?'':'disabled'}>
          ${anySel?'Review &amp; submit':'Choose an action to continue'} ${anySel?svg(I.arrowR):''}
        </button>
        ${over?`<div class="alert alert-red">${svg(I.alertT)}<div>You have taken on more than there is time for. Deselect an action or leave a record unread.</div></div>`:''}
      </div>
    </aside>
  </main>`;
}

function docTitle(round,id){const doc=(DATA[round].docs||[]).find(d=>d.id===id);return doc?doc.title.toLowerCase().replace(/^the /,''):'record';}

function decisionPrompt(round){
  if(round===1)return 'Should the admission proceed? What must be confirmed, controlled or communicated before Michael’s first meal, and who needs to be involved?';
  if(round===2)return 'Which observations matter? Is this an isolated issue or a developing pattern, and what should change now, clinically and practically?';
  return 'Deploy your staff, decide Michael’s support and food, respond to Angela, and set your safety net, all in the next few minutes.';
}

function srcCard(doc,round){
  const opened=(S.opened[round]||{})[doc.id];
  const noTime = !opened && attentionRemaining(round)<doc.cost;   // not enough time left to review
  return `<button class="src ${opened?'opened':''} ${noTime?'capped':''}" data-act="open-doc" data-doc="${doc.id}" ${noTime?'disabled title="Not enough time left this round to review this"':''}>
    <div class="s-h">
      <div class="s-ico">${svg(I[doc.ico])}</div>
      ${opened?'':`<span class="s-open-cost">${timeCost(doc.cost)}</span>`}
    </div>
    <div><h4>${doc.title}</h4><div class="s-src">${doc.source}</div></div>
    <div class="s-teaser">${doc.teaser}</div>
    <div class="s-foot">
      ${opened
        ? `<span class="s-reviewed">${svg(I.checkSmall)} Reviewed</span><span class="muted" style="font-size:12px">Reopen · free</span>`
        : `<span class="s-review-btn">${svg(I.eye)} Review record</span>`}
    </div>
  </button>`;
}

const CAT_META={
  'Decision':{ico:'flag',cls:'cat-decision'},
  'Control':{ico:'shield',cls:'cat-control'},
  'Escalation':{ico:'phone',cls:'cat-escalation'},
  'Communication':{ico:'message',cls:'cat-communication'},
  'Practical':{ico:'users',cls:'cat-practical'},
  'Risk identification':{ico:'spark',cls:'cat-risk'},
  'Investigation':{ico:'eye',cls:'cat-control'},
};
function catMeta(cat){return CAT_META[cat]||CAT_META['Decision'];}

function actCard(a,round,remaining,selected){
  const cost=a.cost;
  const affordable = selected || cost<=remaining;
  const dis = !affordable;
  const cm=catMeta(a.cat);
  const inf=(INFORMED_BY[round]||{})[a.id];
  const opened=S.opened[round]||{};
  let evTag='';
  if(inf&&inf.length){
    const informed=inf.some(id=>opened[id]);
    evTag=informed
      ? `<span class="a-ev ev-on" title="You have reviewed the relevant record">${svg(I.checkSmall)} Evidence reviewed</span>`
      : `<span class="a-ev ev-off" title="Relevant record not yet reviewed">${svg(I.eye)} Acting on assumption</span>`;
  }
  const foot = (evTag||dis)?`<span class="a-foot">${evTag}${dis?`<span class="a-ev ev-off">${svg(I.clock)} No time, deselect another</span>`:''}</span>`:'';
  return `<button class="act ${selected?'sel':''} ${dis?'disabled':''}" data-act="toggle-action" data-action-id="${a.id}" aria-pressed="${selected}" ${dis?'disabled':''}>
    <span class="a-select" aria-hidden="true">${selected?svg(I.checkSmall):''}</span>
    <span class="a-ico ${cm.cls}" aria-label="${a.cat}">${svg(I[cm.ico])}</span>
    <span class="a-main">
      <span class="a-cat">${a.cat}</span>
      <span class="a-title">${a.title} ${timeCost(cost)}</span>
      <span class="a-blurb">${a.blurb}</span>
      ${foot}
    </span>
  </button>`;
}

function preventionCard(){
  const v=S.prevention;const circ=2*Math.PI*30;const off=circ*(1-v/100);
  const col=v>=68?'var(--good)':v>=52?'var(--teal)':v>=38?'var(--warn)':'var(--bad)';
  return `<div class="prev-cap">
    <div class="prev-ring">
      <svg width="74" height="74"><circle cx="37" cy="37" r="30" stroke="rgba(255,255,255,.15)" stroke-width="7" fill="none"/>
        <circle class="prev-arc" cx="37" cy="37" r="30" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg>
      <div class="pv" data-count="${v}" data-from="0">0</div>
    </div>
    <div class="pc-txt"><small>Prevention capability</small><h4>${prevLabel(v)}</h4><p>Your overall ability to prevent an incident, right now.</p></div>
  </div>`;
}
function prevLabel(v){return v>=72?'Strong':v>=58?'Developing':v>=44?'Fragile':'At risk';}

function attentionCard(round){
  const used=attentionUsed(round);
  const pct=Math.max(0,Math.round((ROUND_TIME-used)/ROUND_TIME*100));
  const cls=used>ROUND_TIME?'over':pct<=34?'low':'';
  const whenNote={1:'before Michael arrives',2:'this shift',3:'in the next few minutes'}[round]||'this round';
  return `<div class="card card-pad timecard">
    <div class="tc-top"><h3>${svg(I.clock)} Time available</h3><span class="tc-pct">${used>ROUND_TIME?'0':pct}%</span></div>
    <div class="timebar"><div class="tb-fill ${cls}" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div>
    <div class="tc-note">${used===0?`Your time ${whenNote}, spent on both reviewing records and taking actions. There is more here than you can get to, so choose where it goes.`:used>ROUND_TIME?`You have committed more than the time available ${whenNote}.`:`${pct}% of your time remains ${whenNote}.`}</div>
  </div>`;
}

/* per-item time cost as segments (0 = no extra time) */
function timeCost(cost){
  if(!cost) return `<span class="tcost tcost-free">${svg(I.clock)} No extra time</span>`;
  let seg='';for(let i=0;i<3;i++)seg+=`<i class="tseg ${i<cost?'on':''}"></i>`;
  const lbl={1:'A little time',2:'Some time',3:'A lot of time'}[cost]||'';
  return `<span class="tcost" title="${lbl}">${svg(I.clock)}<span class="tsegs">${seg}</span></span>`;
}

function tabGuide(tab,round){
  const pill=n=>`<span class="guide-badge">Step ${n} of 3</span>`;
  if(tab==='information') return `${pill(2)}<b>Review the records that matter most.</b> Each one uses some of your time, and acting without the evidence is riskier.`;
  if(tab==='decisions') return `${pill(3)}<b>Choose your actions, then Review &amp; submit.</b> Change your mind freely until you commit.`;
  return `${pill(1)}Read the <b>Situation</b>, then work through <b>Information</b> and <b>Decisions</b>.`;
}

function kpiCard(deltas){
  return `<div class="card kpi-panel">
    <h3>Performance indicators</h3>
    <div class="kpi-row">${KPIS.map(k=>kpiRow(k,deltas)).join('')}</div>
    <div class="tag-legend" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
      <span>${svg(I.alertT,'')} Regulatory Exposure: higher means greater exposure</span>
    </div>
  </div>`;
}
function zoneClass(k,v){
  if(k.invert){return v<=35?'f-good':v<=55?'f-warn':'f-bad';}
  return v>=66?'f-good':v>=48?'f-warn':'f-bad';
}
function kpiRow(k,deltas){
  const v=S.kpi[k.key];const zone=zoneClass(k,v);
  let deltaHtml='';
  if(deltas && deltas[k.key]!==undefined && deltas[k.key]!==0){
    const dv=deltas[k.key];
    // improvement direction: for invert, negative is good
    const good = k.invert? dv<0 : dv>0;
    const cls=good?'k-good':'k-bad';
    const arrow=dv>0?'▲':'▼';
    deltaHtml=`<span class="k-delta ${cls}">${arrow} ${dv>0?'+':''}${dv}</span>`;
  }
  const hasD = deltas && deltas[k.key]!==undefined;
  const from = hasD ? v-deltas[k.key] : 0;
  return `<div class="kpi">
    <div class="k-name">${k.invert?`<span class="warn-ico">${svg(I.alertT)}</span>`:''}${k.name}</div>
    <div class="k-val"><span class="k-num" data-count="${v}" data-from="${from}">${from}</span>${k.invert?'<span class="muted" style="font-size:11px;font-weight:500"> exp.</span>':''}</div>
    <div class="k-bar"><div class="k-fill ${zone}${k.invert?' k-inv':''}" style="width:${v}%"></div></div>
    ${deltaHtml}
  </div>`;
}

/* ---------- Consequence reveal ---------- */
function viewReveal(){
  const round=S.round;const d=DATA[round];
  const res=S.committed[round];
  const chosen=res.chosen.map(id=>d.actions.find(a=>a.id===id));
  const sel=res.chosen;
  // feed items from chosen actions
  const feed=chosen.map(a=>{
    const good=(a.prev||0)>=5; const bad=(a.prev||0)<=-3;
    const tone=bad?'bad':good?'good':'info';
    return `<div class="feed-item fi-${tone}">
      <div class="fi-ico">${svg(bad?I.alertT:good?I.check:I.info)}</div>
      <div><h4>${a.title}</h4><p>${a.selNote}</p>
      ${a.delayed?`<span class="fi-tag" style="color:var(--warn)">Delayed effect · ${a.delayed}</span>`:''}</div>
    </div>`;
  }).join('');
  // missed: pick 1-2 high value unchosen actions
  const missedCandidates=d.actions.filter(a=>!sel.includes(a.id)&&a.missNote&&(a.prev||0)>=5)
    .sort((x,y)=>(y.prev||0)-(x.prev||0));
  const missed=missedCandidates[0];
  const missed2=missedCandidates[1];
  // context links
  const links=contextLinks(round);
  const blind=res.blind||[];
  const conf=res.conf||'measured';
  const confText={cautious:'You committed <b>cautiously</b>, which softened the swing this round.',measured:'You committed with <b>measured</b> confidence.',confident:'You committed with <b>full confidence</b>, which amplified this round’s outcome in both directions.'}[conf];
  return `<main class="wrap" style="padding-top:14px;padding-bottom:44px">
    <div class="reveal-head rise rise-1">
      <span class="eyebrow">Round ${round} · consequences</span>
      <h2>${d.title}: what your decisions set in motion</h2>
      <p>This is what your decisions have set in motion. Some effects show now; others will surface later. A full account of what worked and where to focus comes in your report at the end.</p>
      <div style="margin-top:14px"><span class="conf-note" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:rgba(232,238,242,.9)">${svg(conf==='confident'?I.bolt:conf==='cautious'?I.scale:I.gauge2)} ${confText}</span></div>
    </div>

    <div class="two-col" style="margin-top:22px;align-items:start">
      <div class="stack gap-22">
        <section class="rise rise-2">
          <div class="sec-head"><div class="sec-title-ico">${svg(I.spark)}<h3>Immediate effects</h3></div></div>
          <div class="feed" style="margin-top:8px">${feed||`<div class="feed-item fi-warn"><div class="fi-ico">${svg(I.alertT)}</div><div><h4>No active decisions taken</h4><p>Inaction leaves the existing risks in place and unmanaged.</p></div></div>`}</div>
        </section>

        ${links.length?`<section class="rise rise-3">

function contextLinks(round){
  const f=S.flags;const out=[];
  if(round===2){
    if(f.interimControls&&f.patternIdentified)out.push('Because you put <b>interim controls</b> in place at admission, the new warning signs were easier to read against a clear baseline.');
    if(!f.staffBriefed&&!f.teamBriefed2)out.push('With <b>no staff briefing</b> at admission, observations arrived inconsistently across shifts, and care reliability took a further knock.');
    if(f.familyEngaged||f.familyContacted2)out.push('The <b>relationship you built with Angela</b> meant her call about Michael sounding tired was shared openly rather than held back.');
    else if(S.kpi.family<62)out.push('With <b>family trust low</b>, Angela offered less detail than she might have, so a useful observation nearly went unrecorded.');
    if(S.kpi.staff>=72)out.push('<b>High staff confidence</b> meant concerns were raised and escalated earlier rather than sat on.');
  }
  if(round===3){
    if(f.competencyChecked||f.experiencedWorker)out.push('Because you <b>arranged competent cover earlier</b>, there was a safe pair of hands to deploy even with a worker off sick.');
    else out.push('With <b>competency never confirmed</b>, there was no clearly safe person to put with Michael when the shift lost a worker.');
    if(f.interimControls&&(f.textureApplied||f.planUpdated2||f.salt2))out.push('Your earlier <b>texture and escalation work</b> meant a safe alternative to the home sandwich was actually available.');
    else out.push('Without earlier <b>texture or escalation decisions</b>, there was no ready safe alternative to offer instead of the sandwich.');
    if(f.familyEngaged||f.familyContacted2||f.sisterSupported)out.push('The <b>trust built with Angela</b> turned a potential standoff over the sandwich into a conversation.');
    else out.push('With <b>little relationship built</b>, Angela’s arrival with food became a confrontation at the worst possible moment.');
  }
  return out;
}

function riskSummary(round){
  const f=S.flags;const reduced=[];const remaining=[];
  if(round===1){
    if(f.interimControls)reduced.push('Mealtime risk covered for the first meal');else remaining.push('First meal has no agreed safeguard');
    if(f.saltContacted||f.hospitalContacted)reduced.push('Conflicting diet information being clarified');else remaining.push('Diet contradiction unresolved');
    if(f.staffBriefed)reduced.push('Staff know what to watch for');else remaining.push('Staff, including agency, not briefed');
    if(f.competencyChecked)reduced.push('Competent cover confirmed for the shift');else remaining.push('Competency for the shift unchecked');
    if(!f.familyEngaged)remaining.push('Angela’s message not yet answered');
  }
  if(round===2){
    if(f.patternIdentified)reduced.push('Developing pattern recognised in time');else remaining.push('Pattern of warning signs not connected');
    if(f.salt2||f.medReviewed)reduced.push('Clinical reassessment / medication review triggered');else remaining.push('Underlying medication driver unaddressed');
    if(f.planUpdated2||f.planSigned)reduced.push('Support plan current and being delivered');else remaining.push('Plan out of date or unsigned');
    if(!f.teamBriefed2&&!f.staffBriefed)remaining.push('Observation still fragmented across shifts');
  }
  if(round===3){
    if(f.calmedR3||f.sisterSupported)reduced.push('Michael’s distress actively managed');else remaining.push('Distress left to drive unsafe eating');
    if(f.safeAlt)reduced.push('Safe alternative bridged the wait');else remaining.push('No safe alternative to the home food');
    if(f.competentSupport||f.agencyGuided||f.deployedBoth)reduced.push('Someone assigned to support the meal');else remaining.push('No one clearly supporting the meal');
    if(f.riskyFood)remaining.push('Unmodified food eaten while distressed');
  }
  return {reduced,remaining};
}

function reportItems(){
  const f=S.flags; const strengths=[], dev=[];
  const anyBlind=[1,2,3].some(r=>((S.committed[r]||{}).blind||[]).length>0);
  const S1=(h,p)=>strengths.push({h,p}); const D1=(h,p)=>dev.push({h,p});
  if(f.interimControls) S1('Proportionate interim controls','You put mealtime safeguards in place at admission while seeking clarity, rather than accepting the vaguest instruction on file.');
  if(f.saltContacted||f.salt2||f.medReviewed) S1('Timely clinical escalation','You escalated to SALT or a medication review at a point of significant change, which is exactly the trigger the guidance named.');
  if(f.patternIdentified) S1('Pattern recognition','You connected separate, low-level observations into a developing picture while there was still time to act calmly.');
  if(f.staffBriefed||f.teamBriefed2) S1('Handover and briefing','You briefed the team so plans were delivered on the floor, not just written down, which matters most with agency cover and keyworkers away.');
  if(f.competencyChecked||f.experiencedWorker||f.competentSupport) S1('Competent cover','You made sure a suitably competent person supported Michael at the highest-risk moments.');
  if(f.familyEngaged||f.familyContacted2||f.sisterSupported) S1('Working with the family','You treated Angela as a partner rather than an obstacle, which paid off when pressure peaked at lunchtime.');
  if(f.calmedR3||f.safeAlt) S1('Managing the pressure point','At the busy lunchtime you reduced Michael’s distress and offered a safe option, rather than forcing the moment.');
  if(!strengths.length) S1('Kept the service moving','The team kept things running, though few decisions actively reduced Michael’s risk. The areas below are where the biggest gains sit.');

  if(!f.interimControls) D1('Interim safeguards at admission','The first meal went ahead without an agreed control, despite records pointing to mealtime risk. A proportionate interim measure buys safety while information is confirmed.');
  if(!f.patternIdentified) D1('Spotting a developing pattern','Coughing, quicker eating, reduced intake and tiredness were read in isolation. Reading them together is what surfaces a rising swallowing risk in time.');
  if(!(f.salt2||f.medReviewed||f.saltContacted)) D1('Escalating on a significant change','A hospital admission and a medication change are exactly the triggers for reassessment. Escalating early keeps the underlying driver in view.');
  if(!f.staffBriefed&&!f.teamBriefed2) D1('Briefing so plans are delivered','Without a briefing, a written plan can quietly fail in delivery. Closing the gap between the plan and the shift is a recurring theme in serious incidents.');
  if(!(f.familyEngaged||f.familyContacted2)) D1('Family as partners in safety','A relationship built early makes conversations about risk far easier, and turns family into a source of information rather than conflict.');
  if(anyBlind) D1('Reviewing the evidence before acting','Several decisions were taken without reviewing the relevant record. Acting on assumption tends to work less well and can hide a risk that reading would have surfaced.');
  if(f.riskyFood) D1('Holding a safe line under pressure','Unmodified food was given while Michael was distressed and unsupported. Under pressure, a safe alternative and calm support protect the person without a standoff.');
  const w=weakestKpi();
  D1('Strengthen '+w.name.toLowerCase(),'This finished as the team’s lowest indicator ('+w.disp+'), and is the area most worth attention in a real service response.');
  return {strengths,dev:dev.slice(0,6)};
}

        <h2>Overall outcome</h2>

      </div>

          ${dev.map(s=>`<div class="r-item"><div class="ri-ico ri-dev">${svg(I.target)}</div><div><h4>${s.h}</h4><p>${s.p}</p></div></div>`).join('')}

      ${chainMissed.length?`<div class="r-section">
        <h2>Opportunities the chain revealed</h2>
        ${chainMissed.map(n=>`<div class="r-item"><div class="ri-ico ri-dev">${svg(I.alertT)}</div><div><h4>${n.title}</h4><p>${n.detail}</p></div></div>`).join('')}
      </div>`:''}

      <div class="r-foot">The Risk Chain is a training simulation. Michael Turner, Meadow View and all people and organisations named are fictional. This report reflects decisions made in one playthrough and is intended to prompt reflection and discussion, not to assess clinical competence.</div>
    </article>
  </main>`;

function strongestKpi(){
  let best=null;
  KPIS.forEach(k=>{const eff=k.invert?100-S.kpi[k.key]:S.kpi[k.key];if(!best||eff>best.eff)best={name:k.name,val:S.kpi[k.key],eff};});
  return best;
}
function weakestKpi(){
  let worst=null;
  KPIS.forEach(k=>{const eff=k.invert?100-S.kpi[k.key]:S.kpi[k.key];if(!worst||eff<worst.eff)worst={name:k.name,val:S.kpi[k.key],eff,invert:k.invert};});
  worst.disp=worst.invert?`${worst.val} / 100 exposure (higher is worse)`:`${worst.val} / 100`;
  return worst;
}

function personalSummary(){
  const f=S.flags;const parts=[];
  // opening
  const o=S.outcome.tier;
  if(o==='controlled')parts.push('Your team prevented an incident the hard way: quietly, and early. ');
  else if(o==='mixed')parts.push('Your team got Michael through the lunchtime unharmed, but the response leaned on improvisation where the system should have carried it. ');
  else if(o==='nearmiss')parts.push('Your team experienced a near miss. Michael recovered, but the warning was real and the causes were upstream. ');
  else parts.push('Your team saw a serious episode from which Michael recovered. It was the end of a chain, not a single lunchtime error. ');
  // admission
  if(f.interimControls&&(f.saltContacted||f.hospitalContacted))parts.push('At admission you refused to accept the vaguest instruction and put proportionate controls in place while seeking clarity. ');
  else if(f.noControls)parts.push('At admission the move proceeded without agreed safeguards, which set the tone for everything after. ');
  else parts.push('At admission your controls were partial, leaving some contradictions in the records unresolved. ');
  // warning
  if(f.patternIdentified)parts.push('When the warning signs appeared, you connected them into a pattern rather than reading each in isolation, and escalated on the clinical trigger. ');
  else if(f.isolatedR2)parts.push('When the warning signs appeared, they were read one at a time, so the developing pattern was not named while it was still calm. ');
  // family
  if(f.familyEngaged||f.familyContacted2||f.sisterSupported)parts.push('Throughout, you treated Angela as a partner, which paid off when she arrived with food at the worst moment. ');
  else parts.push('The relationship with Angela was never really built, which made the lunchtime confrontation harder than it needed to be. ');
  parts.push('The Risk Chain above shows exactly where risk entered, where it was seen, where it was held, and where the openings were missed.');
  return parts.join('');
}

function openDoc(id){
  const round=S.round;const doc=DATA[round].docs.find(d=>d.id===id);
  if(!doc)return;
  const opened=(S.opened[round]||{})[doc.id];
  if(!opened){
    if(attentionRemaining(round)<doc.cost){toast('Not enough time left this round to review this record');return;}
    if(!S.opened[round])S.opened[round]={};
    S.opened[round][doc.id]=true;save();
  }
  showModal(doc);
  // re-render behind modal to update points/opened state
  renderDashboardBehind();
}
function renderDashboardBehind(){
  // update side panel numbers without closing modal
  const main=app();
  // simplest: re-render app then re-open modal
  const openModal=el('modal-root').innerHTML;
  render();
  el('modal-root').innerHTML=openModal;
  bindModal();
}
function showModal(doc){
  const credLabel={reliable:'Reliable source',incomplete:'Incomplete',outdated:'Out of date',ambiguous:'Ambiguous',contradictory:'Contradictory'}[doc.cred];
  el('modal-root').innerHTML=`<div class="modal-scrim">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${doc.title}" tabindex="-1">
      <div class="modal-head">
        <div><h3 style="font-size:18px">${doc.title}</h3>
          <div class="mh-src">${doc.source} <span class="chip chip-${doc.cred}">${credLabel}</span></div></div>
        <button class="icon-x" data-act="close-modal" aria-label="Close record">${svg(I.x)}</button>
      </div>
      <div class="modal-body">
        <div class="record">${doc.body}</div>
      </div>
    </div></div>`;
  bindModal();
  const m=el('modal-root').querySelector('.modal');if(m&&m.focus)m.focus();
}
function bindModal(){
  const scrim=el('modal-root').querySelector('.modal-scrim');
  if(scrim){scrim.addEventListener('click',e=>{if(e.target===scrim)closeModal();});}
}
function closeModal(){if(el('modal-root').innerHTML){el('modal-root').innerHTML='';render();}}
function closeModalSilent(){el('modal-root').innerHTML='';}

/* Guided walkthrough (numbered), on first use and revisitable via the How-to-play button */
/* First-use coach tour: spotlight + pop-up anchored to each element */
const TOUR=[
  {sel:'.tab[data-tab="situation"]',ico:'clipboard',h:'Read the situation',p:'Start on the Situation tab each round. It briefs you on Michael, his current status and any new alerts.',place:'bottom'},
  {sel:'.tab[data-tab="information"]',ico:'eye',h:'Review the key records',p:'Open the Information tab to read the records. You can only review a few, so choose the ones that matter. Acting without the evidence is riskier.',place:'bottom'},
  {sel:'.tab[data-tab="decisions"]',ico:'check',h:'Make your decisions',p:'On the Decisions tab, pick a combination of actions. The coloured icon shows the type, and each shows how much time it takes.',place:'bottom'},
  {sel:'.timecard',ico:'clock',h:'Watch your time',p:'This is your time available this round, spent on both reviewing records and taking actions. There is more here than you can get to, so choose where it goes.',place:'left'},
  {sel:'.kpi-panel',ico:'gauge2',h:'Read the indicators',p:'Your Prevention Capability and six performance indicators live here. They do not all move in the same direction.',place:'left'},
  {sel:'[data-act="submit-round"]',ico:'arrowR',h:'Review and submit',p:'When ready, Review and submit shows a summary and lets you set the team’s confidence, then reveals the consequences.',place:'top'},
];
let tourIdx=0;
function tourActive(){return !!el('tour-root').innerHTML;}
function startTour(){tourIdx=0;showTourStep(0);}
function endTour(){el('tour-root').innerHTML='';}
function tourNext(){ if(tourIdx>=TOUR.length-1){endTour();return;} showTourStep(++tourIdx);}
function tourPrev(){ if(tourIdx<=0)return; showTourStep(--tourIdx);}
function showTourStep(i){
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const step=TOUR[i];
  const t=document.querySelector(step.sel);
  if(!t){ if(i<TOUR.length-1){tourIdx=i+1;return showTourStep(i+1);} endTour(); return; }
  const r=t.getBoundingClientRect();
  const vw=window.innerWidth, vh=window.innerHeight, pad=8, popW=312, popH=182, gap=14;
  const spot={t:r.top-pad,l:r.left-pad,w:r.width+pad*2,h:r.height+pad*2};
  let popL=0, popT=0;
  const below=()=>{popT=r.bottom+gap;popL=cl(r.left+r.width/2-popW/2,12,vw-popW-12);return popT+popH<vh-8;};
  const above=()=>{popT=r.top-gap-popH;popL=cl(r.left+r.width/2-popW/2,12,vw-popW-12);return popT>8;};
  const left =()=>{popL=r.left-gap-popW;popT=cl(r.top,12,vh-popH-12);return popL>8;};
  const right=()=>{popL=r.right+gap;popT=cl(r.top,12,vh-popH-12);return popL+popW<vw-8;};
  let plClass='pl-bottom', done=false;
  const tryPlace=(name)=>{ if(name==='left'&&left()){plClass='pl-left';return true;} if(name==='top'&&above()){plClass='pl-top';return true;} if(name==='right'&&right()){plClass='pl-right';return true;} if(name==='bottom'&&below()){plClass='pl-bottom';return true;} return false; };
  done=tryPlace(step.place);
  if(!done){ if(below()){plClass='pl-bottom';} else if(above()){plClass='pl-top';} else if(left()){plClass='pl-left';} else {right();plClass='pl-right';} }
  const last=i===TOUR.length-1;
  el('tour-root').innerHTML=`<div class="tour">
    <div class="tour-block" data-act="tour-skip"></div>
    <div class="tour-spot" style="top:${spot.t}px;left:${spot.l}px;width:${spot.w}px;height:${spot.h}px"></div>
    <div class="tour-pop ${plClass}" style="top:${Math.round(popT)}px;left:${Math.round(popL)}px" role="dialog" aria-label="${step.h}">
      <div class="tp-arrow"></div>
      <span class="tp-num">${svg(I.route)} Step ${i+1} of ${TOUR.length}</span>
      <h4>${svg(I[step.ico])} ${step.h}</h4>
      <p>${step.p}</p>
      <div class="tp-foot">
        <div class="tp-dots">${TOUR.map((_,j)=>`<span class="tp-dot ${j===i?'on':''}"></span>`).join('')}</div>
        <div class="tp-btns">
          ${i>0?`<button class="tour-btn" data-act="tour-prev">Back</button>`:`<button class="tour-skip" data-act="tour-skip">Skip</button>`}
          <button class="tour-btn primary" data-act="tour-next">${last?'Done':'Next'}</button>
        </div>
      </div>
    </div>
  </div>`;
}
window.addEventListener('resize',()=>{ if(tourActive())showTourStep(tourIdx); });

function toggleAction(id){
  const round=S.round;const a=DATA[round].actions.find(x=>x.id===id);
  if(!a)return;
  if(!S.selected[round])S.selected[round]={};
  const cur=!!S.selected[round][id];
  if(!cur){
    if(a.cost>attentionRemaining(round)){toast('Not enough time left this round for that');return;}
    S.selected[round][id]=true;
  }else{delete S.selected[round][id];}
  save();render();
}

function submitRound(){
  const round=S.round;
  const sel=S.selected[round]||{};
  if(!Object.values(sel).some(Boolean)){toast('Choose at least one action in the Decisions tab');return;}
  if(attentionUsed(round)>ROUND_TIME){toast('You have taken on more than there is time for');return;}
  if(!S.confidence[round])S.confidence[round]='measured';
  showConfirmModal(round);
}

/* Deliberate submit: summary + unread nudge + confidence input */
function showConfirmModal(round){
  const d=DATA[round];
  const sel=S.selected[round]||{};
  const chosen=d.actions.filter(a=>sel[a.id]);
  const opened=S.opened[round]||{};
  const reviewed=reviewedCount(round), totalDocs=d.docs.length;
  const usedPct=Math.round(attentionUsed(round)/ROUND_TIME*100);
  // actions being taken without their evidence read
  const blind=chosen.filter(a=>{const inf=(INFORMED_BY[round]||{})[a.id];return inf&&inf.length&&!inf.some(id=>opened[id]);});
  const conf=S.confidence[round]||'measured';
  const confOpt=(id,ico,name,desc)=>`<button class="conf-opt ${conf===id?'sel':''}" data-act="set-confidence" data-conf="${id}"><h5>${svg(ico)}${name}</h5><p>${desc}</p></button>`;
  el('modal-root').innerHTML=`<div class="modal-scrim">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Confirm your decisions" tabindex="-1">
      <div class="modal-head">
        <div><h3 style="font-size:18px">Before you commit</h3>
          <div class="mh-src">Round ${round} · review what you are about to submit</div></div>
        <button class="icon-x" data-act="close-modal" aria-label="Close">${svg(I.x)}</button>
      </div>
      <div class="modal-body">
        <div class="confirm-stat">
          <div class="cs"><b>${chosen.length}</b> action${chosen.length===1?'':'s'} chosen</div>
          <div class="cs"><b>${usedPct}%</b> of time used</div>
          <div class="cs"><b>${reviewed} / ${totalDocs}</b> records reviewed</div>
        </div>
        <div class="confirm-list">
          ${chosen.map(a=>`<div class="confirm-line ok">${svg(I.checkSmall)}<div>${a.title}</div></div>`).join('')}
        </div>
        ${blind.length?`<div class="link-note" style="margin-top:14px;border-color:var(--warn-line);background:var(--warn-tint)">${svg(I.alertT)}<div><b>${blind.length} decision${blind.length===1?'':'s'} taken without the evidence.</b> ${blind.map(a=>a.title).join('; ')}. You can still proceed, but acting on assumption tends to work less well and can miss a risk.</div></div>`:''}
        ${reviewed<totalDocs?`<div class="link-note" style="margin-top:10px">${svg(I.eye)}<div>You reviewed ${reviewed} of ${totalDocs} records. Holding one back can be the right call; sometimes it hides the thing that mattered.</div></div>`:''}

        <div style="margin-top:20px">
          <div class="sec-title-ico" style="margin-bottom:4px">${svg(I.gauge2)}<h3 style="font-size:15px">How confident is the team?</h3></div>
          <p class="muted" style="font-size:12.5px;margin-bottom:4px">Confidence commits the team. It amplifies this round’s outcome, the gains if you are right, and the costs if you are not.</p>
          <div class="conf-row">
            ${confOpt('cautious',I.scale,'Cautious','Hedge your bets. Smaller swing either way.')}
            ${confOpt('measured',I.check,'Measured','A considered, balanced commitment.')}
            ${confOpt('confident',I.bolt,'Confident','Full conviction. Larger swing either way.')}
          </div>
        </div>
      </div>
      <div class="modal-head" style="border-top:1px solid var(--line);border-bottom:0;position:static;justify-content:flex-end;gap:10px">
        <button class="btn btn-secondary" data-act="close-modal">Go back</button>
        <button class="btn" data-act="commit-round">Commit decisions ${svg(I.arrowR)}</button>
      </div>
    </div></div>`;
  bindModal();
}
function setConfidence(c){
  S.confidence[S.round]=c;save();
  // update selection in place (no modal rebuild, so no flicker)
  document.querySelectorAll('.conf-opt').forEach(b=>b.classList.toggle('sel',b.getAttribute('data-conf')===c));
}

function commitAndReveal(){
  const round=S.round;
  closeModalSilent();
  commitRound(round);
  if(round===3){computeOutcome();buildChainForOutcome();}
  S.screen='reveal';save();render();
}

function nextRound(){
  if(S.round<3){S.round++;S.screen='bridge';save();render();}
  else{S.screen='riskchain';save();render();}
}

/* ---------- Fullscreen ---------- */
function goFullscreen(){
  try{const e=document.documentElement;if(e.requestFullscreen&&!document.fullscreenElement){const p=e.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}}catch(err){}
}
function exitFullscreen(){
  try{if(document.fullscreenElement&&document.exitFullscreen){const p=document.exitFullscreen();if(p&&p.catch)p.catch(()=>{});}}catch(err){}
}
function toggleFullscreen(){document.fullscreenElement?exitFullscreen():goFullscreen();}
document.addEventListener('fullscreenchange',()=>{ if(S) render(); });

function toggleChain(btn){
  // scroll the node into center and mark active
  document.querySelectorAll('.chain-node').forEach(n=>n.classList.remove('active'));
  btn.classList.add('active');
}

function doRestart(){
  if(!confirm('Restart the simulation? All decisions and scores will be reset.'))return;
  S=freshState();applyStoredTheme();save();render();
}

/* ---------- Theme ---------- */
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur? cur==='dark' : window.matchMedia('(prefers-color-scheme:dark)').matches;
  const next=isDark?'light':'dark';
  S.theme=next;document.documentElement.setAttribute('data-theme',next);save();render();
}
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);}
function applyStoredTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  el('toast-root').innerHTML=`<div class="toast">${svg(I.alertT)}<span>${msg}</span></div>`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el('toast-root').innerHTML='';},2600);
}

/* ---------- Boot ---------- */
(function boot(){
  S=freshState();       // always start fresh for a clean demo
  applyStoredTheme();
  render();
})();
</script>
</body>
</html>
