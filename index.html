<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Risk Chain, Adult Social Care Simulation</title>
<meta name="description" content="A team-based operational simulation on preventing choking incidents in adult supported living. Fictional proof of concept.">
<style>
/* ============================================================
   THE RISK CHAIN, design tokens
   Operational control centre for adult social care.
   Sans UI (Segoe/system) for the console; a serif carries the
   human voice (residents, families) to hold the tension between
   operational control and the person behind the record.
   ============================================================ */
:root{
  --ground:#e9edf0; --surface:#fdfefe; --surface-2:#f2f6f7; --surface-3:#e7eef0;
  --ink:#15212e; --ink-2:#3a4b5a; --ink-3:#5a6b78; --ink-4:#6f7d88;
  --line:#d6dee3; --line-2:#e6ecef;
  --navy:#14324a; --navy-2:#1c4462; --navy-ink:#e8eef2;
  --teal:#2c7f8c; --teal-strong:#22656f; --teal-tint:#e3f0f1;
  --good:#3c8f63; --good-tint:#e6f2ea; --good-line:#bcdcc8;
  --warn:#bb8420; --warn-tint:#f8efd9; --warn-line:#e8d3a1;
  --bad:#b3453b; --bad-tint:#f7e6e3; --bad-line:#e6c0ba;
  --info:#3a6ea5; --info-tint:#e6eef7;
  --shadow:0 1px 2px rgba(20,40,60,.06),0 8px 24px rgba(20,40,60,.07);
  --shadow-lg:0 4px 12px rgba(20,40,60,.10),0 24px 48px rgba(20,40,60,.12);
  --r:10px; --r-sm:7px; --r-lg:16px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0c141c; --surface:#141f2a; --surface-2:#1a2836; --surface-3:#213141;
    --ink:#eef4f7; --ink-2:#c2ced7; --ink-3:#b0bec8; --ink-4:#93a2ad;
    --line:#28394a; --line-2:#20303f;
    --navy:#0a1822; --navy-2:#123049; --navy-ink:#e8eef2;
    --teal:#4db4c2; --teal-strong:#3d9aa7; --teal-tint:#123138;
    --good:#5cb185; --good-tint:#12291f; --good-line:#25503a;
    --warn:#d6a544; --warn-tint:#2c2410; --warn-line:#524316;
    --bad:#d5695d; --bad-tint:#2c1613; --bad-line:#552b25;
    --info:#6ea0d6; --info-tint:#122031;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.36);
    --shadow-lg:0 6px 18px rgba(0,0,0,.4),0 28px 56px rgba(0,0,0,.5);
  }
}
:root[data-theme="light"]{
  --ground:#e9edf0; --surface:#fdfefe; --surface-2:#f2f6f7; --surface-3:#e7eef0;
  --ink:#15212e; --ink-2:#3a4b5a; --ink-3:#5a6b78; --ink-4:#6f7d88;
  --line:#d6dee3; --line-2:#e6ecef;
  --navy:#14324a; --navy-2:#1c4462; --navy-ink:#e8eef2;
  --teal:#2c7f8c; --teal-strong:#22656f; --teal-tint:#e3f0f1;
  --good:#3c8f63; --good-tint:#e6f2ea; --good-line:#bcdcc8;
  --warn:#bb8420; --warn-tint:#f8efd9; --warn-line:#e8d3a1;
  --bad:#b3453b; --bad-tint:#f7e6e3; --bad-line:#e6c0ba;
  --info:#3a6ea5; --info-tint:#e6eef7;
  --shadow:0 1px 2px rgba(20,40,60,.06),0 8px 24px rgba(20,40,60,.07);
  --shadow-lg:0 4px 12px rgba(20,40,60,.10),0 24px 48px rgba(20,40,60,.12);
}
:root[data-theme="dark"]{
  --ground:#0c141c; --surface:#141f2a; --surface-2:#1a2836; --surface-3:#213141;
  --ink:#e9f0f4; --ink-2:#b3c2cd; --ink-3:#8494a1; --ink-4:#5f6f7c;
  --line:#28394a; --line-2:#20303f;
  --navy:#0a1822; --navy-2:#123049; --navy-ink:#e8eef2;
  --teal:#4db4c2; --teal-strong:#3d9aa7; --teal-tint:#123138;
  --good:#5cb185; --good-tint:#12291f; --good-line:#25503a;
  --warn:#d6a544; --warn-tint:#2c2410; --warn-line:#524316;
  --bad:#d5695d; --bad-tint:#2c1613; --bad-line:#552b25;
  --info:#6ea0d6; --info-tint:#122031;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.36);
  --shadow-lg:0 6px 18px rgba(0,0,0,.4),0 28px 56px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
/* Safe default size for inline icon SVGs (those without an explicit width attribute).
   Placed early so specific component rules below win on equal-specificity ties. */
svg:not([width]){width:1.1em;height:1.1em;flex:none}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:4px}
::selection{background:var(--teal);color:#fff}
.tnum{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* Top console bar */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--navy);color:var(--navy-ink);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;letter-spacing:-.01em}
.brand .mark{width:30px;height:30px;flex:none}
.brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(232,238,242,.6);margin-top:1px}
.topbar-spacer{flex:1}
.ghost-btn{
  background:rgba(255,255,255,.07);color:var(--navy-ink);border:1px solid rgba(255,255,255,.14);
  padding:7px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;
  transition:background .15s;
}
.ghost-btn:hover{background:rgba(255,255,255,.15)}
.ghost-btn svg{width:15px;height:15px}

/* Round stepper — a "level map" of the six rounds. Numbered nodes,
   a glowing YOU-ARE-HERE current node, ticked past rounds, padlocked
   future rounds, joined by a track that lights up as you progress. */
.stepper{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:12px 0}
.stepper-lead{display:inline-flex;align-items:center;gap:7px;flex:none;margin-right:14px;padding:6px 12px;border-radius:100px;background:var(--surface-2);border:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.stepper-lead svg{width:15px;height:15px;color:var(--teal-strong)}
.step{display:flex;align-items:center;gap:9px;padding:5px 4px}
.step .dot{
  width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:800;background:var(--surface-3);color:var(--ink-3);border:2px solid var(--line);
  transition:transform .2s,box-shadow .3s;
}
.step .lbl{font-size:12.5px;color:var(--ink-3);font-weight:600;max-width:118px;line-height:1.2}
.step.done .dot{background:linear-gradient(145deg,var(--g-green),#0e7a3c);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(18,161,80,.4)}
.step.done .lbl{color:var(--ink-2)}
.step.active .dot{background:linear-gradient(145deg,var(--teal),var(--teal-strong));color:#fff;border-color:transparent;transform:scale(1.14);box-shadow:0 0 0 4px var(--teal-tint),0 4px 16px rgba(44,180,194,.55)}
.step.active .lbl{color:var(--ink);font-weight:750}
.step.active .lbl-now{display:inline-block;margin-left:7px;padding:1px 8px;border-radius:100px;background:var(--teal);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.lbl-now{display:none}
.step.locked{opacity:.5}
.step.locked .dot{background:transparent}
.step-link{flex:1;height:2.5px;border-radius:100px;background:var(--line);min-width:16px;max-width:44px;margin:0 2px}
.step-link.done{background:linear-gradient(90deg,var(--g-green),var(--teal))}
@media(max-width:900px){.step .lbl{display:none}.stepper-lead{margin-right:8px}.step-link{min-width:8px}}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px 22px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-strong)}
.muted{color:var(--ink-3)}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:var(--teal);color:#fff;border:1px solid var(--teal);
  padding:12px 22px;border-radius:var(--r-sm);font-size:15px;font-weight:600;
  box-shadow:0 1px 2px rgba(20,40,60,.12);transition:transform .12s,background .15s,box-shadow .15s;
}
.btn:hover{background:var(--teal-strong);border-color:var(--teal-strong);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn svg{width:18px;height:18px}
.btn-lg{padding:15px 30px;font-size:16px}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-secondary:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn-navy{background:var(--navy-2);border-color:var(--navy-2)}
.btn-navy:hover{background:var(--navy);border-color:var(--navy)}

/* Chips / tags */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;border:1px solid transparent;letter-spacing:.01em}
.chip svg{width:13px;height:13px}
.chip-reliable{background:var(--good-tint);color:var(--good);border-color:var(--good-line)}
.chip-incomplete{background:var(--warn-tint);color:var(--warn);border-color:var(--warn-line)}
.chip-outdated{background:var(--surface-3);color:var(--ink-3);border-color:var(--line)}
.chip-ambiguous{background:var(--info-tint);color:var(--info);border-color:transparent}
.chip-contradictory{background:var(--bad-tint);color:var(--bad);border-color:var(--bad-line)}
.chip-teal{background:var(--teal-tint);color:var(--teal-strong)}
.chip-cost{background:var(--navy);color:var(--navy-ink);font-variant-numeric:tabular-nums}
.chip-free{background:var(--good-tint);color:var(--good);border-color:var(--good-line)}

/* ---------- Layout: dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
@media(max-width:940px){.dash-grid{grid-template-columns:1fr}}
.col-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.col-side{display:flex;flex-direction:column;gap:18px;position:sticky;top:74px}
@media(max-width:940px){.col-side{position:static}}

/* ---------- Console: full-height, tabbed, minimal-scroll dashboard ---------- */
#app.is-console{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.is-console .topbar{position:static;flex:none}
.is-console .foot{display:none}
.console-main{flex:1;min-height:0;width:100%;max-width:var(--maxw);margin:0 auto;padding:12px 22px 16px;display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:stretch}
.console-col{display:flex;flex-direction:column;min-height:0}
.console-rail{display:flex;flex-direction:column;min-height:0}
.rail-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:3px}
.rail-submit{flex:none;padding-top:13px;display:flex;flex-direction:column;gap:11px}
.clock-strip{flex:none;margin-bottom:13px}
.tabbar{display:flex;gap:2px;flex:none;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:11px 17px;font-size:14.5px;font-weight:600;color:var(--ink-3);border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--teal-strong);border-bottom-color:var(--teal)}
.tab svg{width:19px;height:19px}
.tab .tcount{font-size:11px;font-weight:700;background:var(--surface-3);color:var(--ink-2);border-radius:100px;padding:1px 8px;min-width:21px;text-align:center;font-variant-numeric:tabular-nums}
.tab.active .tcount{background:var(--teal-tint);color:var(--teal-strong)}
.tabpanel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:8px;display:flex;flex-direction:column;gap:13px}
.tabpanel::-webkit-scrollbar{width:10px}
.tabpanel::-webkit-scrollbar-thumb,.rail-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:100px}
.tabpanel::-webkit-scrollbar-track,.rail-scroll::-webkit-scrollbar-track{background:transparent}
.rail-scroll::-webkit-scrollbar{width:8px}
@media(max-width:940px){
  #app.is-console{height:auto;overflow:visible}
  .is-console .topbar{position:sticky}
  .is-console .foot{display:block}
  .console-main{grid-template-columns:1fr;height:auto}
  .rail-scroll,.tabpanel{overflow:visible;min-height:auto}
}

/* Section head */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.sec-head h3{font-size:16px}
.sec-title-ico{display:flex;align-items:center;gap:9px}
.sec-title-ico svg{width:21px;height:21px;color:var(--teal-strong)}

/* KPI strip */
.kpi-panel{padding:16px 18px}
.kpi-panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:14px;font-weight:700}
.kpi-row{display:flex;flex-direction:column;gap:13px}
.kpi{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.kpi .k-name{font-size:13px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .k-name .warn-ico{color:var(--warn)}
.kpi .k-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k-bar{grid-column:1/-1;height:7px;border-radius:100px;background:var(--surface-3);overflow:hidden;position:relative}
.kpi .k-fill{height:100%;border-radius:100px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.kpi .k-delta{font-size:11.5px;font-weight:700;grid-column:2;justify-self:end;font-variant-numeric:tabular-nums}
.k-good{color:var(--good)} .k-warn{color:var(--warn)} .k-bad{color:var(--bad)} .k-flat{color:var(--ink-4)}
.f-good{background:var(--good)} .f-warn{background:var(--warn)} .f-bad{background:var(--bad)} .f-teal{background:var(--teal)}

/* Prevention capability */
.prev-cap{display:flex;align-items:center;gap:16px;padding:16px 18px;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);border-radius:var(--r);border:1px solid rgba(255,255,255,.06)}
.prev-ring{position:relative;width:74px;height:74px;flex:none}
.prev-ring svg{transform:rotate(-90deg)}
.prev-ring .pv{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.prev-cap .pc-txt small{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(232,238,242,.9);font-weight:700}
.prev-cap .pc-txt h4{font-size:16px;margin-top:2px}
.prev-cap .pc-txt p{font-size:12.5px;color:rgba(233,240,244,.9);margin-top:4px;line-height:1.4}

/* Attention meter */
.attn{padding:16px 18px}
.attn .a-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.attn .a-top h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:7px}
.attn .a-top h3 svg{width:15px;height:15px;color:var(--teal-strong)}
.attn .a-count{font-size:14px;font-weight:700}
.pips{display:flex;gap:6px}
.pip{flex:1;height:11px;border-radius:3px;background:var(--surface-3);border:1px solid var(--line);transition:background .2s}
.pip.used{background:var(--teal);border-color:var(--teal)}
.pip.over{background:var(--bad);border-color:var(--bad)}
.attn .a-note{font-size:12px;color:var(--ink-3);margin-top:10px}

/* Status banner */
.status-banner{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.status-banner .s-ava{width:56px;height:56px;border-radius:50%;flex:none;background:var(--teal-tint);color:var(--teal-strong);display:grid;place-items:center;font-weight:700;font-size:19px;border:1px solid var(--line);overflow:hidden}
.status-banner .s-ava img{width:100%;height:100%;object-fit:cover;display:block}
.status-banner .s-ava.s-ava-lg{width:112px;height:112px;font-size:34px;box-shadow:0 6px 20px rgba(8,16,24,.28);border:3px solid var(--surface)}
.status-banner .s-body h4{font-size:15px}
.status-banner .s-body .s-meta{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.status-banner .s-body p{font-size:13.5px;color:var(--ink-2);margin-top:7px}
.status-flag{margin-left:auto;align-self:center}

/* Alerts */
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);border:1px solid;font-size:13.5px}
.alert svg{width:21px;height:21px;flex:none;margin-top:1px}
.alert-amber{background:var(--warn-tint);border-color:var(--warn-line);color:var(--ink)}
.alert-amber svg{color:var(--warn)}
.alert-red{background:var(--bad-tint);border-color:var(--bad-line);color:var(--ink)}
.alert-red svg{color:var(--bad)}
.alert-info{background:var(--info-tint);border-color:transparent;color:var(--ink)}
.alert-info svg{color:var(--info)}
.alert b{font-weight:650}

/* Info source cards */
.src-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.src-grid{grid-template-columns:1fr}}
.src{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;display:flex;flex-direction:column;gap:9px;transition:border-color .15s,box-shadow .15s,transform .12s;width:100%;color:inherit;position:relative;
}
.src:hover{border-color:var(--teal);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.src.opened{border-color:var(--good-line);background:var(--surface)}
.src .s-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.src .s-ico{width:62px;height:62px;border-radius:15px;background:linear-gradient(150deg,var(--teal-tint),var(--surface-2));display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.src .s-ico svg{width:34px;height:34px;color:var(--teal-strong)}
.src.opened .s-ico{background:linear-gradient(150deg,var(--good-tint),var(--surface-2))}
.src.opened .s-ico svg{color:var(--good)}
.src h4{font-size:15.5px;line-height:1.22;font-weight:650;letter-spacing:-.01em}
.src .s-src{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.src .s-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.src .s-teaser{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.src .opened-mark{display:none;align-items:center;gap:5px;font-size:11.5px;font-weight:650;color:var(--good)}
.src .opened-mark svg{width:14px;height:14px}
.src.opened .opened-mark{display:inline-flex}
.src.opened .s-open-cost{display:none}

/* Action cards */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:9px;align-content:start}
.act{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;color:inherit;
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:11px 13px;transition:border-color .15s,background .15s,box-shadow .15s;position:relative;
}
.act:hover{border-color:var(--ink-3);box-shadow:var(--shadow)}
.act.sel{border-color:var(--teal);background:var(--teal-tint);box-shadow:0 0 0 1px var(--teal) inset}
.act.disabled{opacity:.5;cursor:not-allowed}
/* Prominent, colour-coded category icon */
.act .a-ico{width:54px;height:54px;border-radius:14px;flex:none;display:grid;place-items:center;position:relative}
.act .a-ico svg{width:30px;height:30px}
.act .a-checkdot{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;border:2.5px solid var(--surface)}
.act.sel .a-checkdot{border-color:var(--teal-tint)}
.act .a-checkdot svg{width:12px;height:12px}
.cat-decision{background:var(--surface-3);color:var(--ink-2)}
.cat-control{background:var(--teal-tint);color:var(--teal-strong)}
.cat-escalation{background:var(--warn-tint);color:var(--warn)}
.cat-communication{background:var(--info-tint);color:var(--info)}
.cat-practical{background:var(--good-tint);color:var(--good)}
.cat-risk{background:var(--info-tint);color:var(--info)}
.act .a-main{flex:1;min-width:0;padding-top:1px}
.act .a-title{font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.25;letter-spacing:-.005em}
.act .a-blurb{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-height:920px){.act .a-blurb{-webkit-line-clamp:1;line-clamp:1}}
.act .a-cat{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* Modal */
.modal-scrim{position:fixed;inset:0;background:rgba(12,24,36,.55);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:22px;animation:fade .2s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.modal-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:17px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;z-index:2}
.modal-head .mh-src{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-body{padding:20px 22px}
.record{font-size:14px;line-height:1.62}
.record p{margin-bottom:11px}
.record .field{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.record .field .fl{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:1px}
.record .field .fv{font-size:14px}
.record .quote{font-family:var(--serif);font-size:15.5px;line-height:1.6;font-style:italic;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:6px 0}
.record .msg{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-family:var(--serif);font-size:15px;line-height:1.6}
.record .msg .from{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-bottom:8px;font-style:normal;display:flex;align-items:center;justify-content:space-between}
.insight{margin-top:16px;background:var(--teal-tint);border:1px solid var(--teal-tint);border-radius:var(--r);padding:13px 15px;font-size:13.5px;display:flex;gap:10px}
.insight svg{width:17px;height:17px;color:var(--teal-strong);flex:none;margin-top:1px}
.icon-x{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:none}
.icon-x svg{width:17px;height:17px}
.icon-x:hover{background:var(--surface-3)}

/* Narrative / prose blocks */
.prose{max-width:66ch}
.prose p{margin-bottom:14px;color:var(--ink-2);font-size:15.5px}
.lead{font-size:18px;color:var(--ink);line-height:1.5}
.hero{padding:54px 0 40px}
.hero .kick{margin-bottom:18px}
.display{font-size:clamp(34px,6vw,60px);font-weight:700;letter-spacing:-.025em;line-height:1.02}
.display .l2{color:var(--teal-strong);display:block}
.subline{font-family:var(--serif);font-size:clamp(17px,2.4vw,21px);color:var(--ink-2);margin-top:18px;font-style:italic}
.hero-cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Consequence reveal */
.reveal-head{background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);border-radius:var(--r-lg);padding:26px 26px;border:1px solid rgba(255,255,255,.06)}
.reveal-head .eyebrow{color:var(--teal)}
.reveal-head h2{font-size:23px;margin-top:8px}
.reveal-head p{color:rgba(232,238,242,.82);margin-top:10px;font-size:15px;max-width:64ch}
.feed{display:flex;flex-direction:column;gap:11px}
.feed-item{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.feed-item .fi-ico{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center}
.feed-item .fi-ico svg{width:21px;height:21px}
.fi-good .fi-ico{background:var(--good-tint)} .fi-good .fi-ico svg{color:var(--good)}
.fi-warn .fi-ico{background:var(--warn-tint)} .fi-warn .fi-ico svg{color:var(--warn)}
.fi-bad .fi-ico{background:var(--bad-tint)} .fi-bad .fi-ico svg{color:var(--bad)}
.fi-info .fi-ico{background:var(--info-tint)} .fi-info .fi-ico svg{color:var(--info)}
.feed-item h4{font-size:14px}
.feed-item p{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.feed-item .fi-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:6px;display:inline-block}

.missed-box{border:1px solid var(--warn-line);background:var(--warn-tint);border-radius:var(--r);padding:18px 20px}
.missed-box .eyebrow{color:var(--warn)}
.missed-box h3{margin-top:6px;font-size:17px}
.missed-box p{margin-top:8px;color:var(--ink-2);font-size:14.5px}

.link-note{display:flex;gap:11px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-sm);background:var(--surface-2);border:1px dashed var(--line);font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.link-note svg{width:16px;height:16px;color:var(--teal-strong);flex:none;margin-top:2px}
.link-note b{color:var(--teal-strong)}

/* Round 3 clock / notifications */
.clock-bar{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--navy);color:var(--navy-ink);border-radius:var(--r);border:1px solid rgba(255,255,255,.07)}
.clock-face{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:1px}
.clock-bar .c-lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:rgba(232,238,242,.6);font-weight:700}
.clock-bar .c-run{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(232,238,242,.8)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pulse 1.6s infinite}
.notif-stack{display:flex;flex-direction:column;gap:9px}
.notif{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);animation:slidein .3s}
.notif .n-time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;padding-top:1px}
.notif .n-body{font-size:13.5px;flex:1}
.notif .n-body b{font-weight:650}
.notif .n-ico{width:16px;height:16px;flex:none;margin-top:1px}
.notif-amber{background:var(--warn-tint);border-color:var(--warn-line)} .notif-amber .n-ico{color:var(--warn)}
.notif-red{background:var(--bad-tint);border-color:var(--bad-line)} .notif-red .n-ico{color:var(--bad)}
.notif-info{background:var(--info-tint)} .notif-info .n-ico{color:var(--info)}
.notif .n-x{margin-left:6px;background:none;border:0;color:var(--ink-4);padding:2px;border-radius:5px;flex:none}
.notif .n-x:hover{background:var(--surface-3);color:var(--ink-2)}
.notif .n-x svg{width:14px;height:14px}

/* Risk chain */
.chain{position:relative;padding:6px 0}
.chain-track{display:flex;flex-direction:column;gap:2px}
.chain-node{display:grid;grid-template-columns:96px 30px 1fr;gap:0 14px;align-items:stretch;text-align:left;width:100%;background:none;border:0;color:inherit;padding:0}
.chain-node .cn-time{font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:right;padding:14px 0 0;font-variant-numeric:tabular-nums}
.chain-rail{display:flex;flex-direction:column;align-items:center}
.chain-rail .cn-line{width:2px;flex:1;background:var(--line);min-height:12px}
.chain-rail .cn-dot{width:18px;height:18px;border-radius:50%;flex:none;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);z-index:1;margin:2px 0}
.chain-node:first-child .cn-line:first-child{opacity:0}
.chain-node:last-child .cn-line:last-child{opacity:0}
.cn-card{margin:8px 0;padding:12px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s,box-shadow .15s;flex:1}
.chain-node:hover .cn-card{border-color:var(--ink-3);box-shadow:var(--shadow)}
.chain-node.active .cn-card{border-color:var(--teal);box-shadow:var(--shadow)}
.cn-card .cn-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px}
.cn-card h4{font-size:14px;margin-top:5px}
.cn-card .cn-detail{font-size:13px;color:var(--ink-2);margin-top:7px;line-height:1.5}
.dot-introduced{background:var(--bad)} .type-introduced{color:var(--bad)}
.dot-identified{background:var(--info)} .type-identified{color:var(--info)}
.dot-controlled{background:var(--good)} .type-controlled{color:var(--good)}
.dot-missed{background:var(--warn)} .type-missed{color:var(--warn)}
.dot-consequence{background:var(--ink-3)} .type-consequence{color:var(--ink-3)}
:root[data-theme="dark"] .type-consequence,:root:not([data-theme="light"]) .type-consequence{color:var(--ink-2)}
.chain-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.chain-legend .cl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.chain-legend .cl .sw{width:12px;height:12px;border-radius:50%}

/* Outcome banner */
.outcome{border-radius:var(--r-lg);padding:26px;border:1px solid;display:flex;gap:18px;align-items:flex-start}
.outcome .o-ico{width:52px;height:52px;border-radius:12px;flex:none;display:grid;place-items:center}
.outcome .o-ico svg{width:28px;height:28px}
.outcome h2{font-size:22px}
.outcome p{margin-top:8px;font-size:15px}
.outcome-good{background:var(--good-tint);border-color:var(--good-line)}
.outcome-good .o-ico{background:var(--good);color:#fff}
.outcome-mixed{background:var(--warn-tint);border-color:var(--warn-line)}
.outcome-mixed .o-ico{background:var(--warn);color:#fff}
.outcome-bad{background:var(--bad-tint);border-color:var(--bad-line)}
.outcome-bad .o-ico{background:var(--bad);color:#fff}

/* Summary metrics */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:760px){.metric-grid{grid-template-columns:repeat(2,1fr)}}
.metric{padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.metric .m-lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.metric .m-val{font-size:30px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.metric .m-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}

/* Preview cards */
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.preview-grid{grid-template-columns:1fr}}
.preview{padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);position:relative;overflow:hidden}
.preview .lock{position:absolute;top:16px;right:16px;color:var(--ink-4)}
.preview .lock svg{width:17px;height:17px}
.preview .p-round{font-size:12px;font-weight:700;color:var(--teal-strong);letter-spacing:.05em}
.preview h4{font-size:17px;margin-top:8px}
.preview p{font-size:13.5px;color:var(--ink-2);margin-top:9px;font-family:var(--serif);font-style:italic}
.preview .p-tag{margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-4);font-weight:700}

/* Progress dots on intro */
.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:start}
@media(max-width:820px){.two-col{grid-template-columns:1fr}}
.fact-list{display:flex;flex-direction:column;gap:0}
.fact{display:grid;grid-template-columns:28px 1fr;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
.fact:last-child{border-bottom:0}
.fact svg{width:18px;height:18px;color:var(--teal-strong);margin-top:1px}
.fact b{font-weight:650}

.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.info-tile{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.info-tile svg{width:18px;height:18px;color:var(--teal-strong);flex:none;margin-top:2px}
.info-tile h5{font-size:13.5px;font-weight:650}
.info-tile p{font-size:12.5px;color:var(--ink-3);margin-top:2px}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;background:var(--navy);color:var(--navy-ink);padding:12px 18px;border-radius:100px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:toastin .25s;border:1px solid rgba(255,255,255,.1)}
.toast svg{width:16px;height:16px;color:var(--warn)}

/* Footer */
.foot{margin-top:auto;padding:26px 0;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;background:var(--surface)}
.foot-in{max-width:var(--maxw);margin:0 auto;padding:0 22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}

/* Animations */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.rise-1{animation-delay:.05s}.rise-2{animation-delay:.12s}.rise-3{animation-delay:.19s}.rise-4{animation-delay:.26s}.rise-5{animation-delay:.33s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .kpi .k-fill{transition:none}
}

/* spacing helpers */
.stack{display:flex;flex-direction:column}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-22{gap:22px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-22{margin-top:22px}.mt-30{margin-top:30px}
.mb-16{margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.center{text-align:center}
.tag-legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* ---------- v2: prominent tabs (segmented control) ---------- */
.tabbar{display:inline-flex;gap:4px;flex:none;align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:5px;margin-bottom:6px;box-shadow:var(--shadow)}
.tab{background:none;border:0;border-radius:9px;padding:10px 18px;font-size:14.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:9px;cursor:pointer;transition:background .15s,color .15s;margin-bottom:0}
.tab:hover:not(.active){background:var(--surface-3);color:var(--ink)}
.tab.active{background:var(--teal-strong);color:#fff;border-bottom:0;box-shadow:0 1px 2px rgba(20,40,60,.18)}
.tab svg{width:19px;height:19px}
.tab .tcount{font-size:11px;font-weight:700;background:var(--surface-3);color:var(--ink-2);border-radius:100px;padding:1px 8px;min-width:21px;text-align:center;font-variant-numeric:tabular-nums}
.tab.active .tcount{background:rgba(255,255,255,.28);color:#fff}
/* In dark mode teal is a bright cyan — white text on it is low-contrast,
   so the active tab uses dark text instead. */
@media (prefers-color-scheme:dark){.tab.active{background:var(--teal);color:#05242c}.tab.active .tcount{background:rgba(0,0,0,.22);color:#05242c}.tab.active svg{color:#05242c}}
:root[data-theme="dark"] .tab.active{background:var(--teal);color:#05242c}
:root[data-theme="dark"] .tab.active .tcount{background:rgba(0,0,0,.22);color:#05242c}
:root[data-theme="dark"] .tab.active svg{color:#05242c}
/* Instruction banner — the "current objective" bar. Warm gold is the
   ONLY warm element in the whole UI, so it reads instantly as "do this
   now" and never blends into the cool navy panels or teal tabs. Glow +
   a slow shine sweep give it game-HUD presence. */
.tab-guide{flex:none;position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;font-size:14.5px;line-height:1.4;color:#2a1f06;font-weight:550;background:linear-gradient(100deg,#f2c14e 0%,#e5a231 55%,#d68f1c 100%);border:0;border-radius:14px;padding:15px 20px;margin:8px 0 16px;box-shadow:0 10px 30px rgba(224,160,40,.4),0 0 0 1px rgba(255,255,255,.25) inset,0 -8px 20px rgba(150,90,10,.25) inset}
.tab-guide svg{width:23px;height:23px;color:#3a2a08;flex:none;filter:drop-shadow(0 1px 1px rgba(255,255,255,.35))}
.tab-guide b{color:#1c1405;font-weight:800}
.tab-guide::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 5.5s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}80%,100%{left:130%}}

/* ---------- v2: time meter ---------- */
.timecard .tc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.timecard .tc-top h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:7px}
.timecard .tc-top h3 svg{width:15px;height:15px;color:var(--teal-strong)}
.timecard .tc-pct{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.timebar{height:12px;border-radius:100px;background:var(--surface-3);border:1px solid var(--line);overflow:hidden;position:relative}
.timebar .tb-fill{height:100%;border-radius:100px;transition:width .5s cubic-bezier(.2,.7,.2,1);background:linear-gradient(90deg,var(--teal),var(--teal-strong))}
.timebar .tb-fill.low{background:linear-gradient(90deg,var(--warn),#a8761c)}
.timebar .tb-fill.over{background:var(--bad)}
.timecard .tc-note{font-size:12.5px;color:var(--ink-2);margin-top:10px;line-height:1.45}
/* per-action / per-source time cost as segments */
.tcost{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tcost svg{width:13px;height:13px}
.tsegs{display:inline-flex;gap:2px;align-items:center}
.tseg{width:5px;height:12px;border-radius:1.5px;background:var(--line)}
.tseg.on{background:var(--teal)}
.tcost-free{color:var(--good)}
.a-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.a-ev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:100px}
.a-ev svg{width:13px;height:13px}
.ev-on{background:var(--good-tint);color:var(--good)}
.ev-off{background:var(--warn-tint);color:var(--warn)}
.act .a-title{align-items:center}
.src.capped{opacity:.55}
.src.capped:hover{border-color:var(--line);box-shadow:none;transform:none}

/* ---------- v2: media placeholders ---------- */
.media-ph{position:relative;border:1.5px dashed var(--line);border-radius:var(--r);background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 11px,var(--surface-3) 11px,var(--surface-3) 22px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-3);text-align:center;padding:18px;min-height:120px}
.media-ph svg{width:30px;height:30px;color:var(--ink-4)}
.media-ph .mp-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.media-ph .mp-sub{font-size:12px;color:var(--ink-4);max-width:34ch}
.media-ph.wide{aspect-ratio:16/9;min-height:0}
.media-ph.strip{flex-direction:row;min-height:0;padding:12px 16px;text-align:left;align-items:center;gap:14px}
.media-ph.strip svg{width:26px;height:26px}
.media-ph.strip>div{display:flex;flex-direction:column;gap:2px}
.media-ph.strip .mp-sub{max-width:none;font-size:11.5px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr;gap:24px}.hero-grid .media-ph{min-height:180px !important}}
.media-ph.portrait{aspect-ratio:3/4;min-height:0}
.media-ph .mp-badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--navy);color:var(--navy-ink);padding:3px 8px;border-radius:6px;opacity:.85}

/* ---------- v2: confidence chooser (in confirm modal) ---------- */
.conf-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.conf-opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:12px 12px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.conf-opt:hover{border-color:var(--ink-3)}
.conf-opt.sel{border-color:var(--teal);background:var(--teal-tint)}
.conf-opt h5{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;color:var(--ink)}
.conf-opt h5 svg{width:15px;height:15px;color:var(--teal-strong)}
.conf-opt p{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.confirm-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.confirm-line{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;padding:8px 0;border-bottom:1px dashed var(--line)}
.confirm-line:last-child{border-bottom:0}
.confirm-line svg{width:16px;height:16px;flex:none;margin-top:2px}
.confirm-line.ok svg{color:var(--good)} .confirm-line.warn svg{color:var(--warn)}
.confirm-stat{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 2px}
.confirm-stat .cs{font-size:12.5px;color:var(--ink-2)} .confirm-stat .cs b{font-size:16px;color:var(--ink);display:block;font-variant-numeric:tabular-nums}

/* ---------- v2: blind / acted-on-assumption callout ---------- */
.blind-box{border:1px solid var(--bad-line);background:var(--bad-tint);border-radius:var(--r);padding:16px 18px}
.blind-box .eyebrow{color:var(--bad)}
.blind-box h3{margin-top:6px;font-size:16px}
.blind-box ul{margin:10px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.blind-box li{font-size:13.5px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start}
.blind-box li svg{width:16px;height:16px;color:var(--bad);flex:none;margin-top:2px}
.conf-note{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:100px;padding:5px 12px}
.conf-note svg{width:14px;height:14px;color:var(--teal-strong)}

/* ---------- v2: between-round bridge ---------- */
.bridge-wrap{max-width:640px;margin:0 auto;padding:60px 0 40px;text-align:center}
.bridge-tick{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-strong);background:var(--teal-tint);padding:7px 15px;border-radius:100px;margin-bottom:22px}
.bridge-tick svg{width:15px;height:15px}
.bridge-wrap h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.02em}
.bridge-wrap .b-body{font-size:17px;color:var(--ink-2);line-height:1.6;margin-top:18px;text-align:left}
.bridge-status{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--warn-tint);border:1px solid var(--warn-line);border-radius:var(--r);padding:15px 18px;margin-top:24px}
.bridge-status svg{width:19px;height:19px;color:var(--warn);flex:none;margin-top:1px}
.bridge-status p{font-size:14px;color:var(--ink-2)}
.bridge-thread{display:flex;flex-direction:column;gap:8px;margin-top:22px;text-align:left}
.bridge-thread .bt{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px}
.bridge-thread .bt svg{width:16px;height:16px;color:var(--teal-strong);flex:none}

/* ---------- v3: wider console, better use of screen ---------- */
#app.is-console .topbar-in,#app.is-console .topbar .wrap{max-width:1500px}
.console-main{max-width:1500px}
/* Records flow into as many columns as fit, so wide screens fill up */
.src-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
/* compact selection status above the submit button (replaces the bottom instruction box) */
.submit-status{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:0 2px 2px}
.submit-status .ss-count{color:var(--ink)}
.submit-status .ss-over{color:var(--bad)}

/* ---------- v3: modal legibility (stands out from the background; visible close) ---------- */
.modal-scrim{background:rgba(4,9,14,.74);backdrop-filter:blur(4px)}
.modal{background:var(--surface-2);border:1px solid var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.28),0 30px 70px rgba(0,0,0,.55)}
.modal-head{background:var(--surface-2)}
:root[data-theme="dark"] .modal,:root:not([data-theme="light"]) .modal{border-color:#39505f;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.7)}
:root[data-theme="light"] .modal{border-color:var(--line);box-shadow:0 0 0 1px rgba(20,40,60,.06),var(--shadow-lg)}
.icon-x{width:38px;height:38px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line);color:var(--ink);transition:background .15s,color .15s,border-color .15s}
.icon-x svg{width:20px;height:20px;color:currentColor}
.icon-x:hover{background:var(--bad-tint);border-color:var(--bad-line);color:var(--bad)}

/* ---------- v4: scene image (Meadow View) ---------- */
.scene-img{width:100%;border-radius:var(--r);border:1px solid var(--line);object-fit:cover;display:block;box-shadow:var(--shadow)}
.scene-band{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.scene-band img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:55% 42%;animation:kenburns 24s ease-in-out infinite alternate;will-change:transform}
@keyframes kenburns{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.18) translate(-2.4%,-1.8%)}}
@media(prefers-reduced-motion:reduce){.scene-band img{animation:none;transform:none}}
.scene-band .sb-cap{position:absolute;left:0;right:0;bottom:0;padding:20px 18px 12px;background:linear-gradient(to top,rgba(8,16,24,.72),transparent);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.scene-band .sb-cap svg{width:15px;height:15px}
.scene-band .scene-fb{display:none;position:absolute;inset:0;align-items:center;justify-content:center;gap:12px;color:var(--ink-3);padding:14px;text-align:left}
.scene-band .scene-fb svg{width:28px;height:28px;color:var(--ink-4);flex:none}
.scene-band.img-failed{border-style:dashed;background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 11px,var(--surface-3) 11px,var(--surface-3) 22px)}
.scene-band.img-failed img,.scene-band.img-failed .sb-cap{display:none}
.scene-band.img-failed .scene-fb{display:flex}

/* ---------- v4: development report (document, downloadable as PDF) ---------- */
.report-actions{display:flex;justify-content:space-between;gap:12px;max-width:840px;margin:0 auto 16px;flex-wrap:wrap}
.report-doc{background:#ffffff;color:#25303c;max-width:840px;margin:0 auto;padding:52px 56px;border-radius:14px;box-shadow:var(--shadow-lg);font-size:14px;line-height:1.62}
.report-doc .r-brand{display:flex;align-items:center;gap:11px;color:#14324a}
.report-doc .r-brand svg{width:30px;height:30px}
.report-doc .r-brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.report-doc .r-brand small{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#6c7c8a;font-weight:700;margin-top:2px}
.report-doc h1{font-size:27px;letter-spacing:-.02em;color:#14324a;margin-top:22px}
.report-doc .r-sub{font-size:15px;color:#5a6875;margin-top:6px;font-family:var(--serif);font-style:italic}
.report-doc .r-meta{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:16px;padding:14px 0;border-top:1px solid #e6ecf0;border-bottom:1px solid #e6ecf0;font-size:12.5px;color:#5a6875}
.report-doc .r-meta b{color:#25303c;font-weight:650}
.report-doc .r-section{margin-top:30px;break-inside:avoid}
.report-doc .r-section h2{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#22656f;padding-bottom:8px;border-bottom:2px solid #e6ecf0;margin-bottom:14px}
.report-doc .r-outcome{display:flex;gap:15px;align-items:flex-start;padding:16px 18px;border-radius:11px;border:1px solid #e2e8ec;background:#f6f9fa}
.report-doc .r-outcome .ro-ico{width:46px;height:46px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff}
.report-doc .r-outcome .ro-ico svg{width:26px;height:26px}
.report-doc .r-outcome h3{font-size:18px;color:#14324a}
.report-doc .r-outcome p{color:#41505f;font-size:13.5px;margin-top:5px}
.ro-good{background:#3c8f63} .ro-mixed{background:#bb8420} .ro-bad{background:#b3453b}
.report-doc .r-scores{display:grid;grid-template-columns:1fr 1fr;gap:2px 40px}
.report-doc .r-score{display:grid;grid-template-columns:1fr auto auto;gap:2px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid #eef2f4}
.report-doc .r-score .rs-name{font-size:13px;color:#41505f}
.report-doc .r-score .rs-val{font-size:15px;font-weight:700;color:#14324a;font-variant-numeric:tabular-nums}
.report-doc .r-score .rs-chg{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rs-up{color:#3c8f63} .rs-down{color:#b3453b} .rs-flat{color:#95a3ae}
.report-doc .r-bigscore{display:flex;align-items:center;gap:18px;padding:6px 0 2px}
.report-doc .r-bigscore .rb-num{font-size:44px;font-weight:800;color:#14324a;letter-spacing:-.02em;line-height:1}
.report-doc .r-bigscore .rb-txt small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6c7c8a;font-weight:700}
.report-doc .r-bigscore .rb-txt p{font-size:13px;color:#5a6875;margin-top:3px}
.report-doc .r-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f0f4f6}
.report-doc .r-item:last-child{border-bottom:0}
.report-doc .r-item .ri-ico{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;margin-top:1px}
.report-doc .r-item .ri-ico svg{width:16px;height:16px}
.ri-good{background:#e6f2ea;color:#3c8f63} .ri-dev{background:#f8efd9;color:#bb8420}
.report-doc .r-item h4{font-size:13.5px;color:#14324a;font-weight:650}
.report-doc .r-item p{font-size:12.5px;color:#5a6875;margin-top:2px}
.report-doc .r-rounds{display:flex;flex-direction:column;gap:12px}
.report-doc .r-round{padding:12px 14px;border:1px solid #e6ecf0;border-radius:9px;background:#fbfcfd}
.report-doc .r-round .rr-h{font-size:12.5px;font-weight:700;color:#14324a;display:flex;justify-content:space-between;gap:10px}
.report-doc .r-round .rr-conf{font-size:11px;color:#6c7c8a;font-weight:600;text-transform:capitalize}
.report-doc .r-round ul{margin:8px 0 0;padding-left:17px;font-size:12.5px;color:#41505f}
.report-doc .r-round li{margin-bottom:2px}
.report-doc .r-foot{margin-top:34px;padding-top:16px;border-top:1px solid #e6ecf0;font-size:11px;color:#8695a1}
.report-doc .r-two{display:grid;grid-template-columns:1fr 1fr;gap:34px}
@media(max-width:720px){.report-doc{padding:32px 24px}.report-doc .r-two,.report-doc .r-scores{grid-template-columns:1fr;gap:12px}}

/* ---------- v4: guided walkthrough (numbered) ---------- */
.walk{max-width:600px}
.walk .w-head{padding:20px 24px 6px}
.walk .w-head .eyebrow{color:var(--teal-strong)}
.walk .w-head h3{font-size:20px;margin-top:6px}
.walk .w-head p{font-size:13.5px;color:var(--ink-3);margin-top:6px}
.walk .w-steps{padding:8px 24px 4px;display:flex;flex-direction:column;gap:10px}
.walk-step{display:flex;gap:14px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.walk-step .ws-num{width:30px;height:30px;border-radius:50%;flex:none;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.walk-step .ws-b h4{font-size:14.5px;display:flex;align-items:center;gap:8px}
.walk-step .ws-b h4 svg{width:17px;height:17px;color:var(--teal-strong)}
.walk-step .ws-b p{font-size:13px;color:var(--ink-2);margin-top:3px}
.walk .w-foot{padding:14px 24px 20px;display:flex;justify-content:flex-end;gap:12px;border-top:1px solid var(--line);margin-top:8px}

/* ---------- v4: print / PDF ---------- */
@media print{
  body{background:#fff}
  .topbar,.foot,.report-actions,#modal-root,#toast-root{display:none !important}
  #app{height:auto !important;overflow:visible !important;display:block !important}
  main.wrap{padding:0 !important}
  .report-doc{box-shadow:none;border-radius:0;max-width:100%;padding:0}
  @page{margin:15mm}
}

/* ---------- v4: first-use coach tour (spotlight + anchored pop-ups) ---------- */
.tour{position:fixed;inset:0;z-index:90}
.tour-block{position:fixed;inset:0}
.tour-spot{position:fixed;border-radius:12px;border:2px solid var(--teal);box-shadow:0 0 0 100vmax rgba(6,12,20,.68);transition:top .28s cubic-bezier(.2,.8,.2,1),left .28s cubic-bezier(.2,.8,.2,1),width .28s,height .28s;pointer-events:none}
.tour-pop{position:fixed;width:312px;max-width:calc(100vw - 24px);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 0 0 1px rgba(255,255,255,.05),0 24px 60px rgba(0,0,0,.55);padding:16px 17px;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
:root[data-theme="light"] .tour-pop,:root:not([data-theme="dark"]) .tour-pop{box-shadow:0 0 0 1px rgba(20,40,60,.06),var(--shadow-lg)}
.tour-pop .tp-num{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-strong)}
.tour-pop h4{font-size:16px;margin-top:8px;display:flex;align-items:center;gap:8px}
.tour-pop h4 svg{width:19px;height:19px;color:var(--teal-strong)}
.tour-pop p{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.tour-pop .tp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px}
.tour-pop .tp-dots{display:flex;gap:5px}
.tour-pop .tp-dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tour-pop .tp-dot.on{background:var(--teal)}
.tour-pop .tp-btns{display:flex;gap:8px}
.tour-btn{font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tour-btn:hover{background:var(--surface-3)}
.tour-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.tour-btn.primary:hover{background:var(--teal-strong)}
.tour-skip{background:none;border:0;color:var(--ink-3);font-size:12.5px;cursor:pointer;padding:4px}
.tour-skip:hover{color:var(--ink)}
.tour-pop .tp-arrow{position:absolute;width:14px;height:14px;background:var(--surface-2);border:1px solid var(--line);transform:rotate(45deg)}
.tour-pop.pl-bottom .tp-arrow{top:-8px;border-right:0;border-bottom:0}
.tour-pop.pl-top .tp-arrow{bottom:-8px;border-left:0;border-top:0}
.tour-pop.pl-left .tp-arrow{right:-8px;top:26px;border-left:0;border-bottom:0}
.tour-pop.pl-right .tp-arrow{left:-8px;top:26px;border-right:0;border-top:0}

/* ============================================================
   v5: motion + a light gamified layer
   The palette stays institutional (this is adult social care, not
   an arcade). Engagement comes from timing at the emotional beats
   and a little dimensional polish: glow, gloss, count-up, pop.
   A single warm "points" gold is used sparingly as a reward accent.
   ============================================================ */
:root{--accent:#c68a1e;--accent-tint:#f6ecd4}
@media (prefers-color-scheme:dark){:root{--accent:#e6b64c;--accent-tint:#2b2411}}
:root[data-theme="light"]{--accent:#c68a1e;--accent-tint:#f6ecd4}
:root[data-theme="dark"]{--accent:#e6b64c;--accent-tint:#2b2411}

/* Prevention Capability = the running "score". Animated ring sweep, soft
   glow, a metallic value read-out, and a gold reward label. */
.prev-ring .prev-arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px currentColor)}
/* overflow stays visible so the ring's glow isn't clipped at the card edge */
.prev-cap{position:relative;overflow:visible}
.prev-ring,.prev-ring svg{overflow:visible}
.prev-cap::after{content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;background:radial-gradient(140px 90px at 14% 26%,rgba(255,255,255,.07),transparent 70%)}
.prev-ring .pv{background:linear-gradient(180deg,#fff,rgba(255,255,255,.68));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em}
.prev-cap .pc-txt small{color:var(--accent)}

/* KPI + time bars: give the fills a glossy, "meter"-like read so the rail
   feels alive without changing hue. */
.kpi .k-fill,.timebar .tb-fill{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.09)}
.pip.used{box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}

/* KPI change flash on the consequence reveal — draws the eye to what moved,
   tinted in the direction of the change. */
@keyframes flashgood{0%,100%{box-shadow:0 0 0 0 transparent}28%{box-shadow:0 0 0 5px var(--good-tint)}}
@keyframes flashbad{0%,100%{box-shadow:0 0 0 0 transparent}28%{box-shadow:0 0 0 5px var(--bad-tint)}}
.kpi.flash-good{animation:flashgood 1.5s ease-out;border-radius:8px}
.kpi.flash-bad{animation:flashbad 1.5s ease-out;border-radius:8px}

/* Selecting an action: a small tactile pop on the check dot. */
.act .a-checkdot{animation:dotpop .32s cubic-bezier(.2,1.5,.4,1) both}
@keyframes dotpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* Journey progress: the active step gently breathes. */
.step.active .dot{animation:steppulse 2.4s ease-in-out infinite}
@keyframes steppulse{0%,100%{box-shadow:0 0 0 4px var(--teal-tint)}50%{box-shadow:0 0 0 7px var(--teal-tint)}}

/* Risk chain assembling in, node by node. */
@keyframes chainpop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){
  .prev-ring .prev-arc{transition:none}
  .step.active .dot{animation:none}
  .act .a-checkdot{animation:none}
}

/* ============================================================
   v5.1: differentiation by fill, elevation and hue — NEVER by
   edge accents. No left-edge bars, no top strips, anywhere.
   Categories:
     INSTRUCTION  navy banner        (see the .tab-guide rule above)
     CONTENT      raised card, shadow (what you read / act on)
     INFO NOTE    blue-tinted fill    (helper / FYI)
     ALERT        amber/red fill      (something's wrong)
     METER        vivid RAG gauge
   ============================================================ */

/* Vivid gauge colours — the institutional --good/--bad are muted
   (brown-red, sage-green); the meters want a true RAG signal. */
:root{--g-red:#d32020;--g-amber:#f2a005;--g-green:#12a150;--teal-deep:#1c6470;}
@media (prefers-color-scheme:dark){:root{--g-red:#f0453f;--g-amber:#f5b431;--g-green:#28c46a;--teal-deep:#177483;}}
:root[data-theme="light"]{--g-red:#d32020;--g-amber:#f2a005;--g-green:#12a150;--teal-deep:#1c6470;}
:root[data-theme="dark"]{--g-red:#f0453f;--g-amber:#f5b431;--g-green:#28c46a;--teal-deep:#177483;}

/* ACCESSIBILITY — white text on the bright cyan teal fails WCAG AA
   (~2.2:1). Filled primary buttons use a deep teal so white passes
   (~5:1+). Bright teal stays for non-text accents (rings, icons). */
.btn{background:var(--teal-deep);border-color:var(--teal-deep)}
.btn:hover{background:var(--teal-deep);border-color:var(--teal-deep);filter:brightness(1.12)}

/* INSTRUCTION badge — a dark navy pill on the gold bar (high contrast,
   the inverse of the banner so it reads as a distinct "tag"). */
.guide-badge{
  display:inline-block;margin-right:10px;padding:4px 12px;border-radius:100px;
  background:var(--navy);color:#fff;font-size:11px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;vertical-align:1px;
  box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
}

/* CONTENT — cards/tiles must sit clearly ABOVE the dark background.
   Depth comes from a distinctly lighter surface gradient + real
   shadow + a top highlight — never an edge accent. */
:root{--card-top:#ffffff;--card-bot:#eef4f5;--card-line:#cfdadf;--card-hi:rgba(255,255,255,.7);--card-sh:0 1px 2px rgba(20,40,60,.06),0 12px 28px rgba(20,40,60,.11);}
@media (prefers-color-scheme:dark){:root{--card-top:#22333f;--card-bot:#16232f;--card-line:#374d61;--card-hi:rgba(255,255,255,.1);--card-sh:0 1px 2px rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.55);}}
:root[data-theme="light"]{--card-top:#ffffff;--card-bot:#eef4f5;--card-line:#cfdadf;--card-hi:rgba(255,255,255,.7);--card-sh:0 1px 2px rgba(20,40,60,.06),0 12px 28px rgba(20,40,60,.11);}
:root[data-theme="dark"]{--card-top:#22333f;--card-bot:#16232f;--card-line:#374d61;--card-hi:rgba(255,255,255,.1);--card-sh:0 1px 2px rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.55);}
.card,.src,.act{
  background:linear-gradient(180deg,var(--card-top),var(--card-bot));
  border:1px solid var(--card-line);
  box-shadow:var(--card-sh),inset 0 1px 0 var(--card-hi);
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .15s,background .15s;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
/* Rail readouts lift on hover too. */
.kpi-panel,.timecard,.prev-cap{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.kpi-panel:hover,.timecard:hover,.prev-cap:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}

/* ============================================================
   ELEMENT IDENTITIES — each type is a different KIND of object, so a
   glance tells you what it is and what to do with it:
     RECORDS   = warm "paper" files you REVIEW (parchment icon, folded
                 corner, warm panel). No pre-judged reliability — you
                 decide by reading source + date.
     DECISIONS = cool action TILES you SELECT (big colour-coded icon,
                 a real checkbox, a decisive lit-up selected state).
     ALERTS    = warnings (glowing severity medallion + title).
     INFO NOTE = a bright "intel" briefing you should read.
   ============================================================ */

/* RECORDS — warm paper files. A warm panel + parchment icon + a folded
   top corner make these read as documents, unmistakably different from
   the cool decision tiles beside them. */
.src{background:linear-gradient(180deg,#fffdf6,#f4efe2)}
@media (prefers-color-scheme:dark){.src{background:linear-gradient(180deg,#2c302c,#1e211d)}}
:root[data-theme="dark"] .src{background:linear-gradient(180deg,#2c302c,#1e211d)}
.src .s-ico{background:linear-gradient(150deg,#f2e9d3,#dbcca8);box-shadow:0 6px 16px rgba(60,45,15,.3),inset 0 1px 0 rgba(255,255,255,.6);border:0}
.src .s-ico svg{color:#6a5a33}
.src.opened .s-ico{background:linear-gradient(145deg,var(--g-green),#0e7a3c);box-shadow:0 6px 16px rgba(18,161,80,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.src.opened .s-ico svg{color:#fff}
.src:hover{border-color:var(--warn);transform:translateY(-3px);box-shadow:var(--card-sh),0 0 0 1px var(--warn),0 0 26px rgba(214,165,68,.25)}
.src .s-review-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:750;color:var(--ink);background:var(--surface-3);border:1px solid var(--line);transition:.15s}
.src .s-review-btn svg{width:16px;height:16px;color:var(--teal-strong)}
.src:hover .s-review-btn{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.src:hover .s-review-btn svg{color:#fff}
.src .s-reviewed{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:750;color:var(--good)}
.src .s-reviewed svg{width:15px;height:15px}
.src .s-foot{align-items:center}

/* DECISIONS — cool action tiles. Big colour-coded icon = type at a
   glance; a real checkbox top-right = "you tick these"; a decisive
   selected state (lit border, gradient wash, filled box, lift). */
.act{padding-right:50px}
.act .a-ico{box-shadow:0 5px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.28)}
.act .a-ico svg{color:#fff}
.a-ico.cat-decision{background:linear-gradient(145deg,#738596,#465268)}
.a-ico.cat-control{background:linear-gradient(145deg,#38c6d6,#1f7a86)}
.a-ico.cat-escalation{background:linear-gradient(145deg,#f4b13a,#c67d18)}
.a-ico.cat-communication{background:linear-gradient(145deg,#5aa0e6,#3462a5)}
.a-ico.cat-practical{background:linear-gradient(145deg,#45c078,#217a48)}
.a-ico.cat-risk{background:linear-gradient(145deg,#9179e6,#5a45a5)}
.act .a-cat{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.act .a-select{position:absolute;top:13px;right:13px;width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-4);background:transparent;display:grid;place-items:center;transition:.15s}
.act .a-select svg{width:15px;height:15px;color:#fff}
.act:hover .a-select{border-color:var(--teal)}
.act:hover{transform:translateY(-2px);box-shadow:var(--card-sh),0 0 0 1px var(--teal)}
.act.sel{border-color:var(--teal);background:linear-gradient(180deg,var(--teal-tint),transparent);box-shadow:0 0 0 2px var(--teal),0 10px 30px rgba(44,180,194,.32);transform:translateY(-2px)}
.act.sel .a-ico{transform:scale(1.05)}
.act.sel .a-select{background:var(--teal-deep);border-color:var(--teal-deep);transform:scale(1.12);box-shadow:0 0 14px rgba(44,180,194,.7)}

/* INFO NOTE — an "intel briefing": a bright filled medallion icon + a
   soft glow so the eye lands on it and reads "you should know this".
   Distinct from gold instructions and warm alerts. */
.link-note{background:linear-gradient(180deg,var(--info-tint),transparent);border:1px solid var(--info);box-shadow:0 6px 22px rgba(58,110,165,.2);color:var(--ink);gap:14px;align-items:center;padding:15px 18px}
.link-note svg{width:22px;height:22px;padding:9px;box-sizing:content-box;border-radius:11px;background:linear-gradient(145deg,#5aa0e6,#3462a5);color:#fff;box-shadow:0 5px 14px rgba(58,110,165,.45),inset 0 1px 0 rgba(255,255,255,.3);flex:none}
.link-note b{color:var(--info)}

/* DOSSIER — the situation card as a character briefing: the person is
   the hero (large photo with a glow ring), key facts as scannable
   bullets, and the scenario brief set as an editorial serif callout. */
.dossier-top{display:flex;gap:22px;align-items:flex-start}
.dossier-photo{flex:none;position:relative;align-self:flex-start}
.dossier-photo .s-ava{width:104px;height:104px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--teal-tint);color:var(--teal-strong);font-weight:700;font-size:32px;border:3px solid var(--surface);box-shadow:0 6px 20px rgba(8,16,24,.3)}
.dossier-photo .s-ava img{width:100%;height:100%;object-fit:cover;display:block}
.dossier-photo::after{content:"";position:absolute;inset:-3px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px var(--teal),0 0 22px rgba(44,180,194,.4)}
.dossier-id{flex:1;min-width:0}
.dossier-name{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.dossier-sub{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:650;color:var(--ink-3);margin-top:4px}
.dossier-sub svg{width:16px;height:16px;color:var(--teal-strong)}
.dossier-facts{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.dossier-facts li{position:relative;padding-left:24px;font-size:14px;color:var(--ink-2);line-height:1.4}
.dossier-facts li::before{content:"";position:absolute;left:3px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px rgba(44,180,194,.75)}
.dossier-chip{flex:none;align-self:flex-start}
.dossier-brief{margin:22px 0 0;padding:20px 24px 20px 26px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--serif);font-size:16.5px;line-height:1.62;color:var(--ink);position:relative;quotes:none}
.dossier-brief::before{content:"\201C";position:absolute;top:2px;left:12px;font-family:var(--serif);font-size:52px;line-height:1;color:var(--teal);opacity:.4}
@media(max-width:640px){.dossier-top{flex-wrap:wrap}.dossier-chip{order:-1}}

/* ALERTS — their own "warning module" identity: a filled, glowing icon
   medallion (colour = severity), a bold coloured title, and a tinted
   fill with a soft glow. Distinct from cards, notes and instructions. */
.alert{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:13px;border:1px solid;position:relative;overflow:hidden}
.alert .al-ico{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;box-shadow:0 5px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.28)}
.alert .al-ico svg{width:22px;height:22px;color:#fff}
.alert .al-body{font-size:13.5px;line-height:1.5;color:var(--ink-2);padding-top:1px}
.alert .al-body b{display:block;font-size:14.5px;font-weight:750;margin-bottom:3px}
.alert-amber{background:linear-gradient(180deg,var(--warn-tint),transparent);border-color:var(--warn-line);box-shadow:0 6px 20px rgba(187,132,32,.14)}
.alert-amber .al-ico{background:linear-gradient(145deg,#eeb54e,#c67d18)}
.alert-amber .al-body b{color:var(--warn)}
.alert-red{background:linear-gradient(180deg,var(--bad-tint),transparent);border-color:var(--bad-line);box-shadow:0 6px 20px rgba(179,69,59,.2)}
.alert-red .al-ico{background:linear-gradient(145deg,#e57264,#b3453b)}
.alert-red .al-body b{color:var(--bad)}
.alert-info{background:linear-gradient(180deg,var(--info-tint),transparent);border-color:transparent;box-shadow:0 6px 18px rgba(58,110,165,.14)}
.alert-info .al-ico{background:linear-gradient(145deg,#5f97d6,#3a6ea5)}
.alert-info .al-body b{color:var(--info)}

/* METERS — a SEGMENTED red→amber→green gauge (a crisp game stat bar,
   not a smeared gradient). The fill is a window onto a full-width RAG
   spectrum anchored to the track (100cqi) so a low value shows only the
   red end; a repeating mask cuts it into notches; the track carries the
   same notches so the whole thing reads as a segmented gauge. Inverted
   KPIs (exposure: high = bad) flip the spectrum. */
.kpi .k-bar{container-type:inline-size;height:10px;border-radius:4px;
  background-color:var(--surface-3);
  background-image:repeating-linear-gradient(90deg,transparent 0 13px,rgba(0,0,0,.24) 13px 17px);}
.kpi .k-fill{position:relative;overflow:hidden;border-radius:3px;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 13px,transparent 13px 17px);
  mask:repeating-linear-gradient(90deg,#000 0 13px,transparent 13px 17px);}
.kpi .k-fill::before{
  content:"";position:absolute;top:0;left:0;height:100%;width:100cqi;
  background:linear-gradient(90deg,var(--g-red) 0%,var(--g-amber) 50%,var(--g-green) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.15);
}
.kpi .k-fill.k-inv::before{
  background:linear-gradient(90deg,var(--g-green) 0%,var(--g-amber) 50%,var(--g-red) 100%);
}
@media(prefers-reduced-motion:reduce){.tab-guide svg,.tab-guide::after{animation:none}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="tour-root"></div>
<div id="toast-root"></div>

<script>
"use strict";
/* ============================================================
   THE RISK CHAIN, simulation engine
   Fictional POC. All people and organisations are invented.
   ============================================================ */

/* ---------- Icons (inline, no emoji) ---------- */
const I = {
  shield:'<path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5z"/>',
  heart:'<path d="M12 20s-7-4.6-9.2-9C1.3 8 2.6 4.5 6 4.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.4 0 4.7 3.5 3.2 6.5C19 15.4 12 20 12 20z"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.5A3 3 0 0 1 16 11M21 20c0-2.6-1.6-4.6-4-5.2"/>',
  badge:'<path d="M12 3 4 6v5c0 4.8 3.3 8.3 8 9.7 4.7-1.4 8-4.9 8-9.7V6z"/><path d="M9 11.5l2 2 4-4.5"/>',
  gauge:'<path d="M12 13l4-4"/><path d="M4 18a8 8 0 1 1 16 0"/><circle cx="12" cy="18" r="1.4"/>',
  alertT:'<path d="M12 3 2 20h20z"/><path d="M12 10v5"/><circle cx="12" cy="17.6" r=".2"/>',
  bell:'<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h4"/>',
  stethoscope:'<path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M6 3H4M14 3h2"/><path d="M10 13v3a4 4 0 0 0 8 0v-1"/><circle cx="18" cy="12" r="2"/>',
  pill:'<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(45 12 12)"/><path d="M8.5 8.5l7 7"/>',
  hospital:'<rect x="4" y="8" width="16" height="13" rx="1.5"/><path d="M9 21v-4h6v4"/><path d="M12 3v4M10 5h4"/>',
  message:'<path d="M4 5h16v11H9l-4 3z"/>',
  home:'<path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l3 2"/>',
  check:'<path d="M4 12.5 9 17.5 20 6.5"/>',
  checkSmall:'<path d="M5 12l4 4 10-11"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
  eye:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/>',
  link:'<path d="M9 15l6-6"/><path d="M10.5 6.5 12 5a4 4 0 0 1 6 6l-1.5 1.5M13.5 17.5 12 19a4 4 0 0 1-6-6l1.5-1.5"/>',
  arrowR:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  restart:'<path d="M4 12a8 8 0 1 1 2.5 5.8"/><path d="M4 20v-5h5"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".4"/>',
  sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".3"/>',
  utensils:'<path d="M7 3v8M5 3v6a2 2 0 0 0 4 0V3M7 11v10"/><path d="M16 3c-1.5 1-2 3-2 5s.5 3 2 3v10"/>',
  phone:'<path d="M6 3h3l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2 4.5 1.5V18a2 2 0 0 1-2.2 2A16 16 0 0 1 4 6.2 2 2 0 0 1 6 3z"/>',
  route:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/>',
  person:'<circle cx="12" cy="7.5" r="3.5"/><path d="M5 20c0-3.8 3.1-6.5 7-6.5s7 2.7 7 6.5"/>',
  expand:'<path d="M8 4H4v4M20 8V4h-4M16 20h4v-4M4 16v4h4"/>',
  compress:'<path d="M4 8h4V4M16 4v4h4M20 16h-4v4M8 20v-4H4"/>',
  image:'<rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/>',
  play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor" stroke="none"/>',
  gauge2:'<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l5-5"/><circle cx="12" cy="18" r="1.3"/>',
  scale:'<path d="M12 4v16M7 8h10M7 8l-3 6h6zM17 8l-3 6h6z"/><path d="M4 20h16"/>',
  bolt:'<path d="M13 3 5 13h6l-1 8 8-10h-6z"/>',
};
function svg(p,cls){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"${cls?` class="${cls}"`:''} aria-hidden="true">${p}</svg>`;}

/* Scene photo of Meadow View. Save the supplied image to this path; a labelled
   placeholder shows if the file is not present, so the app still works offline. */
const MEADOW_IMG='assets/Meadow-View.jpg';
const MICHAEL_IMG='assets/Michael.jpg';
function michaelAvatar(big){return `<div class="s-ava${big?' s-ava-lg':''}"><img src="${MICHAEL_IMG}" alt="Michael Turner" onerror="this.remove();this.parentElement.textContent='MT'"></div>`;}
function sceneBand(height,cap){
  return `<div class="scene-band" style="height:${height}px">
    <img src="${MEADOW_IMG}" alt="Meadow View Supported Living: a modern brick building with landscaped gardens and a signed entrance" onerror="this.closest('.scene-band').classList.add('img-failed')">
    ${cap?`<div class="sb-cap">${svg(I.home)} ${cap}</div>`:''}
    <div class="scene-fb">${svg(I.image)}<div><div style="font-weight:700;font-size:12.5px">Meadow View photo</div><div style="font-size:11.5px">Save the supplied image to <b>assets/meadow-view.jpg</b></div></div></div>
  </div>`;
}

/* ---------- KPI definitions ---------- */
const KPIS = [
  {key:'safety',   name:'Resident Safety',     invert:false},
  {key:'quality',  name:'Quality of Life',     invert:false},
  {key:'family',   name:'Family Trust',        invert:false},
  {key:'staff',    name:'Staff Confidence',    invert:false},
  {key:'reliability',name:'Care Reliability',  invert:false},
  {key:'exposure', name:'Regulatory Exposure', invert:true},
];
const START_KPI = {safety:64,quality:78,family:70,staff:62,reliability:58,exposure:32};
const START_PREVENTION = 61;
// Time available each round, spent on BOTH reviewing records and taking actions.
// Enough to review a few records and act, but not to read everything and do everything.
const ROUND_TIME = 10;

/* ---------- State ---------- */
let S;
function freshState(){
  return {
    screen:'landing',
    round:1,
    tab:'situation',
    kpi:{...START_KPI},
    prevention:START_PREVENTION,
    flags:{},
    opened:{1:{},2:{},3:{}},      // investigations opened per round
    selected:{1:{},2:{},3:{}},    // actions selected per round
    confidence:{},                // team confidence per round
    seenOnboard:false,            // first-round onboarding shown
    committed:{},                 // committed round results
    chain:[],                     // risk chain events
    stats:{identified:0,missed:0},
    dismissed:{},                 // round 3 dismissed notifications
    theme:null,
    outcome:null,
  };
}
function save(){try{localStorage.setItem('riskchain_v1',JSON.stringify(S));}catch(e){}}
function load(){try{const r=localStorage.getItem('riskchain_v1');if(r){S=JSON.parse(r);return true;}}catch(e){}return false;}

/* ---------- Rounds meta (for stepper) ---------- */
const ROUNDS_META = [
  {n:1,title:'The New Admission',short:'New Admission'},
  {n:2,title:'Early Warning Signs',short:'Early Warnings'},
  {n:3,title:'The Busy Lunchtime',short:'Busy Lunchtime'},
  {n:4,title:'The Near Miss',short:'Near Miss'},
  {n:5,title:'The Family Challenge',short:'Family Challenge'},
  {n:6,title:'The Organisational Response',short:'Org. Response'},
];

/* ============================================================
   CONTENT, investigations & actions per round
   ============================================================ */
const DATA = {
  1:{
    title:'The New Admission',
    brief:'Michael Turner is due to arrive at Meadow View this afternoon. The records that have reached the service are incomplete and, in places, contradict one another. Your team has not supported Michael before. Decide what to confirm, what to control, and what must be in place before his first meal.',
