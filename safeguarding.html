<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PracticE Ready - Safeguarding Adults</title>
<meta name="description" content="Safeguarding Adults connected simulation. A readiness check for applied safeguarding judgement.">
<!--
  Safeguarding Adults Connected Simulation - standalone prototype (safeguarding.html).
  Built to the PracticE Ready Master Specification v1.0 (Emma Reeve). Companion to the
  choking programme (index.html / frontline.html) but DECOUPLED by rule: reuses brand and
  engine patterns only, never imports or links them.

  FIRST BUILD = SG-F3 "She Tells You at Ten Past Four" vertical slice (per spec s19-20).
  The engine (picker, run, aftermath, debrief, telemetry) is scenario-driven so F1/F2/F4
  drop in later as data bundles.

  BUILD NOTES / TODO before any client send:
   - Font: uses a system Source Sans-like stack. Port the embedded base64 Source Sans 3
     @font-face blocks from frontline.html before SCORM packaging (offline-safe).
   - Media: intro + handover + debrief use placeholder slots. Real avatar clips drop in
     the same way Frontline did (see docs/SG-video-scripts.md).
   - Person-specific facts for Nadia are PROVISIONAL (spec s19.3); held in one config
     object (SCN) so a Source of Truth lock is a single edit.
   - No em dashes anywhere in user-facing copy (house rule).
-->
<style>
/* ---- Brand tokens: inherited verbatim from the finalised PracticE Ready palette (frontline.html) ---- */
:root{
  --ground:#f4f7fc; --ground-2:#fbfcff; --surface:#ffffff; --surface-2:#f3f6fb; --surface-3:#e8eef6;
  --violet:#8a3ccb; --sheen:rgba(255,255,255,.85);
  --ink:#072a6b; --ink-2:#3c4f86; --ink-3:#5b6892; --ink-4:#5b6892;
  --line:#c9cdd4; --line-2:#e4e7ec;
  --navy:#0a2f7a; --navy-2:#072a6b; --navy-ink:#ffffff;
  --teal:#16afc2; --teal-strong:#0e8b9a; --teal-tint:#e3f6fa; --teal-deep:#0b6b78;
  --go:#ff7a1a; --go-sh:#d9620d; --kicker-bg:#e3f6fa; --kicker-line:#b9e4ec;
  --good:#0c7038; --good-tint:#e4f6ec; --good-line:#bde7cd;
  --warn:#9a5109; --warn-tint:#fff2e0; --warn-line:#f5d6a6;
  --bad:#c0281f; --bad-tint:#fdeae8; --bad-line:#f4c4bf;
  --shadow:0 2px 6px rgba(20,38,74,.06),0 14px 30px rgba(20,38,74,.10);
  --r:12px; --r-sm:8px; --r-lg:18px;
  --sans:"Source Sans 3","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:var(--sans);
  --t-hero:40px; --t-h1:29px; --t-h2:22px; --t-h3:18px;
  --t-body:16.5px; --t-sm:15.5px; --t-cap:14.5px; --t-eyebrow:13px; --t-nano:12.5px;
}
/* Light theme only. The dark variant was removed on request (it always looked rubbish). */

*{box-sizing:border-box}
html,body{margin:0;padding:0}
::-webkit-scrollbar{width:0;height:0}
*{scrollbar-width:none}
body{
  font-family:var(--sans);font-size:var(--t-body);line-height:1.55;color:var(--ink);
  background:radial-gradient(1200px 600px at 80% -10%,var(--ground-2),transparent),var(--ground);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;cursor:pointer}
a{color:var(--teal-strong)}
:focus-visible{outline:2.5px solid var(--teal-strong);outline-offset:2px;border-radius:4px}
::selection{background:var(--teal);color:#fff}
.pr-e{color:var(--teal)}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px 46px}
.topbar{background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);box-shadow:var(--shadow);border-radius:var(--r-lg);display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;max-width:1180px;width:calc(100% - 40px);margin:14px auto 22px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.01em;font-size:var(--t-body)}
.brand .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--teal),#0a5f70);display:grid;place-items:center;color:#fff;font-weight:900}
.brand .brand-mark{width:34px;height:34px;border-radius:9px;object-fit:contain;display:block}
.brand small{font-weight:650;color:#c7d6f0;font-size:var(--t-cap);letter-spacing:.02em}
.tb-sp{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#eaf1fb;border-radius:100px;padding:7px 13px;font-size:var(--t-cap);font-weight:650}
.tb-btn:hover{background:rgba(255,255,255,.16)}

.eyebrow{font-size:var(--t-eyebrow);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-strong)}
.btn-go{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,#0d8091,#0a6675);color:#fff;border:0;border-radius:var(--r);padding:13px 22px;font-weight:750;font-size:var(--t-body);box-shadow:0 6px 18px rgba(13,132,148,.42),inset 0 0 0 1px rgba(34,201,223,.22);transition:filter .15s,transform .1s}
.btn-go:hover{filter:brightness(1.07)}
.btn-go:active{transform:translateY(1px)}
.btn-go[disabled]{background:var(--surface-3);color:var(--ink-4);box-shadow:none;cursor:not-allowed;filter:none}
.btn-ghost{display:inline-flex;align-items:center;gap:9px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;font-weight:700;font-size:var(--t-body)}
.btn-ghost:hover{background:var(--surface-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}

/* ---- Picker ---- */
.pick-head{margin:0 0 20px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:28px 32px}
.pick-head h1{font-size:var(--t-h1);letter-spacing:-.02em}
.pick-head p{font-size:var(--t-h3);line-height:1.5;color:var(--ink-2);margin-top:12px;max-width:68ch}
.pick-head .pick-cta{margin-top:10px;font-weight:800;color:var(--ink)}
.scn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.scn-card{position:relative;text-align:left;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:20px 22px;transition:transform .16s,box-shadow .16s,border-color .16s;width:100%;color:inherit}
.scn-card.ready{cursor:pointer}
.scn-card.ready:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 var(--sheen),0 10px 28px rgba(7,42,107,.16);border-color:var(--teal)}
.scn-top{display:flex;align-items:flex-start;gap:14px;padding-right:118px}
.scn-badge{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;background:linear-gradient(150deg,var(--teal),#0a5f70)}
.scn-card[data-accent="navy"] .scn-badge{background:linear-gradient(150deg,#0e3a86,var(--navy))}
.scn-card[data-accent="violet"] .scn-badge{background:linear-gradient(150deg,var(--violet),#6d2fa8)}
.scn-card .code{font-size:var(--t-nano);font-weight:800;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.scn-card h3{font-size:var(--t-h2);letter-spacing:-.01em;margin:3px 0 4px;color:var(--ink)}
.scn-who{font-size:var(--t-sm);color:var(--ink-2);margin:0}
.scn-who b{color:var(--ink);font-weight:700}
.scn-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.status-pill{position:absolute;top:18px;right:20px;display:inline-flex;align-items:center;gap:6px;font-size:var(--t-cap);font-weight:750;border-radius:100px;padding:5px 12px}
.status-pill svg{flex:none}
.status-pill.ready,.status-pill.done{background:var(--kicker-bg);color:var(--teal-strong);border:1px solid var(--kicker-line)}
.status-pill.build,.status-pill.locked{background:rgba(120,134,156,.14);color:var(--ink-3);border:1px solid var(--line)}
.scn-card.build{opacity:.75}
.scn-card.build .scn-badge{filter:grayscale(.55);opacity:.85}
.scn-go{font-weight:800;color:var(--teal-strong)}
.scn-go.sc-locked{color:var(--ink-3);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.scn-go.sc-locked svg{flex:none}

/* ---- Landing ---- */
.land-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:stretch}
.land-copy{min-width:0;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:26px 32px}
.land-kicker{display:inline-flex;align-items:center;gap:8px;background:var(--kicker-bg);color:var(--teal-strong);border:1px solid var(--kicker-line);border-radius:100px;padding:6px 14px;font-size:var(--t-cap);font-weight:750;letter-spacing:.04em;align-self:flex-start}
.land-logo{height:50px;width:auto;align-self:flex-start;display:block}
.land-role{display:flex;align-items:center;gap:9px;background:var(--teal-tint);color:var(--teal-deep);border:1px solid var(--kicker-line);border-radius:100px;padding:10px 18px;font-weight:750;font-size:var(--t-sm);margin-top:18px;align-self:stretch}
.land-role svg{flex:none}
.land-copy h1{font-size:var(--t-hero);letter-spacing:-.025em;margin:16px 0 0;line-height:1.04}
.land-copy .lead{font-size:var(--t-h3);line-height:1.55;color:var(--ink-2);margin-top:16px}
.land-media{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;min-height:280px}
.media-ph{width:100%;aspect-ratio:16/9;border-radius:var(--r);background:repeating-linear-gradient(135deg,var(--surface-3),var(--surface-3) 12px,var(--surface-2) 12px,var(--surface-2) 24px);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:var(--ink-3);border:1px dashed var(--line)}
.media-ph .pl-ic{font-size:30px}
.land-media video.land-video{width:100%;aspect-ratio:16/9;border-radius:var(--r);border:1px solid var(--line);background:#000;display:block;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.vid-wrap{position:relative;width:100%}
.vid-cap{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);max-width:92%;background:rgba(7,19,45,.84);color:#fff;padding:5px 12px;border-radius:7px;font-size:var(--t-sm);line-height:1.32;text-align:center;opacity:0;transition:opacity .12s;pointer-events:none}
.vid-cap.on{opacity:1}
.land-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.lf{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.lf-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:19px;background:linear-gradient(160deg,var(--teal),#0a5f70);margin-bottom:10px}
.lf:nth-child(2) .lf-ic{background:linear-gradient(160deg,var(--violet),#7331ad)}
.lf:nth-child(3) .lf-ic{background:linear-gradient(160deg,#d94a8a,#a62d64)}
.lf h4{font-size:var(--t-h3)}
.lf p{font-size:var(--t-sm);color:var(--ink-2);margin-top:5px;line-height:1.45}
.land-cta{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:18px;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 26px;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.land-cta .lc-prompt{margin:0;font-size:var(--t-h3);color:var(--ink-2);font-weight:600}
.land-cta .lc-prompt b{color:var(--ink);font-weight:800}

/* ---- Notice / content warning + opt out ---- */
.notice{max-width:760px;margin:0 auto}
.notice .card{padding:34px 38px}
.notice .n-ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:#fff;background:linear-gradient(160deg,var(--warn),#7a3f06)}
.notice h1{font-size:var(--t-h1);margin:16px 0 0;letter-spacing:-.01em}
.notice p{color:var(--ink-2);margin-top:12px;line-height:1.6}
.notice ul{margin:12px 0 0;padding-left:20px;color:var(--ink-2)}
.notice li{margin:6px 0}
.n-support{margin-top:18px;background:var(--teal-tint);border:1px solid var(--kicker-line);border-radius:var(--r);padding:14px 18px;font-size:var(--t-sm);color:var(--ink-2)}
.n-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

/* ---- Run shell ---- */
.run-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.clock{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);border-radius:var(--r-lg);padding:12px 20px;box-shadow:var(--shadow)}
.clock .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .cl-lab{font-size:var(--t-nano);text-transform:uppercase;letter-spacing:.1em;color:#9fc0ef;font-weight:750}
.clock.warn{background:linear-gradient(180deg,#8a2d14,#6e2410)}
.clock.warn .cl-lab{color:#f6c6a0}
.now{font-size:var(--t-sm);color:var(--ink-2)}
.now b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.progress{flex:1;min-width:120px}
.progress .bar{height:8px;border-radius:100px;background:var(--surface-3);overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-strong));transition:width .4s}
.progress .pl{font-size:var(--t-nano);color:var(--ink-3);margin-top:5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

.run-grid{display:grid;grid-template-columns:1fr 460px;gap:22px;align-items:start}
.scene-side{aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);background:var(--surface-2);display:flex;align-items:flex-end;position:relative}
.scene-side .ph{position:absolute;inset:0;background:repeating-linear-gradient(135deg,var(--surface-3),var(--surface-3) 12px,var(--surface-2) 12px,var(--surface-2) 24px);display:grid;place-items:center;color:var(--ink-4);font-size:var(--t-cap)}
.scene-side .sc-cap{position:relative;z-index:1;background:linear-gradient(0deg,rgba(7,42,107,.82),transparent);color:#fff;width:100%;padding:11px 15px;font-weight:700;font-size:var(--t-sm)}
.scene-side img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.moment{margin-top:0}
.moment .m-kick{display:inline-flex;gap:8px;align-items:center;font-size:var(--t-cap);font-weight:800;color:var(--teal-strong);text-transform:uppercase;letter-spacing:.08em}
.moment h2{font-size:var(--t-h2);margin:10px 0 0;letter-spacing:-.01em}
.moment .m-body{margin-top:12px;color:var(--ink-2);line-height:1.6}
.speech{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;font-size:var(--t-h3);color:var(--ink);font-style:italic}
.speech .sp-who{display:block;font-style:normal;font-size:var(--t-nano);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}

.opts{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;transition:border-color .15s,background .15s,transform .1s;color:var(--ink)}
.opt:hover{border-color:var(--teal);background:var(--teal-tint)}
.opt:active{transform:translateY(1px)}
.opt .ob{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-3);color:var(--teal-strong);display:grid;place-items:center;font-weight:800;margin-top:1px}
.opt .ot{font-size:var(--t-body);line-height:1.45}
.opt.sel{border-color:var(--teal);background:var(--teal-tint);box-shadow:inset 0 0 0 1px var(--teal)}
.opt.sel .ob{background:var(--teal);color:#fff}
.submit-row{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.submit-hint{font-size:var(--t-cap);color:var(--ink-3)}
.q-ask{margin-top:12px;font-size:var(--t-cap);color:var(--ink-3);font-weight:700}

/* consequence beat */
.beat{margin-top:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px}
.beat .bt-tag{display:inline-flex;align-items:center;gap:7px;font-size:var(--t-nano);font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:100px}
.bt-tag.ok{background:var(--good-tint);color:var(--good);border:1px solid var(--good-line)}
.bt-tag.risk{background:var(--warn-tint);color:var(--warn);border:1px solid var(--warn-line)}
.bt-tag.fail{background:var(--bad-tint);color:var(--bad);border:1px solid var(--bad-line)}
.beat p{margin-top:12px;color:var(--ink-2);line-height:1.6}
.bt-next{margin-top:16px}

/* recovery banner */
.recovery{margin-top:18px;background:var(--warn-tint);border:1px solid var(--warn-line);border-radius:var(--r);padding:18px 22px}
.recovery h3{font-size:var(--t-h3);color:var(--warn)}
.recovery p{margin-top:8px;color:var(--ink-2);line-height:1.6}

/* ---- Records rail ---- */
.rail{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px}
.rail .rl-title{font-size:var(--t-cap);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.rail-panel{background:var(--teal-tint);border:1px solid var(--kicker-line);border-radius:var(--r-lg);padding:14px}
.doc-row{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:9px;color:var(--ink)}
.doc-row:last-child{margin-bottom:0}
.doc-row:hover{border-color:var(--teal)}
.doc-row.opened{background:var(--good-tint);border-color:var(--good-line)}
.doc-row .d-ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--surface-3);color:var(--teal-strong);display:grid;place-items:center;font-size:15px}
.doc-row .d-nm{font-size:var(--t-sm);font-weight:700;line-height:1.25}
.doc-row .d-sub{font-size:var(--t-nano);color:var(--ink-3)}
.inject{background:var(--surface);border:1px solid var(--bad-line);border-radius:var(--r-lg);padding:14px 16px}
.inject .in-tag{font-size:var(--t-nano);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bad)}
.inject p{font-size:var(--t-sm);color:var(--ink-2);margin-top:7px;line-height:1.5}

/* ---- Modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(7,19,45,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);max-width:600px;width:100%;max-height:84vh;overflow:auto;padding:28px 32px}
.modal .m-kick{font-size:var(--t-nano);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-strong)}
.modal h3{font-size:var(--t-h2);margin:6px 0 0}
.modal .m-prov{font-size:var(--t-cap);color:var(--ink-3);margin-top:4px}
.modal .m-doc{margin-top:16px;color:var(--ink-2);line-height:1.65}
.modal .m-doc p{margin-top:12px}
.modal .m-doc .dl-h{font-weight:800;color:var(--ink);margin-top:16px}
.modal .m-close{margin-top:22px;display:flex;justify-content:flex-end}

/* confidence */
.conf{margin-top:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
.conf p{font-weight:700}
.conf .cf-row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.cf-dot{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:800;color:var(--ink-2)}
.cf-dot:hover{border-color:var(--teal);color:var(--teal-strong)}
.cf-dot.sel{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ---- Aftermath ---- */
.after{max-width:1120px;margin:0 auto}
.after .af-ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:#fff;background:linear-gradient(160deg,#5b6577,#39414f)}
.after h1{font-size:var(--t-h1);margin:16px 0 0}
.after .af-intro{color:var(--ink-2);margin-top:12px;line-height:1.6;max-width:72ch}
.after-windows{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px;align-items:start}
.window{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:20px 22px;position:relative}
.w-img{aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface-2);margin-bottom:14px}
.w-img img{width:100%;height:100%;object-fit:cover;display:block}
.window .w-when{font-size:var(--t-nano);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.window h3{font-size:var(--t-h3);margin:6px 0 0;color:var(--ink)}
.window p{margin-top:10px;color:var(--ink-2);line-height:1.6}
.ownwords{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.ownwords .ow-lab{font-size:var(--t-nano);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ownwords .ow-q{font-style:italic;font-size:var(--t-h3);color:var(--ink);margin-top:8px}
.ownwords .ow-note{font-size:var(--t-sm);color:var(--ink-2);margin-top:8px}

/* ---- Debrief ---- */
.deb-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px 28px}
.outcome-badge{flex:none;padding:8px 16px;border-radius:100px;font-weight:800;font-size:var(--t-sm);letter-spacing:.02em}
.ob-a{background:rgba(63,208,122,.2);color:#9ff0bd;border:1px solid rgba(63,208,122,.4)}
.ob-b{background:rgba(247,176,83,.2);color:#ffd79a;border:1px solid rgba(247,176,83,.4)}
.ob-c{background:rgba(255,111,99,.2);color:#ffb3ab;border:1px solid rgba(255,111,99,.4)}
.deb-head h1{font-size:var(--t-h2);margin:0}
.deb-head p{color:#c7d6f0;margin-top:5px;font-size:var(--t-sm)}
.deb-sec{margin-top:18px}
.deb-sec > h2{font-size:var(--t-h3);letter-spacing:.02em;margin-bottom:12px}
.cc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:18px}
.cc .cc-st{font-size:var(--t-nano);font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:100px;display:inline-block}
.cc.held .cc-st{background:var(--good-tint);color:var(--good);border:1px solid var(--good-line)}
.cc.trip .cc-st{background:var(--bad-tint);color:var(--bad);border:1px solid var(--bad-line)}
.cc h4{font-size:var(--t-h3);margin:10px 0 0}
.cc p{font-size:var(--t-sm);color:var(--ink-2);margin-top:7px;line-height:1.5}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:16px 20px;margin-bottom:10px}
.dom-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dom-top h4{font-size:var(--t-body)}
.dom-top .dom-sc{font-weight:800;font-variant-numeric:tabular-nums}
.dom-bar{height:9px;border-radius:100px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.dom-bar i{display:block;height:100%;border-radius:100px}
.dom-note{font-size:var(--t-sm);color:var(--ink-2);margin-top:9px;line-height:1.5}
.voice{background:var(--teal-tint);border:1px solid var(--kicker-line);border-radius:var(--r-lg);padding:22px 26px}
.voice h2{font-size:var(--t-h3);color:var(--teal-deep)}
.voice p{color:var(--ink-2);margin-top:10px;line-height:1.6}
.voice .v-said{font-style:italic;font-size:var(--t-h3);color:var(--ink);margin-top:12px}
.transfer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:22px 26px}
.transfer h2{font-size:var(--t-h3)}
.transfer p{color:var(--ink-2);margin-top:8px;line-height:1.55}
.tf-field{margin-top:14px}
.tf-field label{display:block;font-size:var(--t-cap);font-weight:700;color:var(--ink-3);margin-bottom:6px}
.tf-field input,.tf-field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;color:var(--ink);font:inherit}
.tf-field textarea{min-height:70px;resize:vertical}
.events{display:flex;flex-wrap:wrap;gap:8px}
.ev{font-size:var(--t-cap);background:var(--surface-2);border:1px solid var(--line);border-radius:100px;padding:6px 13px;color:var(--ink-2);font-weight:650}
.ev b{color:var(--ink)}
.reflect{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:22px 26px}
.reflect h2{font-size:var(--t-h3)}
.reflect p{color:var(--ink-2);margin-top:8px;line-height:1.55}
.caveat{margin-top:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;font-size:var(--t-sm);color:var(--ink-3);line-height:1.55}
.support-foot{margin-top:14px;background:var(--teal-tint);border:1px solid var(--kicker-line);border-radius:var(--r);padding:14px 18px;font-size:var(--t-sm);color:var(--ink-2)}

/* scroll cue: scrollbars are hidden globally, so this tells the learner there is more below */
.scroll-cue{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(6px);background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);border:1px solid rgba(255,255,255,.16);border-radius:100px;padding:8px 17px;font-size:var(--t-cap);font-weight:750;box-shadow:var(--shadow);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.scroll-cue.show{opacity:1;transform:translateX(-50%) translateY(0)}

.spacer{height:18px}
.center{text-align:center}
.mt{margin-top:18px}
.flexline{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Desktop / laptop: fit the gameplay to one screen, no scrolling (mobile may scroll). */
@media (min-width:861px){
  .topbar{margin:10px auto 14px}
  .wrap{padding-bottom:20px}
  .run-head{margin-bottom:12px}
  .clock{padding:9px 16px}
  .clock .big{font-size:22px}
  .moment h2{font-size:19px;line-height:1.36;margin-top:0}
  .moment .m-kick{font-size:var(--t-nano)}
  .speech{margin-top:10px;padding:12px 16px;font-size:16px}
  .q-ask{margin-top:8px}
  .opts{margin-top:12px;gap:9px}
  .opt{padding:11px 15px}
  .opt .ot{font-size:15.5px;line-height:1.4}
  .opt .ob{width:28px;height:28px}
  /* confidence collapses to a slim inline row */
  .conf{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 16px;margin-top:10px}
  .conf p{font-size:15.5px}
  .conf .cf-row{margin-top:0;flex-wrap:nowrap}
  .cf-dot{width:34px;height:34px}
}
@media (max-width:860px){
  .land-grid,.run-grid,.scn-grid,.cc-grid,.land-facts,.after-windows{grid-template-columns:1fr}
  .rail{position:static}
  .land-copy h1{font-size:var(--t-h1)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
"use strict";

/* =========================================================================
   SCENARIO DATA  (SG-F3, provisional facts per spec s19.3, held in one place)
   ========================================================================= */
const LOCAL = { // configurable placeholder layer (spec s3.2)
  la:"Marston Council", laTeam:"Marston Adult Safeguarding Team",

// Approximate captions for the intro (timing estimated from the script; swap for the avatar tool's VTT export for exact timing).
const INTRO_F3_VTT = `WEBVTT

STYLE
::cue {
    color: white;
    background-color: #383943A3;
}

00:00:00.600 --> 00:00:02.956
Welcome to She Tells You at Ten Past Four.

00:00:03.206 --> 00:00:06.074
You're on a late shift, on your own, with four people
to support.

00:00:06.224 --> 00:00:10.944
In the next couple of hours one of them is going to
trust you with something, and a clock is already running

00:00:10.944 --> 00:00:12.384
toward the end of your shift.

00:00:12.384 --> 00:00:14.595
There are no hints, and no single right answer.

00:00:14.745 --> 00:00:17.865
What happens is whatever your choices make happen.

00:00:17.865 --> 00:00:20.425
What matters most here is not what you work out.

00:00:20.425 --> 00:00:22.425
It is what you do with what you are told.

00:00:22.425 --> 00:00:24.195
When you're ready, begin your shift.
`;

// Approximate captions for the handover (timing estimated from the script; swap for the avatar tool's VTT export for exact timing).
const HANDOVER_F3_VTT = `WEBVTT

STYLE
::cue {
    color: white;
    background-color: #383943A3;
}

00:00:00.600 --> 00:00:03.618
It's ten past four, and the house is yours for the
rest of the shift.

00:00:03.868 --> 00:00:06.028
Three of the people here are settled for now.

00:00:06.028 --> 00:00:08.828
The fourth has been upstairs since lunchtime and has
just come down.

00:00:08.828 --> 00:00:09.824
Her bag is by the door.

00:00:09.974 --> 00:00:12.772
Someone is collecting her at six, the way they do
most Fridays.

00:00:13.022 --> 00:00:16.862
That's the shape of the next couple of hours, and
the clock is already running.

00:00:16.862 --> 00:00:21.149
Before you go through, take a proper look at what
the house holds about the people you are supporting.

00:00:21.399 --> 00:00:23.976
The thing that matters today may not be the thing
that's flagged.

00:00:24.226 --> 00:00:25.736
When you are ready, go to the kitchen.
`;

// Debrief clips, one per outcome (A protected / B delayed / C harm). Captions estimated from the script.
const DEBRIEF_F3_A_VTT = `WEBVTT

STYLE
::cue {
    color: white;
    background-color: #383943A3;
}

00:00:00.600 --> 00:00:02.898
Nothing dramatic happened, and that is the point.

00:00:03.388 --> 00:00:08.257
Someone trusted you with something difficult, and
you took it seriously without taking it over.

00:00:08.507 --> 00:00:13.627
You kept her safe, you kept her trust, and you made
sure it reached the person whose job it is to help,

00:00:13.627 --> 00:00:14.869
before your shift ended.

00:00:15.119 --> 00:00:20.239
The screen shows how each part of your practice held
up, and the two things this shift really turned

00:00:20.239 --> 00:00:20.599
on.
`;

const DEBRIEF_F3_B_VTT = `WEBVTT

STYLE
::cue {
    color: white;
    background-color: #383943A3;
}

00:00:00.600 --> 00:00:01.800
You got there.

00:00:01.800 --> 00:00:05.801
But it came later and closer than it should have,
and the screen shows where the time went.

00:00:06.211 --> 00:00:11.811
Recognising that something is wrong and putting a
poor first instinct right is real practice, and it

00:00:11.811 --> 00:00:12.413
counts.

00:00:12.663 --> 00:00:17.623
What we look at now is the moment the response started
to lag behind the risk, because on a different day

00:00:17.783 --> 00:00:19.339
that gap is the whole story.
`;

const DEBRIEF_F3_C_VTT = `WEBVTT

STYLE
::cue {
    color: white;
    background-color: #383943A3;
}

00:00:00.600 --> 00:00:01.946
Take a moment before we go on.

00:00:02.356 --> 00:00:07.476
By the end of this shift, what you were trusted with
had not reached anyone who could act on it, and you

00:00:07.476 --> 00:00:08.605
have seen what followed.

00:00:08.855 --> 00:00:12.152
This was not one mistake, and it is not about blame.

00:00:12.562 --> 00:00:18.002
It was a handful of choices across one afternoon,
and any one of them, made differently, would have

00:00:18.002 --> 00:00:18.904
changed the ending.

00:00:19.154 --> 00:00:21.255
The breakdown below walks through each of them.

00:00:21.505 --> 00:00:26.103
Sit with it, because the whole of this training exists
to keep a shift from reaching that point.
`;

const SCN = {
  code:"SG-F3", title:"She Tells You at Ten Past Four",
  intro:{ video:"assets/safeguarding/intro-f3.mp4", vtt:INTRO_F3_VTT },
  handover:{ video:"assets/safeguarding/handover-f3.mp4", vtt:HANDOVER_F3_VTT },
  debrief:{ A:{ video:"assets/safeguarding/debrief-f3-a.mp4", vtt:DEBRIEF_F3_A_VTT },
            B:{ video:"assets/safeguarding/debrief-f3-b.mp4", vtt:DEBRIEF_F3_B_VTT },
            C:{ video:"assets/safeguarding/debrief-f3-c.mp4", vtt:DEBRIEF_F3_C_VTT } },
  person:"Nadia", age:29, pronoun:"she", poss:"her", obj:"her",
  setting:"Sandhill Road", settingDesc:"a shared supported living house",

  leadHuman:"You are the only worker in the house this afternoon. Nadia has been in her room since lunchtime and has just come down to the kitchen. Her uncle is collecting her at six for her usual Friday overnight stay.",

  facts:[
    {ic:"home", h:"The house", p:"Sandhill Road, a shared supported living house. Late shift. You are the only worker on, with four people in."},
    {ic:"user", h:"Nadia, 29", p:"Autistic. Communicates with speech, needs processing time. An uncle collects her most Fridays. A boyfriend holds her bank card and her phone."},

  ],
  noticeThemes:"This scenario involves a disclosure that touches on sexual abuse and on coercive control within a relationship. The disclosure is written to be ordinary and non-explicit. Nothing is depicted.",

  sceneImg:{
    N1:"assets/safeguarding/scene-f3-n1.jpg",
    N2:"assets/safeguarding/scene-f3-n1.jpg",
    N3:"assets/safeguarding/scene-f3-n1.jpg",
    N4:"assets/safeguarding/scene-f3-n4.jpg",
    N9:"assets/safeguarding/scene-f3-n4.jpg",

  docs:[
    {id:"DOC_PLAN", nm:"Support plan and communication profile", sub:"Current", ic:"fileText",
     prov:"Nadia's support plan, Sandhill Road.",
     body:["How Nadia communicates: speech, with processing time needed. Direct questioning and sustained eye contact increase her distress. Give her time and let her lead.",
           "What matters to her, and who is important to her. Distress reduces her capacity to make decisions in the moment, so decisions taken while she is distressed should be revisited when she is settled.",
           {h:"On consent and sharing"},"Where there is a risk of harm, information is shared with the safeguarding lead whether or not the person agrees. The person is told, unless telling them increases the risk."]},
    {id:"DOC_FRIDAY", nm:"The Friday arrangement", sub:"Standing note", ic:"calendar",
     prov:"Rota and visiting note, Sandhill Road.",
     body:["Nadia's uncle collects her most Fridays for an overnight stay. The arrangement is long standing and recorded as her routine.",

    {id:"DOC_ESC", nm:"Escalation and on-call contacts", sub:"Reference", ic:"phone",

  nodes:[
    {id:"N1", kick:"The first thirty seconds",
     scene:"The kitchen, late afternoon",
     body:"She stands by the counter, not sitting. She starts to say something about her uncle, stops, starts again in a different place. It is out of order and hard to follow, and she keeps glancing at the door.",
     speech:{who:"Nadia", t:"On a Friday… when I go there… I don't always want to. He says it's just us. I don't know if I should say."},

       {k:"def", t:"Sit down at her level, stay calm, and give her the time to say it in her own order.",

     ]},

/* =========================================================================
   CLOCK  (real running deadline, maps 16:10 -> 18:00)
   ========================================================================= */
function startClock(){
  if(S.clockRunning) return;
  S.clockRunning=true;
  tickClock();
}
function tickClock(){
  clearTimeout(timer);
  if(!S.clockRunning) return;
  timer=setTimeout(()=>{
    S.clockLeft = Math.max(0, S.clockLeft-1);
    if(S.clockLeft===0 && !S.deadlineHit){
      S.deadlineHit=true;
      onDeadline();
    }
    const el=document.getElementById("clockFace");
    if(el){ el.textContent=clockMMSS(); el.parentElement.classList.toggle("warn", S.clockLeft<=120); }
    const nowEl=document.getElementById("clockNow");
    if(nowEl) nowEl.textContent=worldTime();
    if(S.clockRunning) tickClock();
  },1000);
}
function stopClock(){ S.clockRunning=false; clearTimeout(timer); }
function clockMMSS(){ const m=Math.floor(S.clockLeft/60), s=S.clockLeft%60; return m+":"+String(s).padStart(2,"0"); }
function worldTime(){
  // map clockLeft (720..0) onto 16:10 -> 18:00 (110 minutes)
  const frac = 1 - (S.clockLeft/SCN.clockSeconds);
  const mins = Math.round(970 + frac*110); // 16:10 = 970 minutes
  const h=Math.floor(mins/60), m=mins%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function onDeadline(){
  // if the learner has not yet safely resolved the collection node, the uncle arrives and takes her
  const n6 = SCN.nodes.findIndex(n=>n.id==="N6");
  if(S.nodeIdx < n6 || (S.nodeIdx===n6 && S.sub==="decide")){
    S.flags.deadlineForced=true;
    S.ccTripped.CC2=true;
    log("ALLEGED_CONTACTED",{role:"deadline",node_id:"N6"});
  }
}

  }[S.stage] || viewPicker;

// Custom caption overlay (native <track> is blocked on file:// and ignored by iOS fullscreen).
// Reads the VTT text we already hold and paints the active line over the video.
function mediaVideo(media, maxw){
  return `<div class="vid-wrap"${maxw?` style="max-width:${maxw};margin:0 auto"`:""}>
      <video class="land-video" controls playsinline preload="metadata"><source src="${media.video}" type="video/mp4"></video>
      <div class="vid-cap" aria-live="polite"></div>
    </div>`;
}
function vtime(t){
  const p=t.trim().split(":");
  return p.length===3 ? (+p[0])*3600+(+p[1])*60+parseFloat(p[2]) : (+p[0])*60+parseFloat(p[1]);
}
function parseVTT(s){
  const cues=[];
  s.split(/\r?\n\r?\n+/).forEach(block=>{
    const lines=block.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const tl=lines.find(l=>l.includes("-->"));
    if(!tl) return;
    const [a,b]=tl.split("-->");
    const text=lines.slice(lines.indexOf(tl)+1).join(" ");
    if(text) cues.push({start:vtime(a), end:vtime(b.trim().split(" ")[0]), text});
  });
  return cues;
}
function setupVideoCaptions(){
  const wrap=document.querySelector(".vid-wrap"); if(!wrap) return;
  const v=wrap.querySelector("video"), cap=wrap.querySelector(".vid-cap"); if(!v||!cap) return;
  let vtt=null;
  if(S.stage==="landing" && SCN.intro) vtt=SCN.intro.vtt;
  else if(S.stage==="handover" && SCN.handover) vtt=SCN.handover.vtt;
  else if(S.stage==="debrief"){ const p=outcomePath(); if(SCN.debrief && SCN.debrief[p]) vtt=SCN.debrief[p].vtt; }
  if(!vtt) return;
  const cues=parseVTT(vtt);
  const upd=()=>{ const t=v.currentTime||0; const c=cues.find(x=>t>=x.start && t<x.end); cap.textContent=c?c.text:""; cap.classList.toggle("on", !!c); };
  v.addEventListener("timeupdate", upd); upd();
  // Autoplay: the learner reached this screen by clicking, so the document has
  // user activation and sound is allowed. If blocked, native controls remain.
  if(!v.dataset.autoplayed){ v.dataset.autoplayed="1"; const p=v.play(); if(p&&p.catch) p.catch(()=>{}); }
}
function updateScrollCue(){
  const cue=document.getElementById("scrollCue");
  if(!cue) return;
  const more=(document.documentElement.scrollHeight - window.innerHeight - window.scrollY) > 40;
  cue.classList.toggle("show", more);
}
window.addEventListener("scroll", updateScrollCue, {passive:true});
window.addEventListener("resize", updateScrollCue);

    <button class="btn-go" data-act="toNotice">Before you begin →</button>
  </div>`;
}

function viewNotice(){
  return `
  <div class="notice">
    <div class="card">
      <div class="n-ic">${icon('alert',26)}</div>
      <div class="eyebrow" style="margin-top:14px">Before you begin</div>
      <h1>A note on what this scenario involves</h1>
      <p>${SCN.noticeThemes}</p>
      <p>A safeguarding scenario can occasionally bring something real to the surface for the person running it. That is foreseeable, and it is taken seriously here.</p>
      <ul>
        <li>You can stop at any point. There is an exit on every screen.</li>
        <li>Opting out carries <b>no score penalty</b> and is <b>not flagged to your employer</b>.</li>
        <li>There is a reflection and a signposted support route at the end of the scenario.</li>
      </ul>
      <div class="n-support">${SCN.support}</div>
      <div class="n-actions">
        <button class="btn-go" data-act="toHandover">I understand, continue →</button>
        <button class="btn-ghost" data-act="optOut">Not right now</button>
      </div>
    </div>
  </div>`;
}

function viewHandover(){
  return `
  <div class="land-grid">
    <div class="land-copy">
      <span class="land-kicker">Handover</span>
      <h1 style="font-size:var(--t-h1)">Ten past four. The house is yours.</h1>
      <p class="lead">It is ten past four and you are the only worker on. Three people are settled for now. Nadia has been upstairs since lunchtime. Her bag is by the door. Her uncle collects her at six, as he does most Fridays.</p>
      <p class="lead">Once you go through, the records the house holds are alongside you the whole shift. Nothing is flagged. Part of this is working out which ones matter today. The clock to the collection starts the moment you do.</p>
    </div>
    <div class="land-media">
      ${SCN.handover ? mediaVideo(SCN.handover)
      : `<div class="media-ph"><span class="pl-ic">${icon('play',28)}</span><span>Handover video</span><span style="font-size:var(--t-nano)">(placeholder slot)</span></div>`}
    </div>
  </div>
  <div class="land-cta">
    <p class="lc-prompt">She has just come down to the kitchen. <b>Go through.</b></p>
    <div class="flexline">
      <button class="btn-ghost" data-act="optOut">Stop</button>
      <button class="btn-go" data-act="startRun">Go to the kitchen →</button>
    </div>
  </div>`;
}

function viewRun(){
  const node = SCN.nodes[S.nodeIdx];
  const warnCls = S.clockLeft<=120 ? "warn":"";
  const head = `
    <div class="run-head">
      <div class="clock ${warnCls}">
        <div><div class="cl-lab">${SCN.deadlineLabel} 18:00 · time left</div><div class="big" id="clockFace">${clockMMSS()}</div></div>
      </div>
      <div class="now">Now <b id="clockNow">${worldTime()}</b></div>
      <div class="progress">
        <div class="bar"><i style="width:${Math.round((S.nodeIdx/(SCN.nodes.length-1))*100)}%"></i></div>
        <div class="pl">Step ${S.nodeIdx+1} of ${SCN.nodes.length}</div>
      </div>
      <button class="btn-ghost" data-act="optOut" style="padding:9px 14px">Stop</button>
    </div>`;

  const simg = SCN.sceneImg && SCN.sceneImg[node.id];
  const sceneSide = `<div class="scene-side">${simg?`<img src="${simg}" alt="">`:`<div class="ph">Scene image</div>`}<div class="sc-cap">${node.scene||SCN.setting}</div></div>`;

  let main;
  if(S.sub==="decide"){
    const sel=S.pending;
    const hasOpt = sel!==null && sel!==undefined;
    const confOk = !node.confidence || !!S.confidence[node.id];
    const canSubmit = hasOpt && confOk;
    if(!S.order[node.id]) S.order[node.id]=shuffle([...Array(node.opts.length).keys()]);
    const order=S.order[node.id];
    main = `
      <div class="moment">
        <span class="m-kick">${node.kick}</span>
        <h2>${node.body}</h2>
        ${node.speech?`<div class="speech"><span class="sp-who">${node.speech.who}</span>“${node.speech.t}”</div>`:""}
        <p class="q-ask">${node.q}</p>
        <div class="opts">
          ${order.map((origI,pos)=>`<button class="opt ${sel===origI?'sel':''}" data-act="select" data-i="${origI}"><span class="ob">${"ABC"[pos]}</span><span class="ot">${node.opts[origI].t}</span></button>`).join("")}
        </div>
        ${node.confidence ? confBlock(node.id) : ""}
        <div class="submit-row">
          <button class="btn-go" data-act="submit" ${canSubmit?"":"disabled"}>Submit decision →</button>
          ${canSubmit?"":`<span class="submit-hint">${submitHint(node, hasOpt, confOk)}</span>`}
        </div>
      </div>`;
  } else {
    // beat
    const ch = S.choices[node.id];
    const o = node.opts[ch.i];
    const tagCls = o.k==="def"?"ok":o.k==="risk"?"risk":"fail";
    const tagTx = o.k==="def"?"A considered call":o.k==="risk"?"A risky instinct":"This went wrong";
    const recover = S.recoverFrom===node.id;
    main = `
      <div class="moment">
        <span class="m-kick">${node.kick}</span>
        <div class="beat">
          <span class="bt-tag ${tagCls}">${tagTx}</span>
          <p>${o.beat}</p>
        </div>
        ${recover ? recoveryBlock(node) : `
          <div class="bt-next">
            <button class="btn-go" data-act="next">${S.nodeIdx>=SCN.nodes.length-1?"Finish the shift →":"Carry on →"}</button>
          </div>`}
      </div>`;
  }

  const rail = `
    <aside class="rail">
      ${sceneSide}
      <div class="rl-title">Records the house holds</div>
      <div class="rail-panel">
        ${SCN.docs.map(d=>`
          <button class="doc-row ${S.opened[d.id]?'opened':''}" data-act="doc" data-id="${d.id}">
            <span class="d-ic">${icon(d.ic,18)}</span>
            <span><span class="d-nm">${d.nm}</span><br><span class="d-sub">${S.opened[d.id]?'Reviewed':d.sub}</span></span>
          </button>`).join("")}
      </div>
    </aside>`;

  return head + `<div class="run-grid"><div>${main}</div>${rail}</div>`;
}

function submitHint(node, hasOpt, confOk){
  if(!hasOpt && !confOk) return "Choose an option and rate your confidence to submit.";
  if(!hasOpt) return "Choose an option to submit.";
  if(!confOk) return "Rate your confidence to submit.";
  return "";
}
function confBlock(id){
  const val=S.confidence[id];
  return `
    <div class="conf" id="conf-${id}">
      <p>${val?`Confidence noted (${val} of 5). You can change it.`:"How confident are you about your decision?"}</p>
      <div class="cf-row">
        ${[1,2,3,4,5].map(n=>`<button class="cf-dot ${val===n?'sel':''}" data-act="conf" data-id="${id}" data-v="${n}">${n}</button>`).join("")}
      </div>
    </div>`;
}
function recoveryBlock(node){
  return `
    <div class="recovery">
      <h3>Catch it back</h3>
      <p>That was a poor instinct, and in a real shift there is usually a moment to put it right. Take it. What you do next decides whether this is a near miss you recovered or a line you crossed.</p>
      <div class="bt-next flexline">
        ${node.opts.map((o,i)=> o.k!=="fail" ? `<button class="btn-go" data-act="recover" data-i="${i}">${o.k==="def"?"Put it right":"Try again"}</button>`:"").join("")}
      </div>
    </div>`;
}

/* =========================================================================
   OUTCOME + AFTERMATH + DEBRIEF
   ========================================================================= */
function outcomePath(){
  // hard-fail CCs => C ; recovered CC or any risky => B ; all clean => A
  const hardTrip = (S.ccTripped.CC1 && !S.ccRecovered.CC1) || (S.ccTripped.CC2 && !S.ccRecovered.CC2);
  if(hardTrip) return "C";
  const anyRisk = SCN.nodes.some(n=>{ const c=S.choices[n.id]; return c && n.opts[c.i].k!=="def"; });
  const recovered = S.ccRecovered.CC3 || S.ccRecovered.CC1 || S.ccRecovered.CC2;
  if(anyRisk || recovered) return "B";
  return "A";
}
function viewAftermath(){
  const wins = SCN.aftermath;
  const replay = ownWordsReplay();
  return `
  <div class="after">
    <div class="af-ic">${icon('history',26)}</div>
    <div class="eyebrow" style="margin-top:14px">What your decisions produced</div>
    <h1>The shift ended. This is what came next.</h1>
    <p class="af-intro">${SCN.afterReflect}</p>
    <div class="after-windows">
    ${wins.map(w=>`
      <div class="window">
        ${w.img?`<div class="w-img"><img src="${w.img}" alt=""></div>`:""}
        <div class="w-when">${w.when}</div>
        <h3>${w.h}</h3>
        <p>${w.p}</p>
        ${w.ownWords && replay ? `
          <div class="ownwords">
            <div class="ow-lab">Read back to you from your own record</div>
            <div class="ow-q">${replay.q}</div>
            <div class="ow-note">${replay.note}</div>
          </div>`:""}
      </div>`).join("")}
    </div>
    <div class="mt center">
      <button class="btn-go" data-act="toDebrief">Continue to the debrief →</button>
    </div>
  </div>`;
}
function ownWordsReplay(){
  // reconstruct the learner's own choices/timings for the replay device (spec s5.2)
  const rep = S.choices["N7"];
  if(rep){
    const o = SCN.nodes.find(n=>n.id==="N7").opts[rep.i];
    if(o.k==="fail") return {q:"“Left voicemail for manager. Will hand over in the morning.”",
      note:"That is the note your shift left behind. It is the first thing anyone looking back at this will read, and it is what the police asked you about."};
    if(o.k==="risk") return {q:"“Tried on-call repeatedly. No answer. Shift continued.”",
      note:"The record shows the time you spent on a phone nobody answered, and the route you did not use while the clock ran down."};
  }
  const rec = S.choices["N8"];
  if(rec){ const o=SCN.nodes.find(n=>n.id==="N8").opts[rec.i];
    if(o.k!=="def") return {q:"“Nadia upset this afternoon. Spoke to her. Settled before collection.”",
      note:"Written later, in summary, this is all the record holds. What she actually said is nowhere, and only you could have captured it."}; }
  return {q:"“…”", note:"The record of what you were told, and when, is read back to you. What is written, and what is missing, both speak."};
}

function viewDebrief(){
  const path=outcomePath();
  const meta={A:{cls:"ob-a",lab:"Outcome A · Protected",sum:"Nadia was safer at the end of the shift than at the start. The concern reached someone who could act, within the shift."},
    B:{cls:"ob-b",lab:"Outcome B · Protection delayed",sum:"It came right in the end, but later and closer than it should have. A poor instinct was recovered, or the response lagged the risk."},
    C:{cls:"ob-c",lab:"Outcome C · Harm continued",sum:"A critical control was crossed and could not be undone in the run. The concern did not reach help in time, and the aftermath followed."}}[path];
  const doms = SCN.domains.map(d=>domainScore(d));
  const ccs = Object.keys(SCN.ccDefs).map(k=>{
    const def=SCN.ccDefs[k];
    const tripped = S.ccTripped[k] && !S.ccRecovered[k];
    return `<div class="cc ${tripped?'trip':'held'}">
      <span class="cc-st">${tripped?'Tripped':'Held'}</span>
      <h4>${k} · ${def.nm}</h4>
      <p>${tripped?def.trip:def.held}</p>
    </div>`;
  }).join("");
  const events = capturedEvents();
  return `
  <div class="deb-head">
    <span class="outcome-badge ${meta.cls}">${meta.lab}</span>
    <div><h1>Your debrief</h1><p>${meta.sum}</p></div>
  </div>
  <div class="land-media" style="margin-top:18px;min-height:0;padding:20px">
    ${(SCN.debrief && SCN.debrief[path]) ? mediaVideo(SCN.debrief[path], "560px")
    : `<div class="media-ph" style="max-width:520px"><span class="pl-ic">${icon('play',28)}</span><span>Debrief video (outcome ${path})</span><span style="font-size:var(--t-nano)">(placeholder slot)</span></div>`}
  </div>

  <div class="deb-sec">
    <h2>The two controls this scenario turned on</h2>
    <div class="cc-grid">${ccs}</div>
  </div>

  <div class="deb-sec">
    <h2>How your practice held up</h2>
    ${doms.map(d=>`
      <div class="dom">
        <div class="dom-top"><h4>${d.nm}</h4><span class="dom-sc" style="color:${d.col}">${d.label}</span></div>
        <div class="dom-bar"><i style="width:${d.pct}%;background:${d.col}"></i></div>
        <div class="dom-note">${d.note}</div>
      </div>`).join("")}
  </div>

  <div class="deb-sec">
    <div class="voice">
      <h2>What Nadia wanted to happen</h2>
      <div class="v-said">${SCN.personVoice.said}</div>
      <p>${SCN.personVoice.note}</p>
      <p><b>${S.telem.some(e=>e.ev==="WISHES_SOUGHT"&&e.recorded)?"You asked her, and you recorded it.":"On this run, her own wishes were not fully sought and recorded. That is the most commonly missed point in this scenario."}</b></p>
    </div>
  </div>

  <div class="deb-sec">
    <h2>Captured this run</h2>
    <div class="events">${events}</div>
    <p style="font-size:var(--t-sm);color:var(--ink-3);margin-top:12px">A concern reported in good faith that turns out not to be substantiated is a correct professional act. It is never penalised here, and it never counts against you.</p>
  </div>

  <div class="deb-sec">
    <div class="reflect">
      <h2>Emotional impact</h2>
      <p>This scenario asks a lot. Take a moment before you move on. What sat with you most. What you would want beside you if this were a real shift. There are no right answers here, and nothing you note is scored.</p>
      <div class="support-foot">${SCN.support}</div>
    </div>
  </div>

  <div class="deb-sec">
    <div class="transfer">
      <h2>What must change in your real service?</h2>
      <p>End with one thing you will take back. Give it an owner and a date, or it does not happen.</p>
      <div class="tf-field"><label>The one change</label><textarea data-tf="action" placeholder="e.g. Check our out-of-hours route actually answers, and that everyone knows the direct number.">${S.transfer.action||""}</textarea></div>
      <div class="tf-field"><label>Owner</label><input data-tf="owner" value="${S.transfer.owner||""}" placeholder="Who owns this"></div>
      <div class="tf-field"><label>Review date</label><input data-tf="date" value="${S.transfer.date||""}" placeholder="By when"></div>
    </div>
  </div>

  <div class="deb-sec">
    <div class="caveat">${SCN.caveat}</div>
  </div>

  <div class="mt center flexline" style="justify-content:center">
    <button class="btn-ghost" data-act="restart">Run it again</button>
    <button class="btn-go" data-act="toPicker">Back to scenarios</button>
  </div>`;
}

function domainScore(d){
  let sum=0, n=0;
  d.nodes.forEach(id=>{
    const c=S.choices[id]; if(!c) return;
    const k=SCN.nodes.find(x=>x.id===id).opts[c.i].k;
    sum += k==="def"?100 : k==="risk"?55 : 15;
    n++;
    if(S.ccRecovered["CC3"] && id==="N5") sum+=20; // credit a recovery
  });
  const pct = n? Math.max(0,Math.min(100,Math.round(sum/n))) : 0;
  const col = pct>=80?"var(--good)" : pct>=50?"var(--warn)" : "var(--bad)";
  const label = pct>=80?"Strong" : pct>=50?"Developing" : "Needs work";
  return {nm:d.nm, note:d.note, pct, col, label};
}
function capturedEvents(){
  const out=[];
  const push=(lab,val)=>out.push(`<span class="ev">${lab}${val?": <b>"+val+"</b>":""}</span>`);
  const promise=S.telem.find(e=>e.ev==="PROMISE_MADE");
  if(promise) push("Confidentiality", promise.confidentiality?"promised":"not promised");
  const q=S.telem.filter(e=>e.ev==="QUESTION_TYPE").pop();
  if(q) push("Questioning", q.type);
  const rep=S.telem.find(e=>e.ev==="REPORT_MADE");
  if(rep) push("Reported to", rep.to + (rep.within_shift?", within shift":", late"));
  const rec=S.telem.find(e=>e.ev==="RECORD_MADE");
  if(rec) push("Record", rec.verbatim?"verbatim":"from memory");
  const ev=S.telem.find(e=>e.ev==="EVIDENCE_PRESERVED");
  if(ev) push("Evidence", ev.preserved?"preserved":"lost");
  const pat=S.telem.find(e=>e.ev==="PATTERN_LINKED");
  if(pat) push("Second concern", pat.items_linked>=2?"reported separately":"folded in");
  const w=S.telem.find(e=>e.ev==="WISHES_SOUGHT");
  if(w) push("Her wishes", (w.sought?"asked":"not asked"));
  const alt=S.telem.find(e=>e.ev==="REPORT_MADE"&&e.to==="la");
  if(alt) push("Alternative route","used");
  return out.join("") || `<span class="ev">No decisions captured</span>`;
}

/* =========================================================================
   INTERACTION
   ========================================================================= */
function go(stage){ S.stage=stage; render(); }
function bind(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click",()=>handle(el.dataset.act, el));
  });
  document.querySelectorAll("[data-tf]").forEach(el=>{
    el.addEventListener("input",()=>{ S.transfer[el.dataset.tf]=el.value; save(); });
  });
}
function handle(act, el){
  switch(act){
    case "begin": go("landing"); break;
    case "toNotice": go("notice"); break;
    case "toHandover": go("handover"); break;
    case "optOut": S.optedOut=true; stopClock(); go("picker"); S=initState(); break;
    case "startRun": startClock(); go("run"); break;
    case "doc": openDoc(el.dataset.id); break;
    case "conf": setConf(el.dataset.id, +el.dataset.v); break;
    case "select": S.pending=+el.dataset.i; render(); break;
    case "submit": if(S.pending!=null) choose(S.pending); break;
    case "recover": recover(+el.dataset.i); break;
    case "next": nextNode(); break;
    case "toDebrief": go("debrief"); break;
    case "toPicker": stopClock(); S=initState(); go("picker"); break;
    case "restart": stopClock(); S=initState(); S.stage="landing"; startRunReset(); render(); break;
  }
}
function startRunReset(){ /* landing after restart */ }

let docModal=null;
function openDoc(id){
  if(!S.opened[id]){ S.opened[id]=true; log("DOC_OPENED",{doc_id:id, open_order:Object.keys(S.opened).length}); }
  const d=SCN.docs.find(x=>x.id===id);
  const body=d.body.map(b=> typeof b==="string"?`<p>${b}</p>`:`<p class="dl-h">${b.h}</p>`).join("");
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="m-kick">Record on file</div>
    <h3>${d.nm}</h3>
    <div class="m-prov">${d.prov}</div>
    <div class="m-doc">${body}</div>
    <div class="m-close"><button class="btn-go" data-close>Close</button></div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>{ bg.remove(); document.removeEventListener("keydown",esc); };
  const esc=(e)=>{ if(e.key==="Escape") close(); };
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  bg.querySelector("[data-close]").addEventListener("click",close);
  document.addEventListener("keydown",esc);
  // re-render rail opened state behind modal
  const rail=document.querySelector(`.doc-row[data-id="${id}"]`);
  if(rail){ rail.classList.add("opened"); rail.querySelector(".d-sub").textContent="Reviewed"; }
  save();
}
function setConf(id,v){
  const first=!S.confidence[id];
  S.confidence[id]=v;
  if(first) log("CONFIDENCE",{node_id:id, value:v});
  render(); // re-render so the options unlock and the chosen level shows
}
function choose(i){
  const node=SCN.nodes[S.nodeIdx];
  const o=node.opts[i];
  S.choices[node.id]={i, k:o.k};
  // telemetry
  if(node.telemCore) log(node.telemCore, Object.assign({node_id:node.id}, o.telem||{}));
  // critical control
  if(o.cc){
    const def=SCN.ccDefs[o.cc];
    S.ccTripped[o.cc]=true;
    if(def.kind==="recover"){ S.recoverFrom=node.id; }
  }
  S.sub="beat";
  // if a hard-fail collection happened, stop clock on N6
  if(node.id==="N6") stopClock();
  render();
}
function recover(i){
  const node=SCN.nodes[S.nodeIdx];
  const o=node.opts[i];
  // mark the earlier trip recovered if they now pick defensible
  if(o.k==="def"){ Object.keys(S.ccTripped).forEach(k=>{ if(SCN.ccDefs[k].kind==="recover" && S.recoverFrom===node.id) S.ccRecovered[k]=true; }); }
  S.choices[node.id]={i, k:o.k};
  if(node.telemCore) log(node.telemCore, Object.assign({node_id:node.id, recovered:true}, o.telem||{}));
  S.recoverFrom=null;
  S.sub="beat";
  render();
}
function nextNode(){
  if(S.nodeIdx >= SCN.nodes.length-1){
    stopClock();
    const path=outcomePath();
    markComplete();
    if(path==="A"){ go("debrief"); }
    else { go("aftermath"); }
    return;
  }
  S.nodeIdx++;
  S.sub="decide";
  S.pending=null;
  render();
}

/* restart chrome */
document.getElementById("restartBtn").addEventListener("click",()=>{ stopClock(); S=initState(); render(); });
document.getElementById("scenariosBtn").addEventListener("click",()=>{ stopClock(); S.clockRunning=false; S.stage="picker"; save(); render(); });

// On a mid-run reload the previous countdown timer is gone, so always restart it
// (the saved clockRunning flag is stale after a refresh). Resumes from the saved time left.
if(S.stage==="run"){ S.clockRunning=false; startClock(); }
render();
</script>
