<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PracticE Ready - Safeguarding Adults</title>
<meta name="description" content="Safeguarding Adults connected simulation. A readiness check for applied safeguarding judgement.">
<!--
  Safeguarding Adults Connected Simulation - standalone prototype (safeguarding.html).
  Built to the PracticE Ready Master Specification v1.0 (Emma Reeve). Companion to the
  choking programme (index.html / frontline.html) but DECOUPLED by rule: reuses brand and
  engine patterns only, never imports or links them.

  FIRST BUILD = SG-F3 "She Tells You at Ten Past Four" vertical slice (per spec s19-20).
  The engine (picker, run, aftermath, debrief, telemetry) is scenario-driven so F1/F2/F4
  drop in later as data bundles.

  BUILD NOTES / TODO before any client send:
   - Font: uses a system Source Sans-like stack. Port the embedded base64 Source Sans 3
     @font-face blocks from frontline.html before SCORM packaging (offline-safe).
   - Media: intro + handover + debrief use placeholder slots. Real avatar clips drop in
     the same way Frontline did (see docs/SG-video-scripts.md).
   - Person-specific facts for Nadia are PROVISIONAL (spec s19.3); held in one config
     object (SCN) so a Source of Truth lock is a single edit.
   - No em dashes anywhere in user-facing copy (house rule).
-->
<style>
/* ---- Brand tokens: inherited verbatim from the finalised PracticE Ready palette (frontline.html) ---- */
:root{
  --ground:#f4f7fc; --ground-2:#fbfcff; --surface:#ffffff; --surface-2:#f3f6fb; --surface-3:#e8eef6;
  --violet:#8a3ccb; --sheen:rgba(255,255,255,.85);
  --ink:#072a6b; --ink-2:#3c4f86; --ink-3:#5b6892; --ink-4:#5b6892;
  --line:#c9cdd4; --line-2:#e4e7ec;
  --navy:#0a2f7a; --navy-2:#072a6b; --navy-ink:#ffffff;
  --teal:#16afc2; --teal-strong:#0e8b9a; --teal-tint:#e3f6fa; --teal-deep:#0b6b78;
  --go:#ff7a1a; --go-sh:#d9620d; --kicker-bg:#e3f6fa; --kicker-line:#b9e4ec;
  --good:#0c7038; --good-tint:#e4f6ec; --good-line:#bde7cd;
  --warn:#9a5109; --warn-tint:#fff2e0; --warn-line:#f5d6a6;
  --bad:#c0281f; --bad-tint:#fdeae8; --bad-line:#f4c4bf;
  --shadow:0 2px 6px rgba(20,38,74,.06),0 14px 30px rgba(20,38,74,.10);
  --r:12px; --r-sm:8px; --r-lg:18px;
  --sans:"Source Sans 3","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:var(--sans);
  --t-hero:40px; --t-h1:29px; --t-h2:22px; --t-h3:18px;
  --t-body:16.5px; --t-sm:15.5px; --t-cap:14.5px; --t-eyebrow:13px; --t-nano:12.5px;
}
/* Light theme only. The dark variant was removed on request (it always looked rubbish). */

*{box-sizing:border-box}
html,body{margin:0;padding:0}
::-webkit-scrollbar{width:0;height:0}
*{scrollbar-width:none}
body{
  font-family:var(--sans);font-size:var(--t-body);line-height:1.55;color:var(--ink);
  background:radial-gradient(1200px 600px at 80% -10%,var(--ground-2),transparent),var(--ground);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;cursor:pointer}
a{color:var(--teal-strong)}
:focus-visible{outline:2.5px solid var(--teal-strong);outline-offset:2px;border-radius:4px}
::selection{background:var(--teal);color:#fff}
.pr-e{color:var(--teal)}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px 46px}
.topbar{background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);box-shadow:var(--shadow);border-radius:var(--r-lg);display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;max-width:1180px;width:calc(100% - 40px);margin:14px auto 22px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.01em;font-size:var(--t-body)}
.brand .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--teal),#0a5f70);display:grid;place-items:center;color:#fff;font-weight:900}
.brand .brand-mark{width:34px;height:34px;border-radius:9px;object-fit:contain;display:block}
.brand small{font-weight:650;color:#c7d6f0;font-size:var(--t-cap);letter-spacing:.02em}
.tb-sp{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#eaf1fb;border-radius:100px;padding:7px 13px;font-size:var(--t-cap);font-weight:650}
.tb-btn:hover{background:rgba(255,255,255,.16)}
.tb-btn.tb-icon{padding:7px 9px}
.tb-btn svg{flex:none}

.eyebrow{font-size:var(--t-eyebrow);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-strong)}
.btn-go{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,#0d8091,#0a6675);color:#fff;border:0;border-radius:var(--r);padding:13px 22px;font-weight:750;font-size:var(--t-body);box-shadow:0 6px 18px rgba(13,132,148,.42),inset 0 0 0 1px rgba(34,201,223,.22);transition:filter .15s,transform .1s}
.btn-go:hover{filter:brightness(1.07)}
.btn-go:active{transform:translateY(1px)}
.btn-go[disabled]{background:var(--surface-3);color:var(--ink-4);box-shadow:none;cursor:not-allowed;filter:none}
.btn-ghost{display:inline-flex;align-items:center;gap:9px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;font-weight:700;font-size:var(--t-body)}
.btn-ghost:hover{background:var(--surface-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}

/* ---- Picker ---- */
.pick-head{margin:0 0 20px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:28px 32px}
.pick-head h1{font-size:var(--t-h1);letter-spacing:-.02em}
.pick-head p{font-size:var(--t-h3);line-height:1.5;color:var(--ink-2);margin-top:12px;max-width:68ch}
.pick-head .pick-cta{margin-top:10px;font-weight:800;color:var(--ink)}
.scn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.scn-card{position:relative;text-align:left;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:20px 22px;transition:transform .16s,box-shadow .16s,border-color .16s;width:100%;color:inherit}
.scn-card.ready{cursor:pointer}
.scn-card.ready:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 var(--sheen),0 10px 28px rgba(7,42,107,.16);border-color:var(--teal)}
.scn-top{display:flex;align-items:flex-start;gap:14px;padding-right:118px}
.scn-badge{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;background:linear-gradient(150deg,var(--teal),#0a5f70)}
.scn-card[data-accent="navy"] .scn-badge{background:linear-gradient(150deg,#0e3a86,var(--navy))}
.scn-card[data-accent="violet"] .scn-badge{background:linear-gradient(150deg,var(--violet),#6d2fa8)}
.scn-card .code{font-size:var(--t-nano);font-weight:800;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.scn-card h3{font-size:var(--t-h2);letter-spacing:-.01em;margin:3px 0 4px;color:var(--ink)}
.scn-who{font-size:var(--t-sm);color:var(--ink-2);margin:0}
.scn-who b{color:var(--ink);font-weight:700}
.scn-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.status-pill{position:absolute;top:18px;right:20px;display:inline-flex;align-items:center;gap:6px;font-size:var(--t-cap);font-weight:750;border-radius:100px;padding:5px 12px}
.status-pill svg{flex:none}
.status-pill.ready,.status-pill.done{background:var(--kicker-bg);color:var(--teal-strong);border:1px solid var(--kicker-line)}
.status-pill.build,.status-pill.locked{background:rgba(120,134,156,.14);color:var(--ink-3);border:1px solid var(--line)}
.scn-card.build{opacity:.75}
.scn-card.build .scn-badge{filter:grayscale(.55);opacity:.85}
.scn-go{font-weight:800;color:var(--teal-strong)}
.scn-go.sc-locked{color:var(--ink-3);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.scn-go.sc-locked svg{flex:none}

/* ---- Landing ---- */
.land-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:stretch}
.land-copy{min-width:0;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:26px 32px}
.land-kicker{display:inline-flex;align-items:center;gap:8px;background:var(--kicker-bg);color:var(--teal-strong);border:1px solid var(--kicker-line);border-radius:100px;padding:6px 14px;font-size:var(--t-cap);font-weight:750;letter-spacing:.04em;align-self:flex-start}
.land-logo{height:50px;width:auto;align-self:flex-start;display:block}
.land-role{display:flex;align-items:center;gap:9px;background:var(--teal-tint);color:var(--teal-deep);border:1px solid var(--kicker-line);border-radius:100px;padding:10px 18px;font-weight:750;font-size:var(--t-sm);margin-top:18px;align-self:stretch}
.land-role svg{flex:none}
.land-copy h1{font-size:var(--t-hero);letter-spacing:-.025em;margin:16px 0 0;line-height:1.04}
.land-copy .lead{font-size:var(--t-h3);line-height:1.55;color:var(--ink-2);margin-top:16px}
.land-media{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;min-height:280px}
.media-ph{width:100%;aspect-ratio:16/9;border-radius:var(--r);background:repeating-linear-gradient(135deg,var(--surface-3),var(--surface-3) 12px,var(--surface-2) 12px,var(--surface-2) 24px);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:var(--ink-3);border:1px dashed var(--line)}
.media-ph .pl-ic{font-size:30px}
.land-media video.land-video{width:100%;aspect-ratio:16/9;border-radius:var(--r);border:1px solid var(--line);background:#000;display:block;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.vid-wrap{position:relative;width:100%}
.vid-cap{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);max-width:92%;background:rgba(7,19,45,.84);color:#fff;padding:5px 12px;border-radius:7px;font-size:var(--t-sm);line-height:1.32;text-align:center;opacity:0;transition:opacity .12s;pointer-events:none}
.vid-cap.on{opacity:1}
.land-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.lf{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.lf-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:19px;background:linear-gradient(160deg,var(--teal),#0a5f70);margin-bottom:10px}
.lf:nth-child(2) .lf-ic{background:linear-gradient(160deg,var(--violet),#7331ad)}
.lf:nth-child(3) .lf-ic{background:linear-gradient(160deg,#d94a8a,#a62d64)}
.lf h4{font-size:var(--t-h3)}
.lf p{font-size:var(--t-sm);color:var(--ink-2);margin-top:5px;line-height:1.45}
.land-cta{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:18px;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 26px;box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.land-cta .lc-prompt{margin:0;font-size:var(--t-h3);color:var(--ink-2);font-weight:600}
.land-cta .lc-prompt b{color:var(--ink);font-weight:800}

/* ---- Notice / content warning + opt out ---- */
.notice{max-width:760px;margin:0 auto}
.notice .card{padding:34px 38px}
.notice .n-ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:#fff;background:linear-gradient(160deg,var(--warn),#7a3f06)}
.notice h1{font-size:var(--t-h1);margin:16px 0 0;letter-spacing:-.01em}
.notice p{color:var(--ink-2);margin-top:12px;line-height:1.6}
.notice ul{margin:12px 0 0;padding-left:20px;color:var(--ink-2)}
.notice li{margin:6px 0}
.n-support{margin-top:18px;background:var(--teal-tint);border:1px solid var(--kicker-line);border-radius:var(--r);padding:14px 18px;font-size:var(--t-sm);color:var(--ink-2)}
.n-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

/* ---- Run shell ---- */
.run-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.clock{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);border-radius:var(--r-lg);padding:12px 20px;box-shadow:var(--shadow)}
.clock .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .cl-lab{font-size:var(--t-nano);text-transform:uppercase;letter-spacing:.1em;color:#9fc0ef;font-weight:750}
.clock.warn{background:linear-gradient(180deg,#8a2d14,#6e2410)}
.clock.warn .cl-lab{color:#f6c6a0}
.now{font-size:var(--t-sm);color:var(--ink-2)}
.now b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.progress{flex:1;min-width:120px}
.progress .bar{height:8px;border-radius:100px;background:var(--surface-3);overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-strong));transition:width .4s}
.progress .pl{font-size:var(--t-nano);color:var(--ink-3);margin-top:5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

.run-grid{display:grid;grid-template-columns:1fr 460px;gap:22px;align-items:start}
.scene-side{aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);background:var(--surface-2);display:flex;align-items:flex-end;position:relative}
.scene-side .ph{position:absolute;inset:0;background:repeating-linear-gradient(135deg,var(--surface-3),var(--surface-3) 12px,var(--surface-2) 12px,var(--surface-2) 24px);display:grid;place-items:center;color:var(--ink-4);font-size:var(--t-cap)}
.scene-side .sc-cap{position:relative;z-index:1;background:linear-gradient(0deg,rgba(7,42,107,.82),transparent);color:#fff;width:100%;padding:11px 15px;font-weight:700;font-size:var(--t-sm)}
.scene-side img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.moment{margin-top:0}
.moment .m-kick{display:inline-flex;gap:8px;align-items:center;font-size:var(--t-cap);font-weight:800;color:var(--teal-strong);text-transform:uppercase;letter-spacing:.08em}
.moment h2{font-size:var(--t-h2);margin:10px 0 0;letter-spacing:-.01em}
.moment .m-body{margin-top:12px;color:var(--ink-2);line-height:1.6}
.speech{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;font-size:var(--t-h3);color:var(--ink);font-style:italic}
.speech .sp-who{display:block;font-style:normal;font-size:var(--t-nano);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}

.opts{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;transition:border-color .15s,background .15s,transform .1s;color:var(--ink)}
.opt:hover{border-color:var(--teal);background:var(--teal-tint)}
.opt:active{transform:translateY(1px)}
.opt .ob{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-3);color:var(--teal-strong);display:grid;place-items:center;font-weight:800;margin-top:1px}
.opt .ot{font-size:var(--t-body);line-height:1.45}
.opt.sel{border-color:var(--teal);background:var(--teal-tint);box-shadow:inset 0 0 0 1px var(--teal)}
.opt.sel .ob{background:var(--teal);color:#fff}
.submit-row{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.submit-hint{font-size:var(--t-cap);color:var(--ink-3)}
.q-ask{margin-top:12px;font-size:var(--t-cap);color:var(--ink-3);font-weight:700}

/* consequence beat */
.beat{margin-top:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px}
.beat .bt-tag{display:inline-flex;align-items:center;gap:7px;font-size:var(--t-nano);font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:100px}
.bt-tag.ok{background:var(--good-tint);color:var(--good);border:1px solid var(--good-line)}
.bt-tag.risk{background:var(--warn-tint);color:var(--warn);border:1px solid var(--warn-line)}
.bt-tag.fail{background:var(--bad-tint);color:var(--bad);border:1px solid var(--bad-line)}
.beat p{margin-top:12px;color:var(--ink-2);line-height:1.6}
.bt-next{margin-top:16px}

/* recovery banner */
.recovery{margin-top:18px;background:var(--warn-tint);border:1px solid var(--warn-line);border-radius:var(--r);padding:18px 22px}
.recovery h3{font-size:var(--t-h3);color:var(--warn)}
.recovery p{margin-top:8px;color:var(--ink-2);line-height:1.6}

/* ---- Records rail ---- */
.rail{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px}
.rail .rl-title{font-size:var(--t-cap);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.rail-panel{background:var(--teal-tint);border:1px solid var(--kicker-line);border-radius:var(--r-lg);padding:14px}
.doc-row{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:9px;color:var(--ink)}
.doc-row:last-child{margin-bottom:0}
.doc-row:hover{border-color:var(--teal)}
.doc-row.opened{background:var(--good-tint);border-color:var(--good-line)}
.doc-row .d-ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--surface-3);color:var(--teal-strong);display:grid;place-items:center;font-size:15px}
.doc-row .d-nm{font-size:var(--t-sm);font-weight:700;line-height:1.25}
.doc-row .d-sub{font-size:var(--t-nano);color:var(--ink-3)}
.inject{background:var(--surface);border:1px solid var(--bad-line);border-radius:var(--r-lg);padding:14px 16px}
.inject .in-tag{font-size:var(--t-nano);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bad)}
.inject p{font-size:var(--t-sm);color:var(--ink-2);margin-top:7px;line-height:1.5}

/* ---- Modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(7,19,45,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);max-width:600px;width:100%;max-height:84vh;overflow:auto;padding:28px 32px}
.modal .m-kick{font-size:var(--t-nano);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-strong)}
.modal h3{font-size:var(--t-h2);margin:6px 0 0}
.modal .m-prov{font-size:var(--t-cap);color:var(--ink-3);margin-top:4px}
.modal .m-doc{margin-top:16px;color:var(--ink-2);line-height:1.65}
.modal .m-doc p{margin-top:12px}
.modal .m-doc .dl-h{font-weight:800;color:var(--ink);margin-top:16px}
.modal .m-close{margin-top:22px;display:flex;justify-content:flex-end}

/* confidence */
.conf{margin-top:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
.conf p{font-weight:700}
.conf .cf-row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.cf-dot{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:800;color:var(--ink-2)}
.cf-dot:hover{border-color:var(--teal);color:var(--teal-strong)}
.cf-dot.sel{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ---- Aftermath ---- */
.after{max-width:1120px;margin:0 auto}

.window{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:20px 22px;position:relative}

.ownwords .ow-q{font-style:italic;font-size:var(--t-h3);color:var(--ink);margin-top:8px}
.ownwords .ow-note{font-size:var(--t-sm);color:var(--ink-2);margin-top:8px}

.deb-sec{margin-top:18px}

.cc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);padding:18px}
.cc .cc-st{font-size:var(--t-nano);font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:100px;display:inline-block}
.cc.held .cc-st{background:var(--good-tint);color:var(--good);border:1px solid var(--good-line)}

.cc h4{font-size:var(--t-h3);margin:10px 0 0}

// Lightweight synthesized UI sound effects (Web Audio), gated by S.muted. Primed on first gesture.
const AUDIO = (function(){
  var ctx=null, master=null;
  function ensure(){ if(ctx) return ctx; try{ var AC=window.AudioContext||window.webkitAudioContext; ctx=new AC(); master=ctx.createGain(); master.gain.value=0.45; master.connect(ctx.destination); }catch(e){ ctx=null; } return ctx; }
  function unlock(){ if(!ensure()) return; if(ctx.state==="suspended") ctx.resume(); }
  function tone(type,freq,t0,dur,peak){ var o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t0); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(peak,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(g).connect(master); o.start(t0); o.stop(t0+dur+0.02); }
  function sfx(name){
    if(S.muted||!ensure()) return;
    if(ctx.state==="suspended"){ ctx.resume(); }
    var t=ctx.currentTime;
    if(name==="select"){ tone("sine",520,t,0.09,0.11); }
    else if(name==="confirm"){ tone("sine",470,t,0.08,0.11); tone("sine",700,t+0.07,0.12,0.10); }
    else if(name==="open"){ tone("triangle",380,t,0.09,0.09); }
    else if(name==="nav"){ tone("sine",440,t,0.07,0.08); }
    else if(name==="warn"){ tone("sine",300,t,0.14,0.13); tone("sine",232,t+0.1,0.2,0.11); }
  }
  return { unlock:unlock, sfx:sfx };
})();

/* =========================================================================
   CLOCK  (real running deadline, maps 16:10 -> 18:00)
   ========================================================================= */
function startClock(){
  if(S.clockRunning) return;
  S.clockRunning=true;
  tickClock();
}
function tickClock(){
  clearTimeout(timer);
  if(!S.clockRunning) return;
  timer=setTimeout(()=>{
    S.clockLeft = Math.max(0, S.clockLeft-1);
    if(S.clockLeft===0 && !S.deadlineHit){
      S.deadlineHit=true;
      onDeadline();
    }
    const el=document.getElementById("clockFace");
    if(el){ el.textContent=clockMMSS(); el.parentElement.classList.toggle("warn", S.clockLeft<=120); }
    const nowEl=document.getElementById("clockNow");
    if(nowEl) nowEl.textContent=worldTime();
    if(S.clockRunning) tickClock();
  },1000);
}
function stopClock(){ S.clockRunning=false; clearTimeout(timer); }
function clockMMSS(){ const m=Math.floor(S.clockLeft/60), s=S.clockLeft%60; return m+":"+String(s).padStart(2,"0"); }
function worldTime(){
  // map clockLeft (clockSeconds..0) onto the scenario's start -> deadline window
  const frac = 1 - (S.clockLeft/SCN.clockSeconds);
  const mins = Math.round(SCN.startMins + frac*SCN.spanMins);
  const h=Math.floor(mins/60), m=mins%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function onDeadline(){
  // if the learner has not safely resolved the deadline node in time, the control trips
  const dn=SCN.deadlineNode, di=SCN.nodes.findIndex(n=>n.id===dn);
  if(di>=0 && (S.nodeIdx < di || (S.nodeIdx===di && S.sub==="decide"))){
    S.flags.deadlineForced=true;
    S.ccTripped[SCN.deadlineCC||"CC2"]=true;
    log("DEADLINE_MISSED",{node_id:dn});
  }
}

function vtime(t){

function parseVTT(s){
  const cues=[];
  s.split(/\r?\n\r?\n+/).forEach(block=>{
    const lines=block.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const tl=lines.find(l=>l.includes("-->"));
    if(!tl) return;
    const [a,b]=tl.split("-->");
    const text=lines.slice(lines.indexOf(tl)+1).join(" ");
    if(text) cues.push({start:vtime(a), end:vtime(b.trim().split(" ")[0]), text});
  });
  return cues;
}
function setupVideoCaptions(){
  const wrap=document.querySelector(".vid-wrap"); if(!wrap) return;
  const v=wrap.querySelector("video"), cap=wrap.querySelector(".vid-cap"); if(!v||!cap) return;
  v.muted=!!S.muted;
  let vtt=null;
  if(S.stage==="landing" && SCN.intro) vtt=SCN.intro.vtt;
  else if(S.stage==="handover" && SCN.handover) vtt=SCN.handover.vtt;
  else if(S.stage==="debrief"){ const p=outcomePath(); if(SCN.debrief && SCN.debrief[p]) vtt=SCN.debrief[p].vtt; }
  if(!vtt) return;
  const cues=parseVTT(vtt);
  const upd=()=>{ const t=v.currentTime||0; const c=cues.find(x=>t>=x.start && t<x.end); cap.textContent=c?c.text:""; cap.classList.toggle("on", !!c); };
  v.addEventListener("timeupdate", upd); upd();
  // Autoplay: the learner reached this screen by clicking, so the document has
  // user activation and sound is allowed. If blocked, native controls remain.
  if(!v.dataset.autoplayed){ v.dataset.autoplayed="1"; const p=v.play(); if(p&&p.catch) p.catch(()=>{}); }
}

function outcomePath(){
  // hard-fail CCs => C ; recovered CC or any risky => B ; all clean => A
  const hardTrip = (S.ccTripped.CC1 && !S.ccRecovered.CC1) || (S.ccTripped.CC2 && !S.ccRecovered.CC2);
  if(hardTrip) return "C";
  const anyRisk = SCN.nodes.some(n=>{ const c=S.choices[n.id]; return c && n.opts[c.i].k!=="def"; });
  const recovered = S.ccRecovered.CC3 || S.ccRecovered.CC1 || S.ccRecovered.CC2;
  if(anyRisk || recovered) return "B";
  return "A";
}

function domainScore(d){
  let sum=0, n=0;
  d.nodes.forEach(id=>{
    const c=S.choices[id]; if(!c) return;
    const k=SCN.nodes.find(x=>x.id===id).opts[c.i].k;
    sum += k==="def"?100 : k==="risk"?55 : 15;
    n++;
    if(S.ccRecovered["CC3"] && id==="N5") sum+=20; // credit a recovery
  });
  const pct = n? Math.max(0,Math.min(100,Math.round(sum/n))) : 0;
  const col = pct>=80?"var(--good)" : pct>=50?"var(--warn)" : "var(--bad)";
  const label = pct>=80?"Strong" : pct>=50?"Developing" : "Needs work";
  return {nm:d.nm, note:d.note, pct, col, label};
}
function capturedEvents(){
  const out=[];
  const push=(lab,val)=>out.push(`<span class="ev">${lab}${val?": <b>"+val+"</b>":""}</span>`);
  const promise=S.telem.find(e=>e.ev==="PROMISE_MADE");
  if(promise) push("Confidentiality", promise.confidentiality?"promised":"not promised");
  const q=S.telem.filter(e=>e.ev==="QUESTION_TYPE").pop();
  if(q) push("Questioning", q.type);
  const rep=S.telem.find(e=>e.ev==="REPORT_MADE");
  if(rep) push("Reported to", rep.to + (rep.within_shift?", within shift":", late"));
  const rec=S.telem.find(e=>e.ev==="RECORD_MADE");
  if(rec) push("Record", rec.verbatim?"verbatim":"from memory");
  const ev=S.telem.find(e=>e.ev==="EVIDENCE_PRESERVED");
  if(ev) push("Evidence", ev.preserved?"preserved":"lost");
  const pat=S.telem.find(e=>e.ev==="PATTERN_LINKED");
  if(pat) push("Second concern", pat.items_linked>=2?"reported separately":"folded in");
  const w=S.telem.find(e=>e.ev==="WISHES_SOUGHT");
  if(w) push("Their wishes", (w.sought?"asked":"not asked"));
  const alt=S.telem.find(e=>e.ev==="REPORT_MADE"&&e.to==="la");
  if(alt) push("Alternative route","used");
  return out.join("") || `<span class="ev">No decisions captured</span>`;
}

/* =========================================================================

function go(stage){ endTour(); S.stage=stage; render(); }
function bind(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click",()=>handle(el.dataset.act, el));
  });
  document.querySelectorAll("[data-tf]").forEach(el=>{
    el.addEventListener("input",()=>{ S.transfer[el.dataset.tf]=el.value; save(); });
  });
}
function handle(act, el){
  const SFX={begin:"nav",toNotice:"nav",toHandover:"nav",optOut:"nav",startRun:"nav",next:"nav",toDebrief:"nav",toPicker:"nav",restart:"nav",select:"select",submit:"confirm",conf:"select",doc:"open",recover:"select"};
  if(SFX[act]) AUDIO.sfx(SFX[act]);
  switch(act){
    case "begin": { const code=el.dataset.scn||"SG-F3"; const mute=S.muted; bindScenario(code); S=initState(); S.scenario=code; S.muted=mute; S.stage="landing"; render(); break; }
    case "toNotice": go("notice"); break;
    case "toHandover": go("handover"); break;
    case "optOut": S.optedOut=true; stopClock(); go("picker"); S=initState(); break;
    case "startRun": startClock(); go("run"); break;
    case "doc": openDoc(el.dataset.id); break;
    case "conf": setConf(el.dataset.id, +el.dataset.v); break;
    case "select": S.pending=+el.dataset.i; render(); break;
    case "submit": if(S.pending!=null) choose(S.pending); break;
    case "recover": recover(+el.dataset.i); break;
    case "next": nextNode(); break;
    case "toDebrief": go("debrief"); break;
    case "toPicker": stopClock(); S=initState(); go("picker"); break;
    case "restart": stopClock(); S=initState(); S.stage="landing"; startRunReset(); render(); break;
  }
}
function startRunReset(){ /* landing after restart */ }

function openDoc(id){
  if(!S.opened[id]){ S.opened[id]=true; log("DOC_OPENED",{doc_id:id, open_order:Object.keys(S.opened).length}); }
  const d=SCN.docs.find(x=>x.id===id);
  const body=d.body.map(b=> typeof b==="string"?`<p>${b}</p>`:`<p class="dl-h">${b.h}</p>`).join("");
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="m-kick">Record on file</div>
    <h3>${d.nm}</h3>
    <div class="m-prov">${d.prov}</div>
    <div class="m-doc">${body}</div>
    <div class="m-close"><button class="btn-go" data-close>Close</button></div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>{ bg.remove(); document.removeEventListener("keydown",esc); };
  const esc=(e)=>{ if(e.key==="Escape") close(); };
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  bg.querySelector("[data-close]").addEventListener("click",close);
  document.addEventListener("keydown",esc);
  // re-render rail opened state behind modal
  const rail=document.querySelector(`.doc-row[data-id="${id}"]`);
  if(rail){ rail.classList.add("opened"); rail.querySelector(".d-sub").textContent="Reviewed"; }
  save();
}
function setConf(id,v){
  const first=!S.confidence[id];
  S.confidence[id]=v;
  if(first) log("CONFIDENCE",{node_id:id, value:v});
  render(); // re-render so the options unlock and the chosen level shows
}
function choose(i){
  const node=SCN.nodes[S.nodeIdx];
  const o=node.opts[i];
  S.choices[node.id]={i, k:o.k};
  // telemetry
  if(node.telemCore) log(node.telemCore, Object.assign({node_id:node.id}, o.telem||{}));
  // critical control
  if(o.cc){
    const def=SCN.ccDefs[o.cc];
    S.ccTripped[o.cc]=true;
    if(def.kind==="recover"){ S.recoverFrom=node.id; }
  }
  S.sub="beat";
  // if a hard-fail collection happened, stop clock on N6
  if(node.hardDeadline) stopClock();
  render();
}
function recover(i){
  const node=SCN.nodes[S.nodeIdx];
  const o=node.opts[i];
  // mark the earlier trip recovered if they now pick defensible
  if(o.k==="def"){ Object.keys(S.ccTripped).forEach(k=>{ if(SCN.ccDefs[k].kind==="recover" && S.recoverFrom===node.id) S.ccRecovered[k]=true; }); }
  S.choices[node.id]={i, k:o.k};
  if(node.telemCore) log(node.telemCore, Object.assign({node_id:node.id, recovered:true}, o.telem||{}));
  S.recoverFrom=null;
  S.sub="beat";
  render();
}
function nextNode(){
  if(S.nodeIdx >= SCN.nodes.length-1){
    stopClock();
    const path=outcomePath();
    markComplete();
    // Only the failing path (C, harm continued) plays the aftermath; A and B go
    // straight to the debrief (a recovered near miss is a success, not a failure).
    if(path==="C"){ go("aftermath"); }
    else { go("debrief"); }
    return;
  }
  S.nodeIdx++;
  S.sub="decide";
  S.pending=null;
  render();
}

/* ---- How-to-play coach tour (ported from the choking sim) ---- */
const TOURS={
  picker:[
    {sel:'.scn-card',ico:'play',h:'Choose a scenario',p:'Pick a shift to play. Only the one marked Ready to play can be started; the others are coming soon.',place:'bottom'}
  ],
  landing:[
    {sel:'.land-video',ico:'play',h:'Watch the intro',p:'A short clip sets up the shift and who you are supporting. It plays right here.',place:'left'},
    {sel:'.land-cta .btn-go',ico:'arrowR',h:'Begin when ready',p:'When you have read the brief, start the shift. The clock begins when you go through.',place:'top'}
  ],
  notice:[
    {sel:'.n-support',ico:'shield',h:'You can stop any time',p:'This scenario can be heavy. You can opt out at any point, with no score penalty and no flag to your employer.',place:'top'}
  ],
  handover:[
    {sel:'.land-video',ico:'play',h:'Your handover',p:'The handover briefing for the shift. Watch it, then go through to the kitchen. The clock starts when you do.',place:'left'}
  ],
  run:[
    {sel:'.clock',ico:'clock',h:'Time left',p:'The shift runs on a live countdown to the six o’clock collection. Reading records and deciding both use time.',place:'bottom'},
    {sel:'.moment',ico:'eye',h:'The moment',p:'Read the scene, pick an option, rate your confidence, then submit. Some options are plausible but not the safest.',place:'right'},
    {sel:'.rail',ico:'fileText',h:'Records',p:'Open these to read what the house holds before you act. The debrief notes what you checked.',place:'left'}
  ],
  debrief:[
    {sel:'.cc-grid',ico:'check',h:'What it turned on',p:'The two controls this scenario really turned on, shown held or tripped.',place:'bottom'},
    {sel:'.dom',ico:'shield',h:'How your practice held up',p:'Your score across each domain of safe practice, with a note under each.',place:'right'}
  ]
};
let tourSteps=[], tourIdx=0;
function tourRoot(){
  let e=document.getElementById('sg-tour-root');
  if(!e){ e=document.createElement('div'); e.id='sg-tour-root'; document.body.appendChild(e);
    e.addEventListener('click',ev=>{ const b=ev.target.closest('[data-tour]'); if(!b) return; const a=b.getAttribute('data-tour'); if(a==='next') tourNext(); else if(a==='prev') tourPrev(); else endTour(); });
  }
  return e;
}
function tourActive(){ return !!tourRoot().innerHTML; }
function tourForStage(){ return TOURS[S.stage]||[]; }
function tourSeen(st){ try{ return (localStorage.getItem('sg_tour_v1')||'').split(',').indexOf(st)>=0; }catch(e){ return false; } }
function markTourSeen(st){ try{ const v=(localStorage.getItem('sg_tour_v1')||'').split(',').filter(Boolean); if(v.indexOf(st)<0){ v.push(st); localStorage.setItem('sg_tour_v1',v.join(',')); } }catch(e){} }
function startTour(steps){ tourSteps=(steps&&steps.length)?steps:tourForStage(); tourIdx=0; if(!tourSteps.length) return; showTourStep(0); }
function endTour(){ tourRoot().innerHTML=''; }
function tourNext(){ if(tourIdx>=tourSteps.length-1){ endTour(); return; } showTourStep(++tourIdx); }
function tourPrev(){ if(tourIdx<=0) return; showTourStep(--tourIdx); }
function showTourStep(i){
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const step=tourSteps[i];
  const t=step && document.querySelector(step.sel);
  const r=t && t.getBoundingClientRect();
  if(!t||!r||(r.width===0&&r.height===0)){ if(i<tourSteps.length-1){ tourIdx=i+1; return showTourStep(i+1); } endTour(); return; }
  const vw=window.innerWidth, vh=window.innerHeight, pad=8, popW=320, popH=200, gap=14;
  const spot={t:r.top-pad,l:r.left-pad,w:r.width+pad*2,h:r.height+pad*2};
  let popL=0, popT=0;
  const below=()=>{ popT=r.bottom+gap; popL=cl(r.left+r.width/2-popW/2,12,vw-popW-12); return popT+popH<vh-8; };
  const above=()=>{ popT=r.top-gap-popH; popL=cl(r.left+r.width/2-popW/2,12,vw-popW-12); return popT>8; };
  const leftP=()=>{ popL=r.left-gap-popW; popT=cl(r.top,12,vh-popH-12); return popL>8; };
  const rightP=()=>{ popL=r.right+gap; popT=cl(r.top,12,vh-popH-12); return popL+popW<vw-8; };
  let plClass='pl-bottom';
  const tryPlace=(name)=>{ if(name==='left'&&leftP()){plClass='pl-left';return true;} if(name==='top'&&above()){plClass='pl-top';return true;} if(name==='right'&&rightP()){plClass='pl-right';return true;} if(name==='bottom'&&below()){plClass='pl-bottom';return true;} return false; };
  if(!tryPlace(step.place)){ if(below()){plClass='pl-bottom';} else if(above()){plClass='pl-top';} else if(leftP()){plClass='pl-left';} else { rightP(); plClass='pl-right'; } }
  const arrowStyle=(plClass==='pl-top'||plClass==='pl-bottom') ? 'left:'+Math.round(cl(r.left+r.width/2-popL-7,12,popW-26))+'px' : 'top:'+Math.round(cl(r.top+r.height/2-popT-7,12,popH-26))+'px';
  const last=i===tourSteps.length-1;
  tourRoot().innerHTML='<div class="fl-tour">'
    +'<div class="fl-tour-block" data-tour="skip"></div>'
    +'<div class="fl-tour-spot" style="top:'+spot.t+'px;left:'+spot.l+'px;width:'+spot.w+'px;height:'+spot.h+'px"></div>'
    +'<div class="fl-pop '+plClass+'" style="top:'+Math.round(popT)+'px;left:'+Math.round(popL)+'px" role="dialog" aria-label="'+step.h+'">'
    +'<div class="fp-arrow" style="'+arrowStyle+'"></div>'
    +'<span class="fp-num">Step '+(i+1)+' of '+tourSteps.length+'</span>'
    +'<h4><span class="fp-ico">'+icon(step.ico,17)+'</span>'+step.h+'</h4>'
    +'<p>'+step.p+'</p>'
    +'<div class="fp-foot"><div class="fp-dots">'+tourSteps.map((_,j)=>'<span class="fp-dot '+(j===i?'on':'')+'"></span>').join('')+'</div>'
    +'<div class="fp-btns">'
    +(i>0?'<button class="fl-tbtn" data-tour="prev">Back</button>':'<button class="fl-skip" data-tour="skip">Skip</button>')
    +'<button class="fl-tbtn primary" data-tour="next">'+(last?'Done':'Next')+'</button>'
    +'</div></div></div></div>';
}
window.addEventListener('resize',()=>{ if(tourActive()) showTourStep(tourIdx); });
document.getElementById("howToBtn").addEventListener("click",()=>startTour());

/* restart chrome */
function toggleFs(){ try{ if(isFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else { const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen).call(el); } }catch(e){} }
document.getElementById("restartBtn").addEventListener("click",()=>{ AUDIO.sfx("nav"); stopClock(); S=initState(); render(); });
document.getElementById("scenariosBtn").addEventListener("click",()=>{ AUDIO.sfx("nav"); stopClock(); S.clockRunning=false; S.stage="picker"; save(); render(); });
document.getElementById("muteBtn").addEventListener("click",()=>{ S.muted=!S.muted; document.querySelectorAll("video").forEach(v=>v.muted=S.muted); save(); AUDIO.unlock(); updateChrome(); });
document.getElementById("fsBtn").addEventListener("click",()=>toggleFs());
document.addEventListener("fullscreenchange", updateChrome);
document.addEventListener("webkitfullscreenchange", updateChrome);
document.addEventListener("pointerdown", ()=>AUDIO.unlock(), {once:true});

// On a mid-run reload the previous countdown timer is gone, so always restart it
// (the saved clockRunning flag is stale after a refresh). Resumes from the saved time left.
if(S.stage==="run"){ S.clockRunning=false; startClock(); }
render();
</script>
